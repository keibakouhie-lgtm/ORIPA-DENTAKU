// FINANCE VIEW: expenses ledger + monthly P&L
// ============================================================
function FinanceView({ expenses, addExpense, updateExpense, deleteExpense, staff, staffCompensation, setStaffPay, timePunches, oripaList, logsById, sessions }) {
  const currentMonth = todayKey().slice(0, 7);
  const [monthKey, setMonthKey] = useState(currentMonth);

  const finance = useMemo(
    () => computeMonthlyFinance(monthKey, oripaList, logsById, sessions, expenses, timePunches, staff, staffCompensation),
    [monthKey, oripaList, logsById, sessions, expenses, timePunches, staff, staffCompensation]
  );

  const shiftMonth = (offset) => {
    const [y, m] = monthKey.split("-").map(Number);
    const d = new Date(y, m - 1 + offset, 1);
    setMonthKey(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  };

  // add expense form
  const [addOpen, setAddOpen] = useState(false);
  const [newDate, setNewDate] = useState(todayKey());
  const [newCat, setNewCat] = useState("その他");
  const [newMemo, setNewMemo] = useState("");
  const [newAmount, setNewAmount] = useState("");

  const CATEGORIES = ["人件費", "交通費", "家賃", "光熱費", "仕入", "雑費", "その他"];

  const commit = () => {
    if (newAmount === "") return;
    addExpense(newDate, newCat, newMemo, newAmount);
    setNewMemo("");
    setNewAmount("");
    setAddOpen(false);
  };

  const bookedPayroll = expenses.some((e) => e.category === "人件費" && monthKeyOf(e.date) === monthKey && e.autoGeneratedFrom === "payroll");
  const bookPayroll = () => {
    // add one line per staff for wage + one line for commute
    finance.payroll.forEach((p) => {
      if (p.wage > 0) {
        addExpense(`${monthKey}-28`, "人件費", `${p.name} 給与 (${p.hours.toFixed(1)}h)`, Math.round(p.wage));
      }
      if (p.commute > 0) {
        addExpense(`${monthKey}-28`, "交通費", `${p.name} 交通費 (${p.workDays}日)`, Math.round(p.commute));
      }
    });
    alert("人件費・交通費を経費帳に転記しました");
  };

  const bookOripaCosts = () => {
    // book monthly gross payout as 仕入 cost line? Not asked. Skip.
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-center gap-2">
        <button onClick={() => shiftMonth(-1)} className="press rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, color: C.paper }}>◀</button>
        <span style={{ flex: 1, textAlign: "center", fontFamily: FONT_MONO, fontSize: 15, fontWeight: 700 }}>{monthKey}</span>
        <button onClick={() => shiftMonth(1)} className="press rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, color: C.paper }}>▶</button>
      </div>

      {/* P&L summary card */}
      <div className="rounded-xl p-4" style={{ background: C.surface, border: `1px solid ${C.gold}` }}>
        <div style={{ fontSize: 12, color: C.muted, marginBottom: 10 }}>月次サマリ</div>
        <div className="grid grid-cols-2 gap-3">
          <StatBlock label="売上" value={yen(finance.sales)} color={C.mint} />
          <StatBlock label="景品払出" value={yen(finance.payout)} color={C.coral} />
          <StatBlock label="粗利" value={yen(finance.grossProfit)} color={C.gold} />
          <StatBlock label="経費合計" value={yen(finance.payrollTotal + finance.otherExpensesTotal)} color={C.coral} />
        </div>
        <div className="flex justify-between items-center mt-3 pt-3" style={{ borderTop: `1px dashed ${C.line}` }}>
          <span style={{ fontSize: 13, color: C.muted }}>営業利益(粗利−経費)</span>
          <span style={{ fontFamily: FONT_MONO, fontWeight: 800, fontSize: 22, color: finance.netProfit >= 0 ? C.mint : C.coral }}>
            {finance.netProfit >= 0 ? "+" : ""}{yen(finance.netProfit)}
          </span>
        </div>
      </div>

      {/* payroll auto-calc */}
      <div className="rounded-xl p-3 flex flex-col gap-2" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div className="flex items-center justify-between">
          <span style={{ fontSize: 13, fontWeight: 700 }}>勤怠から自動計算(給与+交通費)</span>
          <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: C.gold, fontSize: 15 }}>{yen(finance.payrollTotal)}</span>
        </div>
        {finance.payroll.length === 0 ? (
          <div style={{ fontSize: 12, color: C.muted }}>この月の打刻記録がありません</div>
        ) : (
          <div className="flex flex-col gap-1">
            {finance.payroll.map((p) => (
              <div key={p.staffId} className="flex items-center justify-between rounded-md px-2 py-1.5" style={{ background: C.surfaceAlt }}>
                <span style={{ fontSize: 12 }}>{p.name}</span>
                <span style={{ fontSize: 11, color: C.muted, fontFamily: FONT_MONO }}>
                  {p.hours.toFixed(1)}h × {yen(p.hourlyWage)} + {p.workDays}日×{yen(p.commutePerDay)}
                </span>
                <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: C.gold, fontSize: 13 }}>{yen(p.total)}</span>
              </div>
            ))}
          </div>
        )}
        {finance.payroll.length > 0 && !bookedPayroll && (
          <button onClick={bookPayroll} className="press rounded-lg py-2 mt-1" style={{ background: C.gold, color: C.ink, fontSize: 12, fontWeight: 700 }}>
            この月の給与・交通費を経費帳に転記
          </button>
        )}
        {bookedPayroll && <div style={{ fontSize: 11, color: C.mint, textAlign: "center" }}>今月分は既に転記済み</div>}
      </div>

      {/* category breakdown */}
      {Object.keys(finance.expensesByCat).length > 0 && (
        <div className="rounded-xl p-3 flex flex-col gap-1.5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4 }}>項目別内訳</div>
          {Object.entries(finance.expensesByCat).sort((a, b) => b[1] - a[1]).map(([k, v]) => (
            <div key={k} className="flex justify-between items-center rounded-md px-2 py-1.5" style={{ background: C.surfaceAlt }}>
              <span style={{ fontSize: 12 }}>{k}</span>
              <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: C.coral, fontSize: 13 }}>{yen(v)}</span>
            </div>
          ))}
        </div>
      )}

      {/* expense ledger */}
      <div className="flex flex-col gap-2">
        <div className="flex items-center justify-between">
          <span style={{ fontSize: 13, fontWeight: 700 }}>経費帳(この月)</span>
          {!addOpen && (
            <button onClick={() => setAddOpen(true)} className="press rounded-lg px-3 py-1.5" style={{ background: C.gold, color: C.ink, fontSize: 12, fontWeight: 700 }}>
              ＋ 追加
            </button>
          )}
        </div>

        {addOpen && (
          <div className="rounded-xl p-3 flex flex-col gap-2" style={{ background: C.surface, border: `1px solid ${C.gold}` }}>
            <div className="flex gap-2">
              <input type="date" value={newDate} onChange={(e) => setNewDate(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1 }} />
              <select value={newCat} onChange={(e) => setNewCat(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_BODY, flex: 1 }}>
                {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <input value={newMemo} onChange={(e) => setNewMemo(e.target.value)} placeholder="メモ(例: 電気代)" style={{ ...inputStyle, fontFamily: FONT_BODY }} />
            <input type="number" value={newAmount} onChange={(e) => setNewAmount(e.target.value)} placeholder="金額(¥)" style={{ ...inputStyle, fontFamily: FONT_MONO }} />
            <div className="flex gap-2">
              <button onClick={() => setAddOpen(false)} className="press flex-1 rounded-lg py-2" style={{ border: `1px solid ${C.line}`, color: C.paper, fontSize: 12 }}>キャンセル</button>
              <button onClick={commit} className="press flex-1 rounded-lg py-2" style={{ background: C.gold, color: C.ink, fontSize: 12, fontWeight: 700 }}>登録</button>
            </div>
          </div>
        )}

        {finance.monthExpenses.length === 0 && !addOpen && (
          <div className="rounded-xl px-4 py-6 text-center" style={{ background: C.surface, border: `1px dashed ${C.line}`, color: C.muted, fontSize: 13 }}>
            この月の経費は未登録
          </div>
        )}

        {[...finance.monthExpenses].sort((a, b) => b.date.localeCompare(a.date)).map((e) => (
          <ExpenseRow key={e.id} entry={e} categories={CATEGORIES} update={(patch) => updateExpense(e.id, patch)} onDelete={() => deleteExpense(e.id)} />
        ))}
      </div>
    </div>
  );
}

function ExpenseRow({ entry, categories, update, onDelete }) {
  const [editing, setEditing] = useState(false);
  const [date, setDate] = useState(entry.date);
  const [category, setCategory] = useState(entry.category);
  const [memo, setMemo] = useState(entry.memo || "");
  const [amount, setAmount] = useState(String(entry.amount));

  const save = () => {
    update({ date, category, memo, amount: Number(amount) || 0 });
    setEditing(false);
  };

  if (editing) {
    return (
      <div className="rounded-xl p-3 flex flex-col gap-2" style={{ background: C.surface, border: `1px solid ${C.gold}` }}>
        <div className="flex gap-2">
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1 }} />
          <select value={category} onChange={(e) => setCategory(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_BODY, flex: 1 }}>
            {categories.map((c) => <option key={c} value={c}>{c}</option>)}
          </select>
        </div>
        <input value={memo} onChange={(e) => setMemo(e.target.value)} placeholder="メモ" style={{ ...inputStyle, fontFamily: FONT_BODY }} />
        <input type="number" value={amount} onChange={(e) => setAmount(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_MONO }} />
        <div className="flex gap-2">
          <button onClick={() => setEditing(false)} className="press flex-1 rounded-lg py-2" style={{ border: `1px solid ${C.line}`, color: C.paper, fontSize: 12 }}>キャンセル</button>
          <button onClick={save} className="press flex-1 rounded-lg py-2" style={{ background: C.gold, color: C.ink, fontSize: 12, fontWeight: 700 }}>保存</button>
        </div>
      </div>
    );
  }
  return (
    <div className="rounded-lg px-3 py-2 flex items-center justify-between" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
      <div className="flex-1 min-w-0">
        <div style={{ fontSize: 13 }}>
          <span style={{ fontFamily: FONT_MONO, color: C.muted, marginRight: 8 }}>{fmtDateKey(entry.date)}</span>
          <span style={{ fontSize: 10, color: C.gold, border: `1px solid ${C.gold}`, borderRadius: 999, padding: "1px 6px", marginRight: 6 }}>{entry.category}</span>
          {entry.memo}
        </div>
      </div>
      <div className="flex items-center gap-2">
        <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: C.coral, fontSize: 14 }}>{yen(entry.amount)}</span>
        <button onClick={() => setEditing(true)} style={{ color: C.gold, fontSize: 10, padding: "2px 6px" }}>編集</button>
        <button onClick={onDelete} style={{ color: C.muted }}><Trash2 size={13} /></button>
      </div>
    </div>
  );
}


// ---------- mount ----------
const __root = ReactDOM.createRoot(document.getElementById("root"));
__root.render(<OripaCalculator />);

</script>
</body>
</html>
