// ---------- STORE: 営業中のお客様管理 ----------
function ActiveCustomers({ oripaList, logsById, sessions, customers, startSession, endSession, reopenSession, recordSessionDraw, recordSessionWin, setSessionHazureNotRedeemed, undoLastSessionEntry }) {
  const [formOpen, setFormOpen] = useState(false);
  const [name, setName] = useState("");
  const [showSuggestions, setShowSuggestions] = useState(false);
  const [oripaId, setOripaId] = useState("");
  const [isForeign, setIsForeign] = useState(false);
  const [showDetails, setShowDetails] = useState(false);
  const [hiddenRevealed, setHiddenRevealed] = useState(false);
  const [hiddenTapCount, setHiddenTapCount] = useState(0);
  const tapHidden = () => {
    if (hiddenRevealed) return;
    const next = hiddenTapCount + 1;
    if (next >= 5) {
      setHiddenRevealed(true);
      setHiddenTapCount(0);
    } else {
      setHiddenTapCount(next);
    }
  };

  useEffect(() => {
    if (!oripaId && oripaList.length) setOripaId(oripaList[0].id);
  }, [oripaList, oripaId]);

  const activeSessions = sessions.filter((s) => !s.endTs).sort((a, b) => b.startTs - a.startTs);
  const endedToday = sessions
    .filter((s) => s.endTs && dateKeyOf(s.endTs) === todayKey())
    .sort((a, b) => b.endTs - a.endTs);

  const nameSuggestions =
    name.trim().length > 0
      ? customers
          .filter((c) => c.name.toLowerCase().includes(name.trim().toLowerCase()) && c.name !== name)
          .sort((a, b) => b.lastVisitTs - a.lastVisitTs)
          .slice(0, 5)
      : [];

  const submit = () => {
    if (!name.trim() || !oripaId) return;
    startSession(name, oripaId, isForeign, showDetails);
    setName("");
    setIsForeign(false);
    setShowDetails(false);
    setHiddenRevealed(false);
    setHiddenTapCount(0);
    setShowSuggestions(false);
    setFormOpen(false);
  };

  return (
    <div className="flex flex-col gap-4">
      {!formOpen ? (
        <button
          onClick={() => {
            // reset per-customer state so hidden panel starts closed every time
            setShowDetails(false);
            setHiddenRevealed(false);
            setHiddenTapCount(0);
            setIsForeign(false);
            setFormOpen(true);
          }}
          className="press flex items-center justify-center gap-2 rounded-xl py-3"
          style={{ background: C.gold, color: C.ink, fontWeight: 700 }}
        >
          <UserPlus size={16} />
          お客様を追加
        </button>
      ) : (
        <div className="rounded-xl p-4 flex flex-col gap-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="relative">
            <label style={labelStyle}>お客様名</label>
            <input
              value={name}
              onChange={(e) => {
                setName(e.target.value);
                setShowSuggestions(true);
              }}
              onFocus={() => setShowSuggestions(true)}
              style={{ ...inputStyle, fontFamily: FONT_BODY }}
              placeholder="例: 田中さん"
              autoFocus
              autoComplete="off"
            />
            {showSuggestions && nameSuggestions.length > 0 && (
              <div
                className="absolute left-0 right-0 mt-1 rounded-lg overflow-hidden z-10"
                style={{ background: C.surfaceAlt2, border: `1px solid ${C.gold}`, top: "100%" }}
              >
                {nameSuggestions.map((c) => (
                  <button
                    key={c.id}
                    onClick={() => {
                      setName(c.name);
                      setShowSuggestions(false);
                    }}
                    className="press w-full flex items-center justify-between px-3 py-2.5"
                    style={{ borderBottom: `1px solid ${C.line}` }}
                  >
                    <span style={{ fontSize: 13 }}>{c.name}</span>
                    <span style={{ fontSize: 10, color: C.muted }}>来店{c.visitCount}回</span>
                  </button>
                ))}
              </div>
            )}
          </div>
          <div>
            <label style={labelStyle}>利用するオリパ</label>
            <select
              value={oripaId}
              onChange={(e) => setOripaId(e.target.value)}
              onFocus={() => setShowSuggestions(false)}
              style={{ ...inputStyle, fontFamily: FONT_BODY }}
            >
              {oripaList.map((o) => (
                <option key={o.id} value={o.id}>
                  {o.name}
                </option>
              ))}
            </select>
          </div>
          <div>
            <label style={labelStyle}>お客様の区分</label>
            <div className="flex gap-2">
              {[
                [false, "日本人"],
                [true, "外国人"],
              ].map(([v, l]) => (
                <button
                  key={String(v)}
                  onClick={() => {
                    setIsForeign(v);
                    setShowSuggestions(false);
                  }}
                  className="press flex-1 rounded-lg py-2"
                  style={{ background: isForeign === v ? C.gold : C.surfaceAlt, color: isForeign === v ? C.ink : C.muted, fontSize: 12, fontWeight: 700 }}
                >
                  {l}
                </button>
              ))}
            </div>
          </div>

          {/* hidden staff-only toggle: tap the tiny dot to unlock */}
          {hiddenRevealed ? (
            <div
              className="rounded-lg px-3 py-2.5 flex items-center justify-between"
              style={{ background: C.surfaceAlt2, border: `1px dashed ${C.gold}` }}
            >
              <div className="flex flex-col">
                <span style={{ fontSize: 12, fontWeight: 700, color: C.gold }}>詳細情報を表示</span>
                <span style={{ fontSize: 10, color: C.muted }}>当選確率・封入額など(店舗側のみ)</span>
              </div>
              <Toggle checked={showDetails} onChange={setShowDetails} />
            </div>
          ) : (
            <button
              onClick={tapHidden}
              className="press"
              style={{
                alignSelf: "flex-end",
                width: 16,
                height: 16,
                borderRadius: 999,
                background: hiddenTapCount > 0 ? C.gold : C.surfaceAlt2,
                opacity: hiddenTapCount > 0 ? 0.6 : 0.3,
                border: "none",
              }}
              aria-label="staff"
            />
          )}
          <div className="flex gap-2">
            <button
              onClick={() => {
                setFormOpen(false);
                setIsForeign(false);
                setShowDetails(false);
                setHiddenRevealed(false);
                setHiddenTapCount(0);
              }}
              className="press flex-1 py-2 rounded-lg"
              style={{ border: `1px solid ${C.line}`, color: C.paper, fontSize: 13 }}
            >
              キャンセル
            </button>
            <button onClick={submit} className="press flex-1 py-2 rounded-lg" style={{ background: C.gold, color: C.ink, fontSize: 13, fontWeight: 700 }}>
              開始
            </button>
          </div>
        </div>
      )}

      {activeSessions.length === 0 ? (
        <div className="rounded-xl px-4 py-8 text-center" style={{ background: C.surface, border: `1px dashed ${C.line}`, color: C.muted, fontSize: 13 }}>
          営業中のお客様はいません
        </div>
      ) : (
        <div className="flex flex-col gap-3">
          {activeSessions.map((s) => {
            const oripa = oripaList.find((o) => o.id === s.oripaId);
            if (!oripa) return null;
            return (
              <SessionCard
                key={s.id}
                session={s}
                oripa={oripa}
                fullLog={logsById[oripa.id] || []}
                onDraw={() => recordSessionDraw(s)}
                onWin={(t) => recordSessionWin(s, t)}
                onHazure={(count) => setSessionHazureNotRedeemed(s, count)}
                onEnd={() => endSession(s.id)}
                onUndo={() => undoLastSessionEntry(s)}
              />
            );
          })}
        </div>
      )}

      {endedToday.length > 0 && (
        <div className="flex flex-col gap-2">
          <div className="flex items-center gap-1.5" style={{ color: C.muted, fontSize: 12 }}>
            <CalendarCheck size={13} />
            <span>本日の終了済みお客様</span>
          </div>
          {endedToday.map((s) => {
            const oripa = oripaList.find((o) => o.id === s.oripaId);
            const log = oripa ? (logsById[oripa.id] || []).filter((e) => e.sessionId === s.id) : [];
            const guaranteeAmount = oripa && oripa.minGuarantee.enabled ? Number(oripa.minGuarantee.amount) || 0 : 0;
            const totals = computeTotals(log, guaranteeAmount);
            const dColor = totals.diff > 0 ? C.mint : totals.diff < 0 ? C.coral : C.paper;
            return (
              <div key={s.id} className="flex items-center justify-between rounded-lg px-3 py-2.5" style={{ background: C.surfaceAlt, border: `1px solid ${C.line}` }}>
                <div>
                  <div style={{ fontSize: 13 }}>
                    {s.customerName} <span style={{ color: C.muted, fontSize: 11 }}>・ {s.oripaName}</span>
                  </div>
                  <div style={{ fontSize: 11, color: C.muted }}>
                    {totals.drawCount}口 ・ {yen(totals.totalSpent)} → {yen(totals.totalPayout)}
                  </div>
                </div>
                <div className="flex items-center gap-3">
                  <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 13, color: dColor }}>
                    {totals.diff >= 0 ? "+" : ""}
                    {yen(totals.diff)}
                  </span>
                  <button onClick={() => reopenSession(s.id)} className="press rounded-lg px-2 py-1" style={{ border: `1px solid ${C.line}`, color: C.muted, fontSize: 10 }}>
                    再開
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

const RANK_GROUP_COLOR = { rainbow: C.gold, gold: "#D4A94A", silver: "#B8C0CC", bronze: "#B08D57", other: C.muted };
const RANK_GROUP_LABEL = { rainbow: "🌈 虹枠", gold: "🥇 金枠", silver: "🥈 銀枠", bronze: "🥉 銅枠", other: "その他" };
const RANK_GROUP_ORDER = ["rainbow", "gold", "silver", "bronze", "other"];

function RankGroupedPicker({ tiers, onPick, isForeign = false, consumedIds = null }) {
  const groups = {};
  tiers.forEach((t) => {
    const key = RANK_GROUP_ORDER.includes(t.rank) ? t.rank : "other";
    if (!groups[key]) groups[key] = [];
    groups[key].push(t);
  });

  const priceOf = (t) => isForeign && t.amountForeign != null && t.amountForeign !== ""
    ? Number(t.amountForeign) || 0
    : Number(t.amount) || 0;

  return (
    <div className="flex flex-col gap-3">
      {RANK_GROUP_ORDER.filter((k) => groups[k] && groups[k].length > 0).map((k) => (
        <div key={k} className="flex flex-col gap-1.5">
          <div className="flex items-center justify-between">
            <span style={{ fontSize: 11, fontWeight: 700, color: RANK_GROUP_COLOR[k] }}>{RANK_GROUP_LABEL[k]}</span>
            <span style={{ fontSize: 10, color: C.muted }}>{groups[k].length}個</span>
          </div>
          <div className="grid grid-cols-2 gap-2">
            {groups[k].map((t) => {
              const isTaken = consumedIds && consumedIds.has(t.id);
              return (
                <button
                  key={t.id}
                  onClick={() => { if (!isTaken) onPick(t); }}
                  disabled={isTaken}
                  className="press flex flex-col items-start rounded-lg px-3 py-2"
                  style={{
                    background: C.surfaceAlt,
                    border: `1px solid ${RANK_GROUP_COLOR[k]}`,
                    cursor: isTaken ? "default" : "pointer",
                  }}
                >
                  <span style={{ fontSize: 11, color: C.muted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", width: "100%" }}>
                    {t.name}
                  </span>
                  <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: RANK_GROUP_COLOR[k], fontSize: 13 }}>{yen(priceOf(t))}</span>
                </button>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

function SessionCard({ session, oripa, fullLog, onDraw, onWin, onHazure, onEnd, onUndo }) {
  const [notRedeemedInput, setNotRedeemedInput] = useState(null);
  const [showWinPicker, setShowWinPicker] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const sessionLog = useMemo(() => fullLog.filter((e) => e.sessionId === session.id), [fullLog, session.id]);
  const guaranteeAmount = oripa.minGuarantee.enabled ? Number(oripa.minGuarantee.amount) || 0 : 0;
  const totals = useMemo(() => computeTotals(sessionLog, guaranteeAmount), [sessionLog, guaranteeAmount]);
  const box = useMemo(() => computeBoxState(fullLog, oripa), [fullLog, oripa]);
  const diffColor = totals.diff > 0 ? C.mint : totals.diff < 0 ? C.coral : C.paper;
  const diffBg = totals.diff > 0 ? "rgba(111,207,143,0.10)" : totals.diff < 0 ? "rgba(226,105,79,0.10)" : C.surfaceAlt;
  const isForeign = !!session.isForeign;

  const openNotRedeemed = () => setNotRedeemedInput(String(totals.hazureNotRedeemedCount || 0));
  const confirmNotRedeemed = () => {
    onHazure(notRedeemedInput);
    setNotRedeemedInput(null);
  };

  // when foreign session, show remaining prize based on foreign amounts
  const remainingWinTotalForSession = useMemo(() => {
    const tiersSum = box.remainingTiers.reduce((a, t) => {
      const amt = isForeign && t.amountForeign != null && t.amountForeign !== ""
        ? Number(t.amountForeign) || 0
        : Number(t.amount) || 0;
      return a + amt;
    }, 0);
    const lastOne = oripa.lastOne.enabled && !box.lastOneAwarded && Number(oripa.totalSlots) > 0
      ? (isForeign && oripa.lastOne.amountForeign != null && oripa.lastOne.amountForeign !== ""
          ? Number(oripa.lastOne.amountForeign) || 0
          : Number(oripa.lastOne.amount) || 0)
      : 0;
    return tiersSum + lastOne;
  }, [box.remainingTiers, box.lastOneAwarded, isForeign, oripa]);

  return (
    <div className="rounded-xl p-4 flex flex-col gap-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
      <div className="flex items-center justify-between">
        <div>
          <div className="flex items-center gap-2">
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 15 }}>{session.customerName}</div>
            {isForeign && (
              <span style={{ fontSize: 10, fontWeight: 700, color: C.ink, background: C.gold, borderRadius: 999, padding: "1px 8px" }}>外国人</span>
            )}
          </div>
          <div style={{ fontSize: 11, color: C.muted }}>
            {oripa.name}
          </div>
        </div>
        <button onClick={onEnd} className="press rounded-lg px-3 py-1.5" style={{ border: `1px solid ${C.line}`, color: C.muted, fontSize: 12 }}>
          終了
        </button>
      </div>

      {Number(oripa.totalSlots) > 0 && !!session.showDetails && (
        <div className="rounded-lg px-3 py-2 flex flex-col gap-1.5" style={{ background: C.surfaceAlt2, border: `1px solid ${C.line}` }}>
          <div className="flex items-center justify-between">
            <span style={{ fontSize: 11, color: C.muted }}>全体の当選確率</span>
            <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 14, color: C.gold }}>
              {oripa.tiers.length}/{oripa.totalSlots}
              {box.configuredRate != null ? `(${box.configuredRate.toFixed(1)}%)` : ""}
            </span>
          </div>
          {oripa.minGuarantee.enabled && (
            <div className="flex items-center justify-between">
              <span style={{ fontSize: 11, color: C.muted }}>ハズレ(全体)・封入額</span>
              <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 14, color: C.muted }}>
                {Math.max(0, Number(oripa.totalSlots) - oripa.tiers.length)}口 ・ {yen(Math.max(0, Number(oripa.totalSlots) - oripa.tiers.length) * guaranteeAmount)}
              </span>
            </div>
          )}
          <div className="flex items-center justify-between" style={{ borderTop: `1px dashed ${C.line}`, paddingTop: 6, marginTop: 2 }}>
            <span style={{ fontSize: 11, color: C.muted }}>残りあたり数(残り口数中)</span>
            <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 14, color: C.gold }}>
              {box.remainingTiers.length}/{box.remainingSlots}
              {box.remainingSlots > 0 ? `(${((box.remainingTiers.length / box.remainingSlots) * 100).toFixed(1)}%)` : ""}
            </span>
          </div>
          {oripa.minGuarantee.enabled && (
            <div className="flex items-center justify-between">
              <span style={{ fontSize: 11, color: C.muted }}>残りハズレ・封入額</span>
              <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 14, color: C.muted }}>
                {box.remainingHazureCount}口 ・ {yen(box.remainingHazureCount * guaranteeAmount)}
              </span>
            </div>
          )}
          <div className="flex items-center justify-between">
            <span style={{ fontSize: 11, color: C.muted }}>残りのあたり額{isForeign ? "(外国人)" : ""}</span>
            <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 14, color: C.mint }}>
              {yen(remainingWinTotalForSession)}
            </span>
          </div>
        </div>
      )}

      <div className="grid grid-cols-2 gap-3">
        <StatBlock label="購入口数" value={`${totals.drawCount}口`} />
        <StatBlock label="あたり回数" value={`${totals.winCount}回`} color={C.gold} />
        <StatBlock label="支払金額" value={yen(totals.totalSpent)} color={C.coral} />
        <StatBlock label="獲得景品総額" value={yen(totals.totalPayout)} color={C.mint} />
      </div>

      {/* big diff panel */}
      <div
        className="rounded-xl px-4 py-3 flex items-center justify-between"
        style={{ background: diffBg, border: `1px solid ${diffColor === C.paper ? C.line : diffColor}` }}
      >
        <div className="flex items-center gap-2">
          {totals.diff > 0 && <TrendingUp size={18} color={diffColor} />}
          {totals.diff < 0 && <TrendingDown size={18} color={diffColor} />}
          <span style={{ fontSize: 13, color: C.muted, fontWeight: 700 }}>現在損益</span>
        </div>
        <span style={{ fontFamily: FONT_MONO, fontSize: 28, fontWeight: 800, color: diffColor, letterSpacing: -0.5 }}>
          {totals.diff >= 0 ? "+" : ""}
          {yen(totals.diff)}
        </span>
      </div>
      <div className="flex justify-between items-center">
        <span style={{ fontSize: 12, color: C.muted }}>回収率</span>
        <span style={{ fontFamily: FONT_MONO, fontSize: 13, fontWeight: 700 }}>{totals.recoveryRate != null ? `${totals.recoveryRate.toFixed(1)}%` : "—"}</span>
      </div>

      <div className="grid grid-cols-2 gap-2">
        <button onClick={onDraw} className="press rounded-lg py-2.5" style={{ background: C.gold, color: C.ink, fontWeight: 700, fontSize: 13 }}>
          ＋1口購入({yen(oripa.price)})
        </button>
        <button
          onClick={() => setShowWinPicker((v) => !v)}
          className="press rounded-lg py-2.5"
          style={{ border: `1px solid ${C.line}`, color: C.gold, fontWeight: 700, fontSize: 13 }}
        >
          景品を記録
        </button>
      </div>

      {showWinPicker && (() => {
        // When "showDetails" is on: consumed cards vanish from picker (staff mode).
        // When off: customer sees full inventory; only session-scoped double-tap of the same tier is ignored.
        const tiersToShow = session.showDetails ? box.remainingTiers : oripa.tiers;
        // tierIds this session already recorded (to prevent double-count on tap)
        const sessionWonTierIds = new Set(sessionLog.filter((e) => e.type === "win" && e.tierId).map((e) => e.tierId));
        if (tiersToShow.length === 0) {
          return <div style={{ fontSize: 12, color: C.muted, textAlign: "center" }}>残りのあたりはありません</div>;
        }
        return (
          <>
            {!session.showDetails && (
              <div style={{ fontSize: 10, color: C.muted, textAlign: "center", marginBottom: -4 }}>
                獲得したい景品を選んでください
              </div>
            )}
            <RankGroupedPicker
              tiers={tiersToShow}
              isForeign={isForeign}
              consumedIds={session.showDetails ? null : sessionWonTierIds}
              onPick={(t) => {
                if (!session.showDetails && sessionWonTierIds.has(t.id)) {
                  // ignore double-tap of the same specific tier in this session
                  return;
                }
                onWin(t);
                if (session.showDetails) setShowWinPicker(false);
              }}
            />
          </>
        );
      })()}

      {oripa.minGuarantee.enabled &&
        (notRedeemedInput === null ? (
          <button
            onClick={openNotRedeemed}
            className="press flex items-center justify-between rounded-lg px-3 py-2"
            style={{ border: `1px solid ${C.line}`, fontSize: 12, color: C.muted }}
          >
            <span>保証に出さなかった枚数</span>
            <span style={{ fontFamily: FONT_MONO, color: C.paper, fontWeight: 700 }}>{totals.hazureNotRedeemedCount}枚</span>
          </button>
        ) : (
          <div className="flex gap-2">
            <input type="number" inputMode="numeric" value={notRedeemedInput} onChange={(e) => setNotRedeemedInput(e.target.value)} style={inputStyle} autoFocus />
            <button onClick={confirmNotRedeemed} className="press rounded-lg px-4" style={{ background: C.gold, color: C.ink, fontWeight: 700, fontSize: 13 }}>
              更新
            </button>
            <button onClick={() => setNotRedeemedInput(null)} className="press rounded-lg px-3" style={{ border: `1px solid ${C.line}`, color: C.muted }}>
              <X size={16} />
            </button>
          </div>
        ))}

      <div className="flex items-center justify-between pt-1" style={{ borderTop: `1px dashed ${C.line}` }}>
        {sessionLog.length > 0 ? (
          <button onClick={onUndo} className="press flex items-center gap-1.5" style={{ color: C.muted, fontSize: 12 }}>
            <Undo2 size={13} />
            一つ前を訂正
          </button>
        ) : (
          <span />
        )}
        <button onClick={() => setShowHistory((v) => !v)} className="press flex items-center gap-1.5" style={{ color: C.gold, fontSize: 12 }}>
          <History size={13} />
          {showHistory ? "履歴を閉じる" : "あたり履歴を見る"}
        </button>
      </div>

      {showHistory && <PersonalHistory sessionLog={sessionLog} />}
    </div>
  );
}

function PersonalHistory({ sessionLog }) {
  const sorted = sessionLog.filter((e) => e.type === "win").sort((a, b) => b.ts - a.ts);
  const fmtTime = (ts) => {
    const d = new Date(ts);
    return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };
  const rowIcon = (e) => (e.isLastOne ? <Crown size={14} color={C.gold} /> : <Sparkles size={14} color={C.gold} />);

  if (sorted.length === 0) {
    return <div style={{ fontSize: 12, color: C.muted, textAlign: "center", padding: "12px 0" }}>まだあたりがありません</div>;
  }

  return (
    <div className="flex flex-col gap-1.5 rounded-lg p-2" style={{ background: C.surfaceAlt2 }}>
      {sorted.map((e) => (
        <div key={e.id} className="flex items-center justify-between rounded-lg px-2.5 py-2" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="flex items-center gap-2">
            {rowIcon(e)}
            <div>
              <div style={{ fontSize: 12 }}>{e.name}</div>
              <div style={{ fontSize: 9, color: C.muted, fontFamily: FONT_MONO }}>{fmtTime(e.ts)}</div>
            </div>
          </div>
          <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 13, color: C.mint }}>+{yen(e.amount)}</span>
        </div>
      ))}
    </div>
  );
}

// ---------- STORE: お客様マスター ----------
function CustomerMaster({ customers, sessions, oripaList, logsById, updateCustomer, deleteCustomer }) {
  const [query, setQuery] = useState("");
  const [selectedId, setSelectedId] = useState(null);

  const filtered = customers.filter((c) => c.name.toLowerCase().includes(query.toLowerCase())).sort((a, b) => b.lastVisitTs - a.lastVisitTs);
  const selected = customers.find((c) => c.id === selectedId);

  if (selected) {
    return (
      <CustomerDetail
        customer={selected}
        sessions={sessions}
        oripaList={oripaList}
        logsById={logsById}
        onBack={() => setSelectedId(null)}
        updateCustomer={updateCustomer}
        deleteCustomer={(id) => {
          deleteCustomer(id);
          setSelectedId(null);
        }}
      />
    );
  }

  return (
    <div className="flex flex-col gap-3">
      <div className="relative">
        <Search size={14} color={C.muted} style={{ position: "absolute", left: 12, top: 12 }} />
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="お客様名で検索" style={{ ...inputStyle, fontFamily: FONT_BODY, paddingLeft: 34 }} />
      </div>
      {filtered.length === 0 ? (
        <div className="rounded-xl px-4 py-8 text-center" style={{ background: C.surface, border: `1px dashed ${C.line}`, color: C.muted, fontSize: 13 }}>
          お客様が見つかりません
        </div>
      ) : (
        filtered.map((c) => {
          const life = computeCustomerLifetime(c, sessions, oripaList, logsById);
          const diffColor = life.diff > 0 ? C.mint : life.diff < 0 ? C.coral : C.paper;
          return (
            <button
              key={c.id}
              onClick={() => setSelectedId(c.id)}
              className="press flex items-center justify-between rounded-xl px-4 py-3"
              style={{ background: C.surface, border: `1px solid ${C.line}` }}
            >
              <div className="text-left">
                <div style={{ fontSize: 14, fontWeight: 700 }}>{c.name}</div>
                <div style={{ fontSize: 11, color: C.muted }}>来店{c.visitCount}回</div>
              </div>
              <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 14, color: diffColor }}>
                {life.diff >= 0 ? "+" : ""}
                {yen(life.diff)}
              </span>
            </button>
          );
        })
      )}
    </div>
  );
}

function CustomerDetail({ customer, sessions, oripaList, logsById, onBack, updateCustomer, deleteCustomer }) {
  const life = computeCustomerLifetime(customer, sessions, oripaList, logsById);
  const diffColor = life.diff > 0 ? C.mint : life.diff < 0 ? C.coral : C.paper;
  const fmtDate = (ts) => {
    const d = new Date(ts);
    return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
  };

  const [editing, setEditing] = useState(false);
  const [editName, setEditName] = useState(customer.name);
  const [confirmDelete, setConfirmDelete] = useState(false);

  const saveName = () => {
    const trimmed = editName.trim();
    if (!trimmed || trimmed === customer.name) {
      setEditing(false);
      setEditName(customer.name);
      return;
    }
    updateCustomer && updateCustomer(customer.id, () => ({ name: trimmed }));
    setEditing(false);
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-center gap-2">
        <button onClick={onBack} className="press flex items-center justify-center rounded-full" style={{ width: 32, height: 32, background: C.surfaceAlt2 }}>
          <ArrowLeft size={16} color={C.paper} />
        </button>
        {editing ? (
          <div className="flex items-center gap-2 flex-1">
            <input
              value={editName}
              onChange={(e) => setEditName(e.target.value)}
              autoFocus
              onKeyDown={(e) => e.key === "Enter" && saveName()}
              style={{ ...inputStyle, fontFamily: FONT_BODY, flex: 1 }}
            />
            <button onClick={saveName} className="press rounded-lg px-3 py-2" style={{ background: C.gold, color: C.ink, fontSize: 12, fontWeight: 700 }}>
              保存
            </button>
            <button
              onClick={() => {
                setEditing(false);
                setEditName(customer.name);
              }}
              className="press rounded-lg px-2 py-2"
              style={{ border: `1px solid ${C.line}`, color: C.muted }}
            >
              <X size={14} />
            </button>
          </div>
        ) : (
          <>
            <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 17 }}>{customer.name}</span>
            <button
              onClick={() => setEditing(true)}
              className="press ml-auto rounded-lg px-2.5 py-1"
              style={{ border: `1px solid ${C.line}`, color: C.gold, fontSize: 11, fontWeight: 700 }}
            >
              名前変更
            </button>
          </>
        )}
      </div>

      <div className="rounded-xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div className="grid grid-cols-2 gap-4">
          <StatBlock label="累計支払額" value={yen(life.totalSpent)} color={C.coral} />
          <StatBlock label="累計獲得景品額" value={yen(life.totalPayout)} color={C.mint} />
          <StatBlock label="来店回数" value={`${life.visitCount}回`} />
          <StatBlock label="累計購入口数" value={`${life.totalSlots}口`} />
        </div>
        <div className="flex justify-between items-center mt-3 pt-3" style={{ borderTop: `1px dashed ${C.line}` }}>
          <span style={{ fontSize: 13, color: C.muted }}>累計損益</span>
          <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 18, color: diffColor }}>
            {life.diff >= 0 ? "+" : ""}
            {yen(life.diff)}
          </span>
        </div>
        <div className="flex justify-between items-center mt-2">
          <span style={{ fontSize: 12, color: C.muted }}>累計回収率</span>
          <span style={{ fontFamily: FONT_MONO, fontSize: 13 }}>{life.recoveryRate != null ? `${life.recoveryRate.toFixed(1)}%` : "—"}</span>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div className="rounded-xl p-3" style={{ background: C.surfaceAlt2 }}>
          <div className="flex items-center gap-1.5" style={{ color: C.mint, fontSize: 11 }}>
            <Trophy size={12} />
            過去最高勝ち額
          </div>
          <div style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 16, color: C.mint }}>{life.bestDiff != null ? `+${yen(life.bestDiff)}` : "—"}</div>
        </div>
        <div className="rounded-xl p-3" style={{ background: C.surfaceAlt2 }}>
          <div className="flex items-center gap-1.5" style={{ color: C.coral, fontSize: 11 }}>
            <TrendingDown size={12} />
            過去最大負け額
          </div>
          <div style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 16, color: C.coral }}>{life.worstDiff != null ? yen(life.worstDiff) : "—"}</div>
        </div>
      </div>

      <div>
        <div style={{ fontSize: 12, color: C.muted, marginBottom: 8 }}>来店履歴</div>
        <div className="flex flex-col gap-2">
          {life.history.map(({ session, oripaName, totals }) => {
            const dColor = totals.diff > 0 ? C.mint : totals.diff < 0 ? C.coral : C.paper;
            return (
              <div key={session.id} className="rounded-lg px-3 py-2.5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
                <div className="flex justify-between items-center">
                  <span style={{ fontSize: 12 }}>
                    {fmtDate(session.startTs)} ・ {oripaName}
                  </span>
                  <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 13, color: dColor }}>
                    {totals.diff >= 0 ? "+" : ""}
                    {yen(totals.diff)}
                  </span>
                </div>
                <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>
                  {totals.drawCount}口 ・ {yen(totals.totalSpent)} → {yen(totals.totalPayout)} {!session.endTs && "・ 営業中"}
                </div>
              </div>
            );
          })}
          {life.history.length === 0 && <div style={{ fontSize: 12, color: C.muted, textAlign: "center", padding: "16px 0" }}>来店履歴がありません</div>}
        </div>
      </div>

      <div className="rounded-xl p-3 flex flex-col gap-2" style={{ background: C.surfaceAlt2, border: `1px solid ${C.line}` }}>
        <div style={{ fontSize: 11, color: C.muted }}>お客様データの削除(来店履歴の記録は残りますが、お客様一覧からは消えます)</div>
        {confirmDelete ? (
          <div className="flex gap-2">
            <button
              onClick={() => deleteCustomer && deleteCustomer(customer.id)}
              className="press flex-1 py-2 rounded-lg"
              style={{ background: C.coral, color: C.ink, fontSize: 12, fontWeight: 700 }}
            >
              本当に削除する
            </button>
            <button onClick={() => setConfirmDelete(false)} className="press flex-1 py-2 rounded-lg" style={{ border: `1px solid ${C.line}`, color: C.muted, fontSize: 12 }}>
              キャンセル
            </button>
          </div>
        ) : (
          <button
            onClick={() => setConfirmDelete(true)}
            className="press py-2 rounded-lg"
            style={{ border: `1px solid ${C.coral}`, color: C.coral, fontSize: 12, fontWeight: 700 }}
          >
            <Trash2 size={13} style={{ display: "inline", marginRight: 4, verticalAlign: "middle" }} />
            このお客様を削除
          </button>
        )}
      </div>
    </div>
  );
}

// ---------- STORE: 本日 / 日次精算 ----------
function DailyDashboard({ oripaList, logsById, sessions, settlements, settleToday, updateSettlement, expenses, addExpense, deleteExpense, timePunches, staff, staffCompensation, buybackDaily, saveBuybackDaily, dailyPayrollFinalized = {}, finalizeDailyPayroll, unfinalizeDailyPayroll }) {
  const key = todayKey();
  const settled = settlements.find((s) => s.dateKey === key);
  const live = computeDailyStats(key, oripaList, logsById, sessions);
  const stats = settled || live;
  const [view, setView] = useState("today");
  const [selectedSettlementId, setSelectedSettlementId] = useState(null);
  const selectedSettlement = settlements.find((s) => s.id === selectedSettlementId) || null;

  // buyback daily entry state for today
  const bbToday = buybackDaily[key] || { purchase: "", sale: "" };
  const [bbPurchase, setBbPurchase] = useState(String(bbToday.purchase || ""));
  const [bbSale, setBbSale] = useState(String(bbToday.sale || ""));
  useEffect(() => {
    const cur = buybackDaily[key] || {};
    setBbPurchase(String(cur.purchase || ""));
    setBbSale(String(cur.sale || ""));
  }, [key, buybackDaily]);
  const saveBB = () => saveBuybackDaily({ ...buybackDaily, [key]: { purchase: Number(bbPurchase) || 0, sale: Number(bbSale) || 0 } });

  // report data for today
  const todayExpenses = expenses.filter((e) => e.date === key);
  const todayExpensesTotal = todayExpenses.reduce((a, e) => a + Number(e.amount || 0), 0);
  const todayPunches = timePunches.filter((p) => dateKeyOf(p.ts) === key);
  const todayPayroll = computeTodayPayroll(todayPunches, staff, staffCompensation);
  const computedPayrollTotal = todayPayroll.reduce((a, p) => a + p.total, 0);
  const finalizedPayrollAmount = dailyPayrollFinalized[key];
  const todayPayrollTotal = finalizedPayrollAmount != null ? finalizedPayrollAmount : computedPayrollTotal;
  const isPayrollFinalized = finalizedPayrollAmount != null;
  const [payrollEdit, setPayrollEdit] = useState(String(todayPayrollTotal));
  useEffect(() => { setPayrollEdit(String(finalizedPayrollAmount != null ? finalizedPayrollAmount : computedPayrollTotal)); }, [key, finalizedPayrollAmount, computedPayrollTotal]);

  const bbPurchaseN = Number(bbPurchase) || 0;
  const bbSaleN = Number(bbSale) || 0;
  const bbNet = bbSaleN - bbPurchaseN;
  const storeSales = stats.totalSales || 0;
  const grossProfit = (stats.totalSales - stats.totalPayout) || 0;
  const netCashFlow = grossProfit - todayExpensesTotal - todayPayrollTotal + bbNet;

  // Inline expense add
  const [expDate, setExpDate] = useState(key);
  const [expCat, setExpCat] = useState("その他");
  const [expMemo, setExpMemo] = useState("");
  const [expAmount, setExpAmount] = useState("");
  const EXPENSE_CATEGORIES = ["人件費", "交通費", "家賃", "光熱費", "仕入", "雑費", "その他"];
  const addExpenseInline = () => {
    if (expAmount === "") return;
    addExpense(expDate, expCat, expMemo, expAmount);
    setExpMemo("");
    setExpAmount("");
  };

  if (selectedSettlement) {
    return <SettlementDetail settlement={selectedSettlement} onBack={() => setSelectedSettlementId(null)} updateSettlement={updateSettlement} />;
  }

  return (
    <div className="flex flex-col gap-4">
      <div className="flex gap-2">
        <button
          onClick={() => setView("today")}
          className="press flex-1 rounded-lg py-2"
          style={{ background: view === "today" ? C.gold : C.surfaceAlt, color: view === "today" ? C.ink : C.muted, fontSize: 12, fontWeight: 700 }}
        >
          本日
        </button>
        <button
          onClick={() => setView("report")}
          className="press flex-1 rounded-lg py-2"
          style={{ background: view === "report" ? C.gold : C.surfaceAlt, color: view === "report" ? C.ink : C.muted, fontSize: 12, fontWeight: 700 }}
        >
          日次レポート
        </button>
        <button
          onClick={() => setView("history")}
          className="press flex-1 rounded-lg py-2"
          style={{ background: view === "history" ? C.gold : C.surfaceAlt, color: view === "history" ? C.ink : C.muted, fontSize: 12, fontWeight: 700 }}
        >
          履歴
        </button>
        <button
          onClick={() => setView("month")}
          className="press flex-1 rounded-lg py-2"
          style={{ background: view === "month" ? C.gold : C.surfaceAlt, color: view === "month" ? C.ink : C.muted, fontSize: 12, fontWeight: 700 }}
        >
          月間
        </button>
      </div>

      {view === "report" && (
        <div className="flex flex-col gap-3">
          <PdfExportButton
            label="この日のレポートをPDFで出力"
            dateKey={key}
            oripaList={oripaList}
            logsById={logsById}
            sessions={sessions}
            expenses={expenses}
            punches={timePunches}
            staff={staff}
            comp={staffCompensation}
            buybackDaily={buybackDaily || {}}
          />
          <div className="rounded-xl p-4" style={{ background: C.surface, border: `1px solid ${C.gold}` }}>
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 15, marginBottom: 8 }}>{key} の収支レポート</div>
            <div className="flex flex-col gap-2">
              <ReportRow label="オリパ売上" value={storeSales} color={C.mint} />
              <ReportRow label="景品払出" value={-stats.totalPayout} color={C.coral} />
              <ReportRow label="オリパ粗利" value={grossProfit} color={grossProfit >= 0 ? C.mint : C.coral} bold />
              <div style={{ borderTop: `1px dashed ${C.line}`, margin: "4px 0" }} />
              <ReportRow label={`買取売上(¥${bbSaleN.toLocaleString()})− 仕入(¥${bbPurchaseN.toLocaleString()})`} value={bbNet} color={bbNet >= 0 ? C.mint : C.coral} />
              <div style={{ borderTop: `1px dashed ${C.line}`, margin: "4px 0" }} />
              <ReportRow label={`人件費(${todayPayroll.length}人)`} value={-todayPayrollTotal} color={C.coral} />
              <ReportRow label={`経費(${todayExpenses.length}件)`} value={-todayExpensesTotal} color={C.coral} />
            </div>
            <div className="flex items-center justify-between mt-3 pt-3" style={{ borderTop: `1px solid ${C.line}` }}>
              <span style={{ fontSize: 13, fontWeight: 700 }}>本日の収支</span>
              <span style={{ fontFamily: FONT_MONO, fontWeight: 800, fontSize: 24, color: netCashFlow >= 0 ? C.mint : C.coral }}>
                {netCashFlow >= 0 ? "+" : ""}{yen(netCashFlow)}
              </span>
            </div>
          </div>

          {/* buyback daily input */}
          <div className="rounded-xl p-3 flex flex-col gap-2" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <div style={{ fontSize: 13, fontWeight: 700 }}>買取・販売の入力(本日分)</div>
            <div style={{ fontSize: 11, color: C.muted }}>レジのノートを見て、本日の合計金額を入力してください</div>
            <div>
              <label style={labelStyle}>本日の買取(仕入)金額 ¥</label>
              <input type="number" value={bbPurchase} onChange={(e) => setBbPurchase(e.target.value)} onBlur={saveBB} style={{ ...inputStyle, fontFamily: FONT_MONO }} placeholder="0" />
            </div>
            <div>
              <label style={labelStyle}>本日の販売金額 ¥</label>
              <input type="number" value={bbSale} onChange={(e) => setBbSale(e.target.value)} onBlur={saveBB} style={{ ...inputStyle, fontFamily: FONT_MONO }} placeholder="0" />
            </div>
            <button onClick={saveBB} className="press rounded-lg py-2" style={{ background: C.gold, color: C.ink, fontSize: 12, fontWeight: 700 }}>保存</button>
          </div>

          {/* payroll finalize */}
          <div className="rounded-xl p-3 flex flex-col gap-2" style={{ background: C.surface, border: `1px solid ${isPayrollFinalized ? C.mint : C.gold}` }}>
            <div className="flex items-center justify-between">
              <div style={{ fontSize: 13, fontWeight: 700 }}>
                本日の人件費{isPayrollFinalized && <span style={{ color: C.mint, marginLeft: 6, fontSize: 11 }}>✓ 確定済</span>}
              </div>
              <span style={{ fontSize: 10, color: C.muted, fontFamily: FONT_MONO }}>
                自動計算: {yen(computedPayrollTotal)}
              </span>
            </div>
            {todayPayroll.length > 0 && (
              <div className="flex flex-col gap-1">
                {todayPayroll.map((p) => (
                  <div key={p.staffId} className="flex items-center justify-between rounded-md px-2 py-1" style={{ background: C.surfaceAlt }}>
                    <span style={{ fontSize: 11 }}>{p.name}</span>
                    <span style={{ fontSize: 9, color: C.muted, fontFamily: FONT_MONO }}>{p.hours.toFixed(1)}h × {yen(p.hourlyWage)} + 交{yen(p.commutePerDay)}</span>
                    <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: C.gold, fontSize: 12 }}>{yen(p.total)}</span>
                  </div>
                ))}
              </div>
            )}
            <div className="flex items-center gap-2">
              <span style={{ fontSize: 11, color: C.muted, flexShrink: 0 }}>確定金額 ¥</span>
              <input
                type="number"
                value={payrollEdit}
                onChange={(e) => setPayrollEdit(e.target.value)}
                disabled={isPayrollFinalized}
                style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1, padding: "6px 8px", fontSize: 13, opacity: isPayrollFinalized ? 0.6 : 1 }}
              />
              {isPayrollFinalized ? (
                <button onClick={() => unfinalizeDailyPayroll(key)} className="press rounded-lg px-3 py-2" style={{ border: `1px solid ${C.line}`, color: C.muted, fontSize: 11 }}>解除</button>
              ) : (
                <button onClick={() => finalizeDailyPayroll(key, payrollEdit)} className="press rounded-lg px-3 py-2" style={{ background: C.gold, color: C.ink, fontSize: 12, fontWeight: 700 }}>本日分を確定</button>
              )}

          </div>

          {/* expense input + list */}
          <div className="rounded-xl p-3 flex flex-col gap-2" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <div style={{ fontSize: 13, fontWeight: 700 }}>経費入力・内訳</div>
            <div className="flex flex-col gap-2 rounded-lg p-2" style={{ background: C.surfaceAlt }}>
              <div className="flex gap-2">
                <input type="date" value={expDate} onChange={(e) => setExpDate(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1, fontSize: 11, padding: "5px 8px" }} />
                <select value={expCat} onChange={(e) => setExpCat(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_BODY, flex: 1, fontSize: 11, padding: "5px 8px" }}>
                  {EXPENSE_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                </select>
              </div>
              <input value={expMemo} onChange={(e) => setExpMemo(e.target.value)} placeholder="メモ(例: 電気代)" style={{ ...inputStyle, fontFamily: FONT_BODY, fontSize: 12, padding: "6px 8px" }} />
              <div className="flex gap-2">
                <input type="number" value={expAmount} onChange={(e) => setExpAmount(e.target.value)} placeholder="金額(¥)" style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1, fontSize: 12, padding: "6px 8px" }} />
                <button onClick={addExpenseInline} className="press rounded-lg px-4" style={{ background: C.gold, color: C.ink, fontSize: 12, fontWeight: 700 }}>追加</button>
              </div>
            </div>

            {todayExpenses.length === 0 ? (
              <div style={{ fontSize: 11, color: C.muted, textAlign: "center", padding: "4px 0" }}>本日の経費は未登録</div>
            ) : (
              <div className="flex flex-col gap-1">
                {todayExpenses.map((e) => (
                  <div key={e.id} className="flex items-center justify-between rounded-md px-2 py-1.5" style={{ background: C.surfaceAlt }}>
                    <span style={{ fontSize: 10, color: C.gold, border: `1px solid ${C.gold}`, borderRadius: 999, padding: "1px 6px" }}>{e.category}</span>
                    <span style={{ fontSize: 12, flex: 1, marginLeft: 6, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.memo}</span>
                    <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: C.coral, fontSize: 13, marginRight: 6 }}>{yen(e.amount)}</span>
                    {deleteExpense && (
                      <button onClick={() => deleteExpense(e.id)} style={{ color: C.muted }}><Trash2 size={12} /></button>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}

      {view === "today" && (
        <div className="flex flex-col gap-4">
          <div
            className="rounded-xl p-4"
            style={{ background: C.surface, border: `1px solid ${settled ? C.line : C.gold}`, cursor: settled ? "pointer" : "default" }}
            onClick={() => settled && setSelectedSettlementId(settled.id)}
          >
            <div className="flex items-center justify-between mb-3">
              <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 15 }}>{key}</span>
              {settled && (
                <span style={{ fontSize: 10, color: C.mint, border: `1px solid ${C.mint}`, borderRadius: 999, padding: "2px 8px" }}>
                  精算済み{settled.edited ? "(訂正あり)" : ""}
                </span>
              )}
            </div>
            <div className="grid grid-cols-2 gap-4">
              <StatBlock label="本日の売上" value={yen(stats.totalSales)} color={C.mint} />
              <StatBlock label="本日の販売口数" value={`${stats.totalSlots}口`} />
              <StatBlock label="本日の来店人数" value={`${stats.visitorCount}人`} />
              <StatBlock label="本日の景品払出額" value={yen(stats.totalPayout)} color={C.coral} />
            </div>
            <div className="flex justify-between items-center mt-3 pt-3" style={{ borderTop: `1px dashed ${C.line}` }}>
              <span style={{ fontSize: 13, color: C.muted }}>本日の粗利益</span>
              <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 18, color: stats.grossProfit >= 0 ? C.mint : C.coral }}>
                {yen(stats.grossProfit)}
              </span>
            </div>
            <div className="flex justify-between items-center mt-2">
              <span style={{ fontSize: 12, color: C.muted }}>実還元率</span>
              <span style={{ fontFamily: FONT_MONO, fontSize: 13 }}>{stats.actualRate != null ? `${stats.actualRate.toFixed(1)}%` : "—"}</span>
            </div>

            {stats.byOripa.length > 0 && (
              <div className="flex flex-col gap-1.5 mt-3 pt-3" style={{ borderTop: `1px dashed ${C.line}` }}>
                <div style={{ fontSize: 11, color: C.muted }}>オリパ別</div>
                {stats.byOripa.map((o) => (
                  <div key={o.oripaId} className="flex justify-between items-center">
                    <span style={{ fontSize: 12 }}>{o.name}</span>
                    <span style={{ fontFamily: FONT_MONO, fontSize: 12, color: C.muted }}>
                      {o.slots}口 ・ {yen(o.sales)}
                    </span>
                  </div>
                ))}
              </div>
            )}
            {settled && (
              <div className="flex items-center justify-center gap-1 mt-3 pt-3" style={{ borderTop: `1px dashed ${C.line}`, color: C.gold, fontSize: 11 }}>
                タップして詳細・訂正
              </div>
            )}
          </div>

          {!settled && (
            <button onClick={settleToday} className="press flex items-center justify-center gap-2 rounded-xl py-3" style={{ background: C.gold, color: C.ink, fontWeight: 700 }}>
              <CalendarCheck size={16} />
              本日の日次精算を確定する
            </button>
          )}
        </div>
      )}

      {view === "history" && (
        <div className="flex flex-col gap-2">
          {settlements.length === 0 ? (
            <div className="rounded-xl px-4 py-8 text-center" style={{ background: C.surface, border: `1px dashed ${C.line}`, color: C.muted, fontSize: 13 }}>
              まだ精算履歴がありません
            </div>
          ) : (
            settlements
              .slice()
              .sort((a, b) => b.dateKey.localeCompare(a.dateKey))
              .map((s) => (
                <button
                  key={s.id}
                  onClick={() => setSelectedSettlementId(s.id)}
                  className="press flex items-center justify-between rounded-lg px-3 py-2.5"
                  style={{ background: C.surface, border: `1px solid ${C.line}` }}
                >
                  <span style={{ fontSize: 13 }}>
                    {s.dateKey}
                    {s.edited && <span style={{ color: C.gold, fontSize: 10 }}> (訂正あり)</span>}
                  </span>
                  <div className="flex items-center gap-3" style={{ fontSize: 11, color: C.muted }}>
                    <span>{s.visitorCount}人</span>
                    <span style={{ fontFamily: FONT_MONO, color: s.grossProfit >= 0 ? C.mint : C.coral, fontWeight: 700 }}>{yen(s.grossProfit)}</span>
                    <ChevronRight size={14} />
                  </div>
                </button>
              ))
          )}
        </div>
      )}

      {view === "month" && <MonthlySummary settlements={settlements} />}
    </div>
  );
}

function SettlementDetail({ settlement, onBack, updateSettlement }) {
  const [editing, setEditing] = useState(false);
  const [form, setForm] = useState(null);

  const startEdit = () => {
    setForm({
      totalSales: String(settlement.totalSales),
      totalSlots: String(settlement.totalSlots),
      visitorCount: String(settlement.visitorCount),
      totalPayout: String(settlement.totalPayout),
    });
    setEditing(true);
  };

  const saveEdit = () => {
    const totalSales = Number(form.totalSales) || 0;
    const totalSlots = Number(form.totalSlots) || 0;
    const visitorCount = Number(form.visitorCount) || 0;
    const totalPayout = Number(form.totalPayout) || 0;
    const grossProfit = totalSales - totalPayout;
    const actualRate = totalSales > 0 ? (totalPayout / totalSales) * 100 : null;
    updateSettlement(settlement.id, (s) => ({ ...s, totalSales, totalSlots, visitorCount, totalPayout, grossProfit, actualRate }));
    setEditing(false);
    setForm(null);
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2">
          <button onClick={onBack} className="press flex items-center justify-center rounded-full" style={{ width: 32, height: 32, background: C.surfaceAlt2 }}>
            <ArrowLeft size={16} color={C.paper} />
          </button>
          <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 17 }}>{settlement.dateKey}</span>
        </div>
        {!editing && (
          <button onClick={startEdit} className="press rounded-lg px-3 py-1.5" style={{ border: `1px solid ${C.gold}`, color: C.gold, fontSize: 12, fontWeight: 700 }}>
            訂正する
          </button>
        )}

      {settlement.edited && (
        <div style={{ fontSize: 11, color: C.muted }}>
          ※この日は手動で訂正されています{settlement.editedAt ? `(最終訂正: ${new Date(settlement.editedAt).toLocaleString("ja-JP")})` : ""}

      {editing ? (

          <div className="flex gap-2">
            <button

        </div>
      )}
    </div>

function MonthlySummary({ settlements }) {
  const byMonth = {};
  settlements.forEach((s) => {
    const mk = monthKeyOf(s.dateKey);
    if (!byMonth[mk]) byMonth[mk] = { totalSales: 0, totalSlots: 0, totalPayout: 0, grossProfit: 0, visitorCount: 0, oripaTotals: {} };
    const m = byMonth[mk];
    m.totalSales += s.totalSales;
    m.totalSlots += s.totalSlots;
    m.totalPayout += s.totalPayout;
    m.grossProfit += s.grossProfit;
    m.visitorCount += s.visitorCount;
    (s.byOripa || []).forEach((o) => {
      if (!m.oripaTotals[o.name]) m.oripaTotals[o.name] = 0;
      m.oripaTotals[o.name] += o.sales;
    });
  });
  const months = Object.keys(byMonth).sort().reverse();

  if (months.length === 0) {
    return (
      <div className="rounded-xl px-4 py-8 text-center" style={{ background: C.surface, border: `1px dashed ${C.line}`, color: C.muted, fontSize: 13 }}>
        精算データがまだありません
      </div>

function ExpectedValuePanel({ oripa, box }) {
  const price = Number(oripa.price) || 0;
  const R = box.remainingSlots;
  const hazureAmount = oripa.minGuarantee.enabled ? Number(oripa.minGuarantee.amount) || 0 : 0;
  const poolValue = box.remainingPrizeAmount + box.remainingHazureCount * hazureAmount;
  const perSlotValue = R > 0 ? poolValue / R : 0;
  const lastOnePerSlot = R > 0 ? box.lastOneRemainingValue / R : 0;

  const rankCounts = useMemo(() => {
    const c = { rainbow: 0, gold: 0, silver: 0, bronze: 0 };
    box.remainingTiers.forEach((t) => {
      if (t.rank && c[t.rank] !== undefined) c[t.rank] += 1;
    });
    return c;
  }, [box.remainingTiers]);
  const anyNormalCount = box.remainingTiers.length;
  const goldPlus = rankCounts.rainbow + rankCounts.gold;
  const silverPlus = goldPlus + rankCounts.silver;
  const hasRankData = rankCounts.rainbow + rankCounts.gold + rankCounts.silver + rankCounts.bronze > 0;

  const quantities = [5, 10, 20, 50, 100].map((n) => Math.min(n, R)).filter((n, i, arr) => n > 0 && arr.indexOf(n) === i);
  if (R > 0 && !quantities.includes(R)) quantities.push(R);

  const rows = useMemo(
    () =>
      quantities.map((n) => {
        const expectedRecovery = n * perSlotValue + n * lastOnePerSlot;
        const cost = n * price;
        const expectedProfit = expectedRecovery - cost;
        const returnRate = cost > 0 ? (expectedRecovery / cost) * 100 : null;
        const profitProb = simulateProfitProbability(box.remainingTiers, box.remainingHazureCount, hazureAmount, box.lastOneRemainingValue, n, price, 1500);
        return {
          n,
          expectedRecovery,
          expectedProfit,
          returnRate,
          profitProb,
          pNormal: probAtLeastOne(R, anyNormalCount, n),
          pRainbow: probAtLeastOne(R, rankCounts.rainbow, n),
          pGoldPlus: probAtLeastOne(R, goldPlus, n),
          pSilverPlus: probAtLeastOne(R, silverPlus, n),
        };
      }),
    // eslint-disable-next-line react-hooks/exhaustive-deps
    [oripa.id, R, price, perSlotValue, lastOnePerSlot]
  );

  if (R === 0) {
    return <div style={{ fontSize: 12, color: C.muted, textAlign: "center", padding: "8px 0" }}>このオリパは終了しています</div>;
  }

  const fullBuyReturn = price > 0 ? ((poolValue + box.lastOneRemainingValue) / (R * price)) * 100 : null;

  return (
    <div className="flex flex-col gap-3">
      <div className="grid grid-cols-2 gap-3">
        <div className="rounded-lg p-3" style={{ background: C.surfaceAlt2 }}>
          <div style={{ fontSize: 10, color: C.muted }}>1口の期待損益</div>
          <div style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 15, color: perSlotValue + lastOnePerSlot - price >= 0 ? C.mint : C.coral }}>
            {yen(perSlotValue + lastOnePerSlot - price)}
          </div>
        </div>
        <div className="rounded-lg p-3" style={{ background: C.surfaceAlt2 }}>
          <div style={{ fontSize: 10, color: C.muted }}>全部買い切った場合の還元率</div>
          <div style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 15, color: fullBuyReturn != null && fullBuyReturn >= 100 ? C.mint : C.coral }}>
            {fullBuyReturn != null ? `${fullBuyReturn.toFixed(1)}%` : "—"}
          </div>
        </div>
      </div>

      <div className="overflow-x-auto">
        <div style={{ minWidth: 560 }}>
          <div className="grid gap-1 px-1 pb-1" style={{ gridTemplateColumns: "0.6fr 1fr 1fr 0.8fr 0.9fr 0.9fr 0.9fr 0.9fr 0.9fr", fontSize: 9, color: C.muted }}>
            <span>口数</span>
            <span className="text-right">期待回収額</span>
            <span className="text-right">期待損益</span>
            <span className="text-right">還元率</span>
            <span className="text-right">黒字確率</span>
            <span className="text-right">当たり1つ以上</span>
            <span className="text-right">虹以上</span>
            <span className="text-right">金以上</span>
            <span className="text-right">銀以上</span>
          </div>
          {rows.map((r) => (
            <div
              key={r.n}
              className="grid items-center gap-1 rounded-lg px-1 py-2"
              style={{ gridTemplateColumns: "0.6fr 1fr 1fr 0.8fr 0.9fr 0.9fr 0.9fr 0.9fr 0.9fr", background: C.surfaceAlt, border: `1px solid ${C.line}`, marginBottom: 4 }}
            >
              <span style={{ fontFamily: FONT_MONO, fontSize: 11, fontWeight: 700 }}>{r.n}</span>
              <span className="text-right" style={{ fontFamily: FONT_MONO, fontSize: 11 }}>
                {yen(r.expectedRecovery)}
              </span>
              <span className="text-right" style={{ fontFamily: FONT_MONO, fontSize: 11, color: r.expectedProfit >= 0 ? C.mint : C.coral }}>
                {r.expectedProfit >= 0 ? "+" : ""}
                {yen(r.expectedProfit)}
              </span>
              <span className="text-right" style={{ fontFamily: FONT_MONO, fontSize: 11 }}>
                {r.returnRate != null ? `${r.returnRate.toFixed(0)}%` : "—"}
              </span>
              <span className="text-right" style={{ fontFamily: FONT_MONO, fontSize: 11 }}>
                {(r.profitProb * 100).toFixed(0)}%
              </span>
              <span className="text-right" style={{ fontFamily: FONT_MONO, fontSize: 11 }}>
                {(r.pNormal * 100).toFixed(0)}%
              </span>
              <span className="text-right" style={{ fontFamily: FONT_MONO, fontSize: 11 }}>
                {hasRankData ? `${(r.pRainbow * 100).toFixed(0)}%` : "—"}
              </span>
              <span className="text-right" style={{ fontFamily: FONT_MONO, fontSize: 11 }}>
                {hasRankData ? `${(r.pGoldPlus * 100).toFixed(0)}%` : "—"}
              </span>
              <span className="text-right" style={{ fontFamily: FONT_MONO, fontSize: 11 }}>
                {hasRankData ? `${(r.pSilverPlus * 100).toFixed(0)}%` : "—"}
              </span>
            </div>
          ))}
        </div>
      </div>
      {!hasRankData && (
        <div style={{ fontSize: 10, color: C.muted }}>
          ※虹・金・銀・銅の確率はオリパ管理であたりに「枠」を設定すると表示されます
        </div>
      )}
    </div>
  );
}

function BulkImportPanel({ oripa, set, onDone }) {
  const [text, setText] = useState("");
  const [parsed, setParsed] = useState(null); // {items, detectedPrice, detectedSlots, detectedGuarantee}
  const rankNames = { rainbow: "虹枠", gold: "金枠", silver: "銀枠", bronze: "銅枠", other: "その他" };

  const runParse = () => {
    if (!text.trim()) return;
    setParsed(parseBulkOripaText(text));
  };

  const removeParsedItem = (id) => {
    setParsed((p) => ({ ...p, items: p.items.filter((i) => i.id !== id) }));
  };
  const updateParsedCount = (id, count) => {
    const n = Math.max(1, Number(count) || 1);
    setParsed((p) => ({ ...p, items: p.items.map((i) => (i.id === id ? { ...i, count: n } : i)) }));
  };
  const updateParsedAmount = (id, amount) => {
    setParsed((p) => ({ ...p, items: p.items.map((i) => (i.id === id ? { ...i, amount: Number(amount) || 0 } : i)) }));
  };
  const updateParsedAmountForeign = (id, amount) => {
    setParsed((p) => ({
      ...p,
      items: p.items.map((i) => (i.id === id ? { ...i, amountForeign: amount === "" ? null : Number(amount) || 0 } : i)),
    }));
  };

  const totalFromItems = (parsed ? parsed.items : []).reduce((a, i) => (i.isLastOne ? a : a + i.amount * i.count), 0);
  const lastOneItem = parsed ? parsed.items.find((i) => i.isLastOne) : null;

  const commit = () => {
    if (!parsed || parsed.items.length === 0) return;
    const newTiers = [];
    parsed.items.forEach((i) => {
      if (i.isLastOne) return;
      for (let n = 0; n < i.count; n++) newTiers.push({ id: uid(), name: i.name, amount: i.amount, amountForeign: i.amountForeign, rank: i.rank });
    });
    set((o) => {
      const next = { ...o, tiers: [...o.tiers, ...newTiers] };
      if (lastOneItem) {
        next.lastOne = {
          ...o.lastOne,
          enabled: true,
          name: o.lastOne.enabled ? o.lastOne.name : `${lastOneItem.name}(ラストワン)`,
          amount: lastOneItem.amount,
          amountForeign: lastOneItem.amountForeign,
        };
      }
      if (parsed.detectedPrice && !Number(o.price)) next.price = parsed.detectedPrice;
      if (parsed.detectedSlots && !Number(o.totalSlots)) next.totalSlots = parsed.detectedSlots;
      if (parsed.detectedGuarantee && !o.minGuarantee.enabled) {
        next.minGuarantee = { ...o.minGuarantee, enabled: true, amount: parsed.detectedGuarantee };
      }
      return next;
    });
    setText("");
    setParsed(null);
    onDone();
  };

  return (
    <div className="rounded-xl p-3 flex flex-col gap-3" style={{ background: C.surfaceAlt2, border: `1px solid ${C.gold}` }}>
      <div style={{ fontSize: 11, color: C.muted }}>
        景品リストのテキストをそのまま貼り付けてください(「・カード名:5.4万」「虹枠」のような見出し、タブ区切りの表などにある程度対応します)。「29（28」のように括弧で外国人価格を書くと自動で読み取ります。解析結果は必ず内容を確認してから登録されます。
      </div>
      <textarea
        value={text}
        onChange={(e) => setText(e.target.value)}
        rows={6}
        style={{ ...inputStyle, fontFamily: FONT_BODY, resize: "vertical" }}
        placeholder={"例:\n○虹枠\n・151:5.4万\n・アタッシュ:3万\n○金枠\n・ストームエメラルダ:1.7万×12"}
      />
      <button onClick={runParse} className="press rounded-lg py-2" style={{ background: C.gold, color: C.ink, fontWeight: 700, fontSize: 13 }}>
        解析する
      </button>

      {parsed && (
        <div className="flex flex-col gap-2">
          {(parsed.detectedPrice || parsed.detectedSlots || parsed.detectedGuarantee) && (
            <div style={{ fontSize: 11, color: C.gold }}>
              検出:
              {parsed.detectedPrice ? ` 単価${yen(parsed.detectedPrice)}` : ""}
              {parsed.detectedSlots ? ` ・総口数${parsed.detectedSlots}口` : ""}
              {parsed.detectedGuarantee ? ` ・保証${yen(parsed.detectedGuarantee)}` : ""}
              (未設定の項目のみ登録時に反映されます)
            </div>
          )}
          {parsed.items.length === 0 ? (
            <div style={{ fontSize: 12, color: C.coral, textAlign: "center", padding: "8px 0" }}>解析できる項目が見つかりませんでした</div>
          ) : (
            <>
              <div style={{ fontSize: 11, color: C.muted }}>
                {parsed.items.filter((i) => !i.isLastOne).length}件を検出(景品総額 {yen(totalFromItems)}
                {lastOneItem ? ` ・ラストワン ${lastOneItem.name} ${yen(lastOneItem.amount)}` : ""})。内容を確認し、不要な行は削除してください。
              </div>

              {/* 封入率プレビュー */}
              {(() => {
                const totalSlots = Number(oripa.totalSlots) || parsed.detectedSlots || 0;
                const nonLast = parsed.items.filter((i) => !i.isLastOne);
                const totalWins = nonLast.reduce((a, i) => a + (Number(i.count) || 0), 0);
                const byRank = {};
                nonLast.forEach((i) => {
                  const k = i.rank || "none";
                  if (!byRank[k]) byRank[k] = { count: 0, amount: 0 };
                  byRank[k].count += Number(i.count) || 0;
                  byRank[k].amount += (Number(i.amount) || 0) * (Number(i.count) || 0);
                });
                const RANK_LABEL_LOCAL = { rainbow: "虹枠", gold: "金枠", silver: "銀枠", bronze: "銅枠", other: "その他", none: "枠なし" };
                const RANK_COLOR_LOCAL = { rainbow: C.gold, gold: "#D4A94A", silver: "#B8C0CC", bronze: "#B08D57", other: C.muted, none: C.muted };
                const rate = totalSlots > 0 ? (totalWins / totalSlots) * 100 : null;
                return (
                  <div className="rounded-lg p-3 flex flex-col gap-2" style={{ background: C.surface, border: `1px solid ${C.gold}` }}>
                    <div className="flex items-center justify-between">
                      <span style={{ fontSize: 11, color: C.muted }}>仮の封入率(登録前)</span>
                      {totalSlots > 0 ? (
                        <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: C.gold, fontSize: 16 }}>
                          {totalWins}/{totalSlots} ({rate.toFixed(1)}%)
                        </span>
                      ) : (
                        <span style={{ fontSize: 11, color: C.coral }}>総口数未設定</span>
                      )}
                    </div>
                    {Object.keys(byRank).length > 0 && (
                      <div className="grid grid-cols-2 gap-1.5">
                        {["rainbow", "gold", "silver", "bronze", "other", "none"].filter((k) => byRank[k]).map((k) => {
                          const r = totalSlots > 0 ? (byRank[k].count / totalSlots) * 100 : null;
                          return (
                            <div key={k} className="flex items-center justify-between rounded-md px-2 py-1" style={{ background: C.surfaceAlt, borderLeft: `3px solid ${RANK_COLOR_LOCAL[k]}` }}>
                              <span style={{ fontSize: 10, color: RANK_COLOR_LOCAL[k], fontWeight: 700 }}>{RANK_LABEL_LOCAL[k]}</span>
                              <span style={{ fontSize: 10, color: C.muted, fontFamily: FONT_MONO }}>
                                {byRank[k].count}口{r != null ? ` (${r.toFixed(1)}%)` : ""}
                              </span>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })()}

              <div className="flex flex-col gap-1.5" style={{ maxHeight: 260, overflowY: "auto" }}>
                {parsed.items.map((i) => (
                  <div key={i.id} className="flex items-center justify-between gap-2 rounded-lg px-2.5 py-1.5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
                    <div className="flex items-center gap-1.5 min-w-0" style={{ flex: 1 }}>
                      {i.isLastOne ? (
                        <Crown size={12} color={C.gold} />
                      ) : i.rank ? (
                        <span style={{ fontSize: 9, color: C.muted, border: `1px solid ${C.line}`, borderRadius: 999, padding: "0 5px", flexShrink: 0 }}>
                          {rankNames[i.rank]}
                        </span>
                      ) : null}
                      <span style={{ fontSize: 12, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{i.name}</span>
                    </div>
                    <div className="flex items-center gap-1.5 flex-shrink-0">
                      <input
                        type="number"
                        inputMode="numeric"
                        min="1"
                        value={i.amount}
                        onChange={(e) => updateParsedAmount(i.id, e.target.value)}
                        style={{ ...inputStyle, width: 66, padding: "5px 6px", fontSize: 11 }}
                        title="日本人価格"
                      />
                      <input
                        type="number"
                        inputMode="numeric"
                        min="0"
                        value={i.amountForeign == null ? "" : i.amountForeign}
                        onChange={(e) => updateParsedAmountForeign(i.id, e.target.value)}
                        placeholder="外"
                        style={{ ...inputStyle, width: 58, padding: "5px 6px", fontSize: 11, borderColor: i.amountForeign != null ? C.gold : C.line }}
                        title="外国人価格(空欄なら日本人と同じ)"
                      />
                      {!i.isLastOne && (
                        <>
                          <span style={{ fontSize: 10, color: C.muted }}>×</span>
                          <input
                            type="number"
                            inputMode="numeric"
                            min="1"
                            value={i.count}
                            onChange={(e) => updateParsedCount(i.id, e.target.value)}
                            style={{ ...inputStyle, width: 42, padding: "5px 6px", fontSize: 11, textAlign: "center" }}
                            title="個数"
                          />
                        </>
                      )}
                      <button onClick={() => removeParsedItem(i.id)}>
                        <X size={13} color={C.muted} />
                      </button>
                    </div>
                  </div>
                ))}
              </div>
              <button onClick={commit} className="press rounded-lg py-2.5" style={{ background: C.mint, color: C.ink, fontWeight: 700, fontSize: 13 }}>
                この内容をオリパに追加する
              </button>
            </>
          )}
        </div>
      )}
    </div>
  );
}

function OripaEditCard({ oripa, fullLog, expanded, onToggle, updateOripa, deleteOripa, clearLog }) {

  const [newTierAmount, setNewTierAmount] = useState("");
  const [newTierAmountForeign, setNewTierAmountForeign] = useState("");
  const [newTierRank, setNewTierRank] = useState("");
  const [newTierCount, setNewTierCount] = useState("1");

  const [confirmClear, setConfirmClear] = useState(false);

  const set = (updater) => updateOripa(oripa.id, updater);

  const addTier = () => {
    if (!newTierName.trim() || newTierAmount === "") return;
    const count = Math.max(1, Math.min(999, parseInt(newTierCount, 10) || 1));
    const newTiers = Array.from({ length: count }, () => ({
      id: uid(),
      name: newTierName.trim(),
      amount: Number(newTierAmount) || 0,
      amountForeign: newTierAmountForeign === "" ? null : Number(newTierAmountForeign) || 0,
      rank: newTierRank || null,
    }));
    set((o) => ({ ...o, tiers: [...o.tiers, ...newTiers] }));
    setNewTierName("");
    setNewTierAmount("");
    setNewTierAmountForeign("");
    setNewTierCount("1");
  };
  const removeTier = (id) => set((o) => ({ ...o, tiers: o.tiers.filter((t) => t.id !== id) }));

  const rate = oripa.totalSlots ? ((oripa.tiers.length / Number(oripa.totalSlots)) * 100).toFixed(1) : null;

  const box = useMemo(() => computeBoxState(fullLog || [], oripa), [fullLog, oripa]);
  const remainingWinTotal = box.remainingPrizeAmount + box.lastOneRemainingValue;

            {yen(oripa.price)} / 回 ・ {oripa.tiers.length}種のあたり{rate ? ` ・ ${rate}%` : ""}
          </div>
          <div style={{ fontSize: 11, color: C.mint, marginTop: 2 }}>残りのあたり額合計 {yen(remainingWinTotal)}</div>
        </div>
        <ChevronRight size={16} color={C.muted} style={{ transform: expanded ? "rotate(90deg)" : "none", transition: "transform .15s" }} />
      </button>

      {expanded && (
        <div className="px-4 pb-4 flex flex-col gap-4" style={{ borderTop: `1px solid ${C.line}` }}>
          <div
            className="rounded-lg px-3 py-2.5 flex items-center justify-between mt-4"
            style={{ background: "rgba(111,207,143,0.12)", border: `1px solid ${C.mint}` }}
          >
            <span style={{ fontSize: 12, color: C.mint, display: "flex", alignItems: "center", gap: 6 }}>
              <Sparkles size={13} />
              残りのあたり額の合計({box.remainingTiers.length}種{box.lastOneAwarded ? "" : oripa.lastOne.enabled ? "+ラストワン" : ""})
            </span>
            <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 16, color: C.mint }}>{yen(remainingWinTotal)}</span>
          </div>
          <div>
            <label style={labelStyle}>オリパ名</label>
            <input value={oripa.name} onChange={(e) => set((o) => ({ ...o, name: e.target.value }))} style={{ ...inputStyle, fontFamily: FONT_BODY }} />
          </div>
          <div>
            <label style={labelStyle}>単価(1回あたり・円)</label>
            <input type="number" inputMode="numeric" value={oripa.price} onChange={(e) => set((o) => ({ ...o, price: e.target.value }))} style={inputStyle} placeholder="例: 1000" />
          </div>
          <div>
            <label style={labelStyle}>総口数(箱全体の回数)</label>
            <input type="number" inputMode="numeric" value={oripa.totalSlots} onChange={(e) => set((o) => ({ ...o, totalSlots: e.target.value }))} style={inputStyle} placeholder="例: 100" />
          </div>
          <div>
            <label style={labelStyle}>目標還元率(%)</label>
            <input
              type="number"

          <div className="flex flex-col gap-2">

              <span style={{ fontSize: 13, fontWeight: 700 }}>あたり金額</span>

            <div className="flex gap-2">

            </div>
            {oripa.minGuarantee.enabled && (
              <>
                <input
                  type="number"
                  inputMode="numeric"
                  value={oripa.minGuarantee.amount}
                  onChange={(e) => set((o) => ({ ...o, minGuarantee: { ...o.minGuarantee, amount: e.target.value } }))}
                  placeholder="例: 100"
                  style={inputStyle}
                />
                <div className="flex items-center justify-between">
                  <span style={{ fontSize: 12, color: C.muted }}>適用範囲</span>
                  <div className="flex rounded-lg overflow-hidden" style={{ border: `1px solid ${C.line}` }}>
                    <button
                      onClick={() => set((o) => ({ ...o, minGuarantee: { ...o.minGuarantee, applyToAll: false } }))}
                      className="press px-3 py-1.5"
                      style={{
                        background: !oripa.minGuarantee.applyToAll ? C.gold : "transparent",
                        color: !oripa.minGuarantee.applyToAll ? C.ink : C.muted,
                        fontSize: 12,
                        fontWeight: 700,
                      }}
                    >
                      ハズレのみ
                    </button>
                    <button
                      onClick={() => set((o) => ({ ...o, minGuarantee: { ...o.minGuarantee, applyToAll: true } }))}
                      className="press px-3 py-1.5"
                      style={{
                        background: oripa.minGuarantee.applyToAll ? C.gold : "transparent",
                        color: oripa.minGuarantee.applyToAll ? C.ink : C.muted,
                        fontSize: 12,
                        fontWeight: 700,
                      }}
                    >
                      全口
                    </button>
                  </div>
                </div>
              </>
            )}
          </div>

          <div>
            <div className="flex items-center gap-1.5 mb-2" style={{ color: C.muted, fontSize: 11 }}>
              <PercentCircle size={12} />
              <span>封入率表(箱全体)</span>
            </div>
            {Number(oripa.totalSlots) ? <RateTable rows={configuredRateRows(oripa)} /> : <div style={{ fontSize: 12, color: C.muted }}>総口数を設定すると表示されます</div>}
          </div>

          <div className="flex flex-col gap-2 pt-2" style={{ borderTop: `1px dashed ${C.line}` }}>
            {!confirmClear ? (
              <button onClick={() => setConfirmClear(true)} className="press flex items-center justify-center gap-1.5 py-2.5 rounded-lg" style={{ border: `1px solid ${C.line}`, color: C.muted, fontSize: 12 }}>
                <RotateCcw size={13} />
                この箱をリセット(新しい箱にする)
              </button>
            ) : (
              <div className="flex gap-2">
                <button onClick={() => setConfirmClear(false)} className="press flex-1 py-2 rounded-lg" style={{ border: `1px solid ${C.line}`, color: C.paper, fontSize: 12 }}>
                  キャンセル
                </button>
                <button
                  onClick={() => {
                    clearLog(oripa.id);
                    setConfirmClear(false);
                  }}
                  className="press flex-1 py-2 rounded-lg"
                  style={{ background: C.coral, color: C.ink, fontSize: 12, fontWeight: 700 }}
                >
                  リセットする
                </button>
              </div>
            )}

            {!confirmDelete ? (
              <button onClick={() => setConfirmDelete(true)} className="press flex items-center justify-center gap-1.5 py-2.5 rounded-lg" style={{ border: `1px solid ${C.coral}`, color: C.coral, fontSize: 12 }}>
                <Trash2 size={13} />
                このオリパを削除
              </button>
            ) : (
              <div className="flex gap-2">
                <button onClick={() => setConfirmDelete(false)} className="press flex-1 py-2 rounded-lg" style={{ border: `1px solid ${C.line}`, color: C.paper, fontSize: 12 }}>
                  キャンセル
                </button>
                <button onClick={() => deleteOripa(oripa.id)} className="press flex-1 py-2 rounded-lg" style={{ background: C.coral, color: C.ink, fontSize: 12, fontWeight: 700 }}>
                  削除する
                </button>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}
