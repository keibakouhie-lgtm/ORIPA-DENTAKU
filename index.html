// ---------- STORE: 営業中のお客様管理 ----------
function ActiveCustomers({ oripaList, logsById, sessions, customers, startSession, endSession, reopenSession, recordSessionDraw, recordSessionWin, setSessionHazureNotRedeemed, undoLastSessionEntry }) {
  const [formOpen, setFormOpen] = useState(false);
  const [name, setName] = useState("");
  const [showSuggestions, setShowSuggestions] = useState(false);
  const [oripaId, setOripaId] = useState("");
  const [isForeign, setIsForeign] = useState(false);
  const [showDetails, setShowDetails] = useState(false);
  const [hiddenRevealed, setHiddenRevealed] = useState(false);
  const [hiddenTapCount, setHiddenTapCount] = useState(0);
  const tapHidden = () => {
    if (hiddenRevealed) return;
    const next = hiddenTapCount + 1;
    if (next >= 5) {
      setHiddenRevealed(true);
      setHiddenTapCount(0);
    } else {
      setHiddenTapCount(next);
    }
  };

  useEffect(() => {
    if (!oripaId && oripaList.length) setOripaId(oripaList[0].id);
  }, [oripaList, oripaId]);

  const activeSessions = sessions.filter((s) => !s.endTs).sort((a, b) => b.startTs - a.startTs);
  const endedToday = sessions
    .filter((s) => s.endTs && dateKeyOf(s.endTs) === todayKey())
    .sort((a, b) => b.endTs - a.endTs);

  const nameSuggestions =
    name.trim().length > 0
      ? customers
          .filter((c) => c.name.toLowerCase().includes(name.trim().toLowerCase()) && c.name !== name)
          .sort((a, b) => b.lastVisitTs - a.lastVisitTs)
          .slice(0, 5)
      : [];

  const submit = () => {
    if (!name.trim() || !oripaId) return;
    startSession(name, oripaId, isForeign, showDetails);
    setName("");
    setIsForeign(false);
    setShowDetails(false);
    setHiddenRevealed(false);
    setHiddenTapCount(0);
    setShowSuggestions(false);
    setFormOpen(false);
  };

  return (
    <div className="flex flex-col gap-4">
      {!formOpen ? (
        <button
          onClick={() => {
            // reset per-customer state so hidden panel starts closed every time
            setShowDetails(false);
            setHiddenRevealed(false);
            setHiddenTapCount(0);
            setIsForeign(false);
            setFormOpen(true);
          }}
          className="press flex items-center justify-center gap-2 rounded-xl py-3"
          style={{ background: C.gold, color: C.ink, fontWeight: 700 }}
        >
          <UserPlus size={16} />
          お客様を追加
        </button>
      ) : (
        <div className="rounded-xl p-4 flex flex-col gap-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="relative">
            <label style={labelStyle}>お客様名</label>
            <input
              value={name}
              onChange={(e) => {
                setName(e.target.value);
                setShowSuggestions(true);
              }}
              onFocus={() => setShowSuggestions(true)}
              style={{ ...inputStyle, fontFamily: FONT_BODY }}
              placeholder="例: 田中さん"
              autoFocus
              autoComplete="off"
            />
            {showSuggestions && nameSuggestions.length > 0 && (
              <div
                className="absolute left-0 right-0 mt-1 rounded-lg overflow-hidden z-10"
                style={{ background: C.surfaceAlt2, border: `1px solid ${C.gold}`, top: "100%" }}
              >
                {nameSuggestions.map((c) => (
                  <button
                    key={c.id}
                    onClick={() => {
                      setName(c.name);
                      setShowSuggestions(false);
                    }}
                    className="press w-full flex items-center justify-between px-3 py-2.5"
                    style={{ borderBottom: `1px solid ${C.line}` }}
                  >
                    <span style={{ fontSize: 13 }}>{c.name}</span>
                    <span style={{ fontSize: 10, color: C.muted }}>来店{c.visitCount}回</span>
                  </button>
                ))}
              </div>
            )}
          </div>
          <div>
            <label style={labelStyle}>利用するオリパ</label>
            <select
              value={oripaId}
              onChange={(e) => setOripaId(e.target.value)}
              onFocus={() => setShowSuggestions(false)}
              style={{ ...inputStyle, fontFamily: FONT_BODY }}
            >
              {oripaList.map((o) => (
                <option key={o.id} value={o.id}>
                  {o.name}
                </option>
              ))}
            </select>
          </div>
          <div>
            <label style={labelStyle}>お客様の区分</label>
            <div className="flex gap-2">
              {[
                [false, "日本人"],
                [true, "外国人"],
              ].map(([v, l]) => (
                <button
                  key={String(v)}
                  onClick={() => {
                    setIsForeign(v);
                    setShowSuggestions(false);
                  }}
                  className="press flex-1 rounded-lg py-2"
                  style={{ background: isForeign === v ? C.gold : C.surfaceAlt, color: isForeign === v ? C.ink : C.muted, fontSize: 12, fontWeight: 700 }}
                >
                  {l}
                </button>
              ))}
            </div>
          </div>

          {/* hidden staff-only toggle: tap the tiny dot to unlock */}
          {hiddenRevealed ? (
            <div
              className="rounded-lg px-3 py-2.5 flex items-center justify-between"
              style={{ background: C.surfaceAlt2, border: `1px dashed ${C.gold}` }}
            >
              <div className="flex flex-col">
                <span style={{ fontSize: 12, fontWeight: 700, color: C.gold }}>詳細情報を表示</span>
                <span style={{ fontSize: 10, color: C.muted }}>当選確率・封入額など(店舗側のみ)</span>
              </div>
              <Toggle checked={showDetails} onChange={setShowDetails} />
            </div>
          ) : (
            <button
              onClick={tapHidden}
              className="press"
              style={{
                alignSelf: "flex-end",
                width: 16,
                height: 16,
                borderRadius: 999,
                background: hiddenTapCount > 0 ? C.gold : C.surfaceAlt2,
                opacity: hiddenTapCount > 0 ? 0.6 : 0.3,
                border: "none",
              }}
              aria-label="staff"
            />
          )}
          <div className="flex gap-2">
            <button
              onClick={() => {
                setFormOpen(false);
                setIsForeign(false);
                setShowDetails(false);
                setHiddenRevealed(false);
                setHiddenTapCount(0);
              }}
              className="press flex-1 py-2 rounded-lg"
              style={{ border: `1px solid ${C.line}`, color: C.paper, fontSize: 13 }}
            >
              キャンセル
            </button>
            <button onClick={submit} className="press flex-1 py-2 rounded-lg" style={{ background: C.gold, color: C.ink, fontSize: 13, fontWeight: 700 }}>
              開始
            </button>
          </div>
        </div>
      )}

      {activeSessions.length === 0 ? (
        <div className="rounded-xl px-4 py-8 text-center" style={{ background: C.surface, border: `1px dashed ${C.line}`, color: C.muted, fontSize: 13 }}>
          営業中のお客様はいません
        </div>
      ) : (
        <div className="flex flex-col gap-3">
          {activeSessions.map((s) => {
            const oripa = oripaList.find((o) => o.id === s.oripaId);
            if (!oripa) return null;
            return (
              <SessionCard
                key={s.id}
                session={s}
                oripa={oripa}
                fullLog={logsById[oripa.id] || []}
                onDraw={() => recordSessionDraw(s)}
                onWin={(t) => recordSessionWin(s, t)}
                onHazure={(count) => setSessionHazureNotRedeemed(s, count)}
                onEnd={() => endSession(s.id)}
                onUndo={() => undoLastSessionEntry(s)}
              />
            );
          })}
        </div>
      )}

      {endedToday.length > 0 && (
        <div className="flex flex-col gap-2">
          <div className="flex items-center gap-1.5" style={{ color: C.muted, fontSize: 12 }}>
            <CalendarCheck size={13} />
            <span>本日の終了済みお客様</span>
          </div>
          {endedToday.map((s) => {
            const oripa = oripaList.find((o) => o.id === s.oripaId);
            const log = oripa ? (logsById[oripa.id] || []).filter((e) => e.sessionId === s.id) : [];
            const guaranteeAmount = oripa && oripa.minGuarantee.enabled ? Number(oripa.minGuarantee.amount) || 0 : 0;
            const totals = computeTotals(log, guaranteeAmount);
            const dColor = totals.diff > 0 ? C.mint : totals.diff < 0 ? C.coral : C.paper;
            return (
              <div key={s.id} className="flex items-center justify-between rounded-lg px-3 py-2.5" style={{ background: C.surfaceAlt, border: `1px solid ${C.line}` }}>
                <div>
                  <div style={{ fontSize: 13 }}>
                    {s.customerName} <span style={{ color: C.muted, fontSize: 11 }}>・ {s.oripaName}</span>
                  </div>
                  <div style={{ fontSize: 11, color: C.muted }}>
                    {totals.drawCount}口 ・ {yen(totals.totalSpent)} → {yen(totals.totalPayout)}
                  </div>
                </div>
                <div className="flex items-center gap-3">
                  <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 13, color: dColor }}>
                    {totals.diff >= 0 ? "+" : ""}
                    {yen(totals.diff)}
                  </span>
                  <button onClick={() => reopenSession(s.id)} className="press rounded-lg px-2 py-1" style={{ border: `1px solid ${C.line}`, color: C.muted, fontSize: 10 }}>
                    再開
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

const RANK_GROUP_COLOR = { rainbow: C.gold, gold: "#D4A94A", silver: "#B8C0CC", bronze: "#B08D57", other: C.muted };
const RANK_GROUP_LABEL = { rainbow: "🌈 虹枠", gold: "🥇 金枠", silver: "🥈 銀枠", bronze: "🥉 銅枠", other: "その他" };
const RANK_GROUP_ORDER = ["rainbow", "gold", "silver", "bronze", "other"];

function RankGroupedPicker({ tiers, onPick, isForeign = false }) {
  const groups = {};
  tiers.forEach((t) => {
    const key = RANK_GROUP_ORDER.includes(t.rank) ? t.rank : "other";
    if (!groups[key]) groups[key] = [];
    groups[key].push(t);
  });

  const priceOf = (t) => isForeign && t.amountForeign != null && t.amountForeign !== ""
    ? Number(t.amountForeign) || 0
    : Number(t.amount) || 0;

  return (
    <div className="flex flex-col gap-3">
      {RANK_GROUP_ORDER.filter((k) => groups[k] && groups[k].length > 0).map((k) => (
        <div key={k} className="flex flex-col gap-1.5">
          <div className="flex items-center justify-between">
            <span style={{ fontSize: 11, fontWeight: 700, color: RANK_GROUP_COLOR[k] }}>{RANK_GROUP_LABEL[k]}</span>
            <span style={{ fontSize: 10, color: C.muted }}>{groups[k].length}個</span>
          </div>
          <div className="grid grid-cols-2 gap-2">
            {groups[k].map((t) => (
              <button
                key={t.id}
                onClick={() => onPick(t)}
                className="press flex flex-col items-start rounded-lg px-3 py-2"
                style={{ background: C.surfaceAlt, border: `1px solid ${RANK_GROUP_COLOR[k]}` }}
              >
                <span style={{ fontSize: 11, color: C.muted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", width: "100%" }}>
                  {t.name}
                </span>
                <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: RANK_GROUP_COLOR[k], fontSize: 13 }}>{yen(priceOf(t))}</span>
              </button>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function SessionCard({ session, oripa, fullLog, onDraw, onWin, onHazure, onEnd, onUndo }) {
  const [notRedeemedInput, setNotRedeemedInput] = useState(null);
  const [showWinPicker, setShowWinPicker] = useState(false);
  const [showHistory, setShowHistory] = useState(false);
  const sessionLog = useMemo(() => fullLog.filter((e) => e.sessionId === session.id), [fullLog, session.id]);
  const guaranteeAmount = oripa.minGuarantee.enabled ? Number(oripa.minGuarantee.amount) || 0 : 0;
  const totals = useMemo(() => computeTotals(sessionLog, guaranteeAmount), [sessionLog, guaranteeAmount]);
  const box = useMemo(() => computeBoxState(fullLog, oripa), [fullLog, oripa]);
  const diffColor = totals.diff > 0 ? C.mint : totals.diff < 0 ? C.coral : C.paper;
  const diffBg = totals.diff > 0 ? "rgba(111,207,143,0.10)" : totals.diff < 0 ? "rgba(226,105,79,0.10)" : C.surfaceAlt;
  const isForeign = !!session.isForeign;

  const openNotRedeemed = () => setNotRedeemedInput(String(totals.hazureNotRedeemedCount || 0));
  const confirmNotRedeemed = () => {
    onHazure(notRedeemedInput);
    setNotRedeemedInput(null);
  };

  // when foreign session, show remaining prize based on foreign amounts
  const remainingWinTotalForSession = useMemo(() => {
    const tiersSum = box.remainingTiers.reduce((a, t) => {
      const amt = isForeign && t.amountForeign != null && t.amountForeign !== ""
        ? Number(t.amountForeign) || 0
        : Number(t.amount) || 0;
      return a + amt;
    }, 0);
    const lastOne = oripa.lastOne.enabled && !box.lastOneAwarded && Number(oripa.totalSlots) > 0
      ? (isForeign && oripa.lastOne.amountForeign != null && oripa.lastOne.amountForeign !== ""
          ? Number(oripa.lastOne.amountForeign) || 0
          : Number(oripa.lastOne.amount) || 0)
      : 0;
    return tiersSum + lastOne;
  }, [box.remainingTiers, box.lastOneAwarded, isForeign, oripa]);

  return (
    <div className="rounded-xl p-4 flex flex-col gap-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
      <div className="flex items-center justify-between">
        <div>
          <div className="flex items-center gap-2">
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 15 }}>{session.customerName}</div>
            {isForeign && (
              <span style={{ fontSize: 10, fontWeight: 700, color: C.ink, background: C.gold, borderRadius: 999, padding: "1px 8px" }}>外国人</span>
            )}
          </div>
          <div style={{ fontSize: 11, color: C.muted }}>
            {oripa.name}
          </div>
        </div>
        <button onClick={onEnd} className="press rounded-lg px-3 py-1.5" style={{ border: `1px solid ${C.line}`, color: C.muted, fontSize: 12 }}>
          終了
        </button>
      </div>

      {Number(oripa.totalSlots) > 0 && !!session.showDetails && (
        <div className="rounded-lg px-3 py-2 flex flex-col gap-1.5" style={{ background: C.surfaceAlt2, border: `1px solid ${C.line}` }}>
          <div className="flex items-center justify-between">
            <span style={{ fontSize: 11, color: C.muted }}>全体の当選確率</span>
            <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 14, color: C.gold }}>
              {oripa.tiers.length}/{oripa.totalSlots}
              {box.configuredRate != null ? `(${box.configuredRate.toFixed(1)}%)` : ""}
            </span>
          </div>
          {oripa.minGuarantee.enabled && (
            <div className="flex items-center justify-between">
              <span style={{ fontSize: 11, color: C.muted }}>ハズレ(全体)・封入額</span>
              <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 14, color: C.muted }}>
                {Math.max(0, Number(oripa.totalSlots) - oripa.tiers.length)}口 ・ {yen(Math.max(0, Number(oripa.totalSlots) - oripa.tiers.length) * guaranteeAmount)}
              </span>
            </div>
          )}
          <div className="flex items-center justify-between" style={{ borderTop: `1px dashed ${C.line}`, paddingTop: 6, marginTop: 2 }}>
            <span style={{ fontSize: 11, color: C.muted }}>残りあたり数(残り口数中)</span>
            <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 14, color: C.gold }}>
              {box.remainingTiers.length}/{box.remainingSlots}
              {box.remainingSlots > 0 ? `(${((box.remainingTiers.length / box.remainingSlots) * 100).toFixed(1)}%)` : ""}
            </span>
          </div>
          {oripa.minGuarantee.enabled && (
            <div className="flex items-center justify-between">
              <span style={{ fontSize: 11, color: C.muted }}>残りハズレ・封入額</span>
              <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 14, color: C.muted }}>
                {box.remainingHazureCount}口 ・ {yen(box.remainingHazureCount * guaranteeAmount)}
              </span>
            </div>
          )}
          <div className="flex items-center justify-between">
            <span style={{ fontSize: 11, color: C.muted }}>残りのあたり額{isForeign ? "(外国人)" : ""}</span>
            <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 14, color: C.mint }}>
              {yen(remainingWinTotalForSession)}
            </span>
          </div>
        </div>
      )}

      <div className="grid grid-cols-2 gap-3">
        <StatBlock label="購入口数" value={`${totals.drawCount}口`} />
        <StatBlock label="あたり回数" value={`${totals.winCount}回`} color={C.gold} />
        <StatBlock label="支払金額" value={yen(totals.totalSpent)} color={C.coral} />
        <StatBlock label="獲得景品総額" value={yen(totals.totalPayout)} color={C.mint} />
      </div>

      {/* big diff panel */}
      <div
        className="rounded-xl px-4 py-3 flex items-center justify-between"
        style={{ background: diffBg, border: `1px solid ${diffColor === C.paper ? C.line : diffColor}` }}
      >
        <div className="flex items-center gap-2">
          {totals.diff > 0 && <TrendingUp size={18} color={diffColor} />}
          {totals.diff < 0 && <TrendingDown size={18} color={diffColor} />}
          <span style={{ fontSize: 13, color: C.muted, fontWeight: 700 }}>現在損益</span>
        </div>
        <span style={{ fontFamily: FONT_MONO, fontSize: 28, fontWeight: 800, color: diffColor, letterSpacing: -0.5 }}>
          {totals.diff >= 0 ? "+" : ""}
          {yen(totals.diff)}
        </span>
      </div>
      <div className="flex justify-between items-center">
        <span style={{ fontSize: 12, color: C.muted }}>回収率</span>
        <span style={{ fontFamily: FONT_MONO, fontSize: 13, fontWeight: 700 }}>{totals.recoveryRate != null ? `${totals.recoveryRate.toFixed(1)}%` : "—"}</span>
      </div>

      <div className="grid grid-cols-2 gap-2">
        <button onClick={onDraw} className="press rounded-lg py-2.5" style={{ background: C.gold, color: C.ink, fontWeight: 700, fontSize: 13 }}>
          ＋1口購入({yen(oripa.price)})
        </button>
        <button
          onClick={() => setShowWinPicker((v) => !v)}
          className="press rounded-lg py-2.5"
          style={{ border: `1px solid ${C.line}`, color: C.gold, fontWeight: 700, fontSize: 13 }}
        >
          景品を記録
        </button>
      </div>

      {showWinPicker &&
        (box.remainingTiers.length === 0 ? (
          <div style={{ fontSize: 12, color: C.muted, textAlign: "center" }}>残りのあたりはありません</div>
        ) : (
          <RankGroupedPicker
            tiers={box.remainingTiers}
            isForeign={isForeign}
            onPick={(t) => {
              onWin(t);
              setShowWinPicker(false);
            }}
          />
        ))}

      {oripa.minGuarantee.enabled &&
        (notRedeemedInput === null ? (
          <button
            onClick={openNotRedeemed}
            className="press flex items-center justify-between rounded-lg px-3 py-2"
            style={{ border: `1px solid ${C.line}`, fontSize: 12, color: C.muted }}
          >
            <span>保証に出さなかった枚数</span>
            <span style={{ fontFamily: FONT_MONO, color: C.paper, fontWeight: 700 }}>{totals.hazureNotRedeemedCount}枚</span>
          </button>
        ) : (
          <div className="flex gap-2">
            <input type="number" inputMode="numeric" value={notRedeemedInput} onChange={(e) => setNotRedeemedInput(e.target.value)} style={inputStyle} autoFocus />
            <button onClick={confirmNotRedeemed} className="press rounded-lg px-4" style={{ background: C.gold, color: C.ink, fontWeight: 700, fontSize: 13 }}>
              更新
            </button>
            <button onClick={() => setNotRedeemedInput(null)} className="press rounded-lg px-3" style={{ border: `1px solid ${C.line}`, color: C.muted }}>
              <X size={16} />
            </button>
          </div>
        ))}

      <div className="flex items-center justify-between pt-1" style={{ borderTop: `1px dashed ${C.line}` }}>
        {sessionLog.length > 0 ? (
          <button onClick={onUndo} className="press flex items-center gap-1.5" style={{ color: C.muted, fontSize: 12 }}>
            <Undo2 size={13} />
            一つ前を訂正
          </button>
        ) : (
          <span />
        )}
        <button onClick={() => setShowHistory((v) => !v)} className="press flex items-center gap-1.5" style={{ color: C.gold, fontSize: 12 }}>
          <History size={13} />
          {showHistory ? "履歴を閉じる" : "あたり履歴を見る"}
        </button>
      </div>

      {showHistory && <PersonalHistory sessionLog={sessionLog} />}
    </div>
  );
}

function PersonalHistory({ sessionLog }) {
  const sorted = sessionLog.filter((e) => e.type === "win").sort((a, b) => b.ts - a.ts);
  const fmtTime = (ts) => {
    const d = new Date(ts);
    return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };
  const rowIcon = (e) => (e.isLastOne ? <Crown size={14} color={C.gold} /> : <Sparkles size={14} color={C.gold} />);

  if (sorted.length === 0) {
    return <div style={{ fontSize: 12, color: C.muted, textAlign: "center", padding: "12px 0" }}>まだあたりがありません</div>;
  }

  return (
    <div className="flex flex-col gap-1.5 rounded-lg p-2" style={{ background: C.surfaceAlt2 }}>
      {sorted.map((e) => (
        <div key={e.id} className="flex items-center justify-between rounded-lg px-2.5 py-2" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div className="flex items-center gap-2">
            {rowIcon(e)}
            <div>
              <div style={{ fontSize: 12 }}>{e.name}</div>
              <div style={{ fontSize: 9, color: C.muted, fontFamily: FONT_MONO }}>{fmtTime(e.ts)}</div>
            </div>
          </div>
          <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 13, color: C.mint }}>+{yen(e.amount)}</span>
        </div>
      ))}
    </div>
  );
}

// ---------- STORE: お客様マスター ----------
function CustomerMaster({ customers, sessions, oripaList, logsById, updateCustomer, deleteCustomer }) {
  const [query, setQuery] = useState("");
  const [selectedId, setSelectedId] = useState(null);

  const filtered = customers.filter((c) => c.name.toLowerCase().includes(query.toLowerCase())).sort((a, b) => b.lastVisitTs - a.lastVisitTs);
  const selected = customers.find((c) => c.id === selectedId);

  if (selected) {
    return (
      <CustomerDetail
        customer={selected}
        sessions={sessions}
        oripaList={oripaList}
        logsById={logsById}
        onBack={() => setSelectedId(null)}
        updateCustomer={updateCustomer}
        deleteCustomer={(id) => {
          deleteCustomer(id);
          setSelectedId(null);
        }}
      />
    );
  }

  return (
    <div className="flex flex-col gap-3">
      <div className="relative">
        <Search size={14} color={C.muted} style={{ position: "absolute", left: 12, top: 12 }} />
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="お客様名で検索" style={{ ...inputStyle, fontFamily: FONT_BODY, paddingLeft: 34 }} />
      </div>
      {filtered.length === 0 ? (
        <div className="rounded-xl px-4 py-8 text-center" style={{ background: C.surface, border: `1px dashed ${C.line}`, color: C.muted, fontSize: 13 }}>
          お客様が見つかりません
        </div>
      ) : (
        filtered.map((c) => {
          const life = computeCustomerLifetime(c, sessions, oripaList, logsById);
          const diffColor = life.diff > 0 ? C.mint : life.diff < 0 ? C.coral : C.paper;
          return (
            <button
              key={c.id}
              onClick={() => setSelectedId(c.id)}
              className="press flex items-center justify-between rounded-xl px-4 py-3"
              style={{ background: C.surface, border: `1px solid ${C.line}` }}
            >
              <div className="text-left">
                <div style={{ fontSize: 14, fontWeight: 700 }}>{c.name}</div>
                <div style={{ fontSize: 11, color: C.muted }}>来店{c.visitCount}回</div>
              </div>
              <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 14, color: diffColor }}>
                {life.diff >= 0 ? "+" : ""}
                {yen(life.diff)}
              </span>
            </button>
          );
        })
      )}
    </div>
  );
}

function CustomerDetail({ customer, sessions, oripaList, logsById, onBack, updateCustomer, deleteCustomer }) {
  const life = computeCustomerLifetime(customer, sessions, oripaList, logsById);
  const diffColor = life.diff > 0 ? C.mint : life.diff < 0 ? C.coral : C.paper;
  const fmtDate = (ts) => {
    const d = new Date(ts);
    return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`;
  };

  const [editing, setEditing] = useState(false);
  const [editName, setEditName] = useState(customer.name);
  const [confirmDelete, setConfirmDelete] = useState(false);

  const saveName = () => {
    const trimmed = editName.trim();
    if (!trimmed || trimmed === customer.name) {
      setEditing(false);
      setEditName(customer.name);
      return;
    }
    updateCustomer && updateCustomer(customer.id, () => ({ name: trimmed }));
    setEditing(false);
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-center gap-2">
        <button onClick={onBack} className="press flex items-center justify-center rounded-full" style={{ width: 32, height: 32, background: C.surfaceAlt2 }}>
          <ArrowLeft size={16} color={C.paper} />
        </button>
        {editing ? (
          <div className="flex items-center gap-2 flex-1">
            <input
              value={editName}
              onChange={(e) => setEditName(e.target.value)}
              autoFocus
              onKeyDown={(e) => e.key === "Enter" && saveName()}
              style={{ ...inputStyle, fontFamily: FONT_BODY, flex: 1 }}
            />
            <button onClick={saveName} className="press rounded-lg px-3 py-2" style={{ background: C.gold, color: C.ink, fontSize: 12, fontWeight: 700 }}>
              保存
            </button>
            <button
              onClick={() => {
                setEditing(false);
                setEditName(customer.name);
              }}
              className="press rounded-lg px-2 py-2"
              style={{ border: `1px solid ${C.line}`, color: C.muted }}
            >
              <X size={14} />
            </button>
          </div>
        ) : (
          <>
            <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 17 }}>{customer.name}</span>
            <button
              onClick={() => setEditing(true)}
              className="press ml-auto rounded-lg px-2.5 py-1"
              style={{ border: `1px solid ${C.line}`, color: C.gold, fontSize: 11, fontWeight: 700 }}
            >
              名前変更
            </button>
          </>
        )}
      </div>

      <div className="rounded-xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div className="grid grid-cols-2 gap-4">
          <StatBlock label="累計支払額" value={yen(life.totalSpent)} color={C.coral} />
          <StatBlock label="累計獲得景品額" value={yen(life.totalPayout)} color={C.mint} />
          <StatBlock label="来店回数" value={`${life.visitCount}回`} />
          <StatBlock label="累計購入口数" value={`${life.totalSlots}口`} />
        </div>
        <div className="flex justify-between items-center mt-3 pt-3" style={{ borderTop: `1px dashed ${C.line}` }}>
          <span style={{ fontSize: 13, color: C.muted }}>累計損益</span>
          <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 18, color: diffColor }}>
            {life.diff >= 0 ? "+" : ""}
            {yen(life.diff)}
          </span>
        </div>
        <div className="flex justify-between items-center mt-2">
          <span style={{ fontSize: 12, color: C.muted }}>累計回収率</span>
          <span style={{ fontFamily: FONT_MONO, fontSize: 13 }}>{life.recoveryRate != null ? `${life.recoveryRate.toFixed(1)}%` : "—"}</span>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <div className="rounded-xl p-3" style={{ background: C.surfaceAlt2 }}>
          <div className="flex items-center gap-1.5" style={{ color: C.mint, fontSize: 11 }}>
            <Trophy size={12} />
            過去最高勝ち額
          </div>
          <div style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 16, color: C.mint }}>{life.bestDiff != null ? `+${yen(life.bestDiff)}` : "—"}</div>
        </div>
        <div className="rounded-xl p-3" style={{ background: C.surfaceAlt2 }}>
          <div className="flex items-center gap-1.5" style={{ color: C.coral, fontSize: 11 }}>
            <TrendingDown size={12} />
            過去最大負け額
          </div>
          <div style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 16, color: C.coral }}>{life.worstDiff != null ? yen(life.worstDiff) : "—"}</div>

        <div style={{ fontSize: 12, color: C.muted, marginBottom: 8 }}>来店履歴</div>

            const dColor = totals.diff > 0 ? C.mint : totals.diff < 0 ? C.coral : C.paper;

              </div>

        {confirmDelete ? (

function MonthlySummary({ settlements }) {
  const byMonth = {};
  settlements.forEach((s) => {
    const mk = monthKeyOf(s.dateKey);
    if (!byMonth[mk]) byMonth[mk] = { totalSales: 0, totalSlots: 0, totalPayout: 0, grossProfit: 0, visitorCount: 0, oripaTotals: {} };
    const m = byMonth[mk];
    m.totalSales += s.totalSales;
    m.totalSlots += s.totalSlots;
    m.totalPayout += s.totalPayout;
    m.grossProfit += s.grossProfit;
    m.visitorCount += s.visitorCount;
    (s.byOripa || []).forEach((o) => {
      if (!m.oripaTotals[o.name]) m.oripaTotals[o.name] = 0;
      m.oripaTotals[o.name] += o.sales;
    });
  });
  const months = Object.keys(byMonth).sort().reverse();

  if (months.length === 0) {
    return (
      <div className="rounded-xl px-4 py-8 text-center" style={{ background: C.surface, border: `1px dashed ${C.line}`, color: C.muted, fontSize: 13 }}>
        精算データがまだありません
      </div>
    );
  }

  return (
    <div className="flex flex-col gap-4">
      {months.map((mk) => {
        const m = byMonth[mk];
        const actualRate = m.totalSales > 0 ? (m.totalPayout / m.totalSales) * 100 : null;
        const avgPerVisitor = m.visitorCount > 0 ? m.totalSales / m.visitorCount : null;
        const avgSlotsPerVisitor = m.visitorCount > 0 ? m.totalSlots / m.visitorCount : null;
        const ranking = Object.entries(m.oripaTotals).sort((a, b) => b[1] - a[1]);
        return (
          <div key={mk} className="rounded-xl p-4 flex flex-col gap-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 15 }}>{mk}</div>
            <div className="grid grid-cols-2 gap-4">
              <StatBlock label="月間総売上" value={yen(m.totalSales)} color={C.mint} />

              <StatBlock label="月間粗利益" value={yen(m.grossProfit)} color={m.grossProfit >= 0 ? C.mint : C.coral} />
            </div>
            <div className="flex justify-between items-center pt-2" style={{ borderTop: `1px dashed ${C.line}` }}>
              <span style={{ fontSize: 12, color: C.muted }}>月間実還元率</span>

            <div className="flex justify-between items-center">

                <div style={{ fontSize: 11, color: C.muted }}>オリパ別売上ランキング</div>

function StoreAggregate({ oripaList, logsById }) {
  const rows = oripaList.map((o) => {

    const guaranteeAmount = o.minGuarantee.enabled ? Number(o.minGuarantee.amount) || 0 : 0;
    const totals = computeTotals(log, guaranteeAmount);
    const box = computeBoxState(log, o);
    return { oripa: o, log, totals, box };
  });

function ExpectedValuePanel({ oripa, box }) {
  const price = Number(oripa.price) || 0;
  const R = box.remainingSlots;
  const hazureAmount = oripa.minGuarantee.enabled ? Number(oripa.minGuarantee.amount) || 0 : 0;
  const poolValue = box.remainingPrizeAmount + box.remainingHazureCount * hazureAmount;
  const perSlotValue = R > 0 ? poolValue / R : 0;
  const lastOnePerSlot = R > 0 ? box.lastOneRemainingValue / R : 0;

  const rankCounts = useMemo(() => {
    const c = { rainbow: 0, gold: 0, silver: 0, bronze: 0 };
    box.remainingTiers.forEach((t) => {
      if (t.rank && c[t.rank] !== undefined) c[t.rank] += 1;
    });
    return c;
  }, [box.remainingTiers]);
  const anyNormalCount = box.remainingTiers.length;
  const goldPlus = rankCounts.rainbow + rankCounts.gold;
  const silverPlus = goldPlus + rankCounts.silver;
  const hasRankData = rankCounts.rainbow + rankCounts.gold + rankCounts.silver + rankCounts.bronze > 0;

  const quantities = [5, 10, 20, 50, 100].map((n) => Math.min(n, R)).filter((n, i, arr) => n > 0 && arr.indexOf(n) === i);
  if (R > 0 && !quantities.includes(R)) quantities.push(R);

  const rows = useMemo(
    () =>
      quantities.map((n) => {
        const expectedRecovery = n * perSlotValue + n * lastOnePerSlot;
        const cost = n * price;
        const expectedProfit = expectedRecovery - cost;
        const returnRate = cost > 0 ? (expectedRecovery / cost) * 100 : null;
        const profitProb = simulateProfitProbability(box.remainingTiers, box.remainingHazureCount, hazureAmount, box.lastOneRemainingValue, n, price, 1500);
        return {
          n,
          expectedRecovery,
          expectedProfit,
          returnRate,
          profitProb,
          pNormal: probAtLeastOne(R, anyNormalCount, n),
          pRainbow: probAtLeastOne(R, rankCounts.rainbow, n),
          pGoldPlus: probAtLeastOne(R, goldPlus, n),
          pSilverPlus: probAtLeastOne(R, silverPlus, n),
        };
      }),
    // eslint-disable-next-line react-hooks/exhaustive-deps
    [oripa.id, R, price, perSlotValue, lastOnePerSlot]
  );

  if (R === 0) {
    return <div style={{ fontSize: 12, color: C.muted, textAlign: "center", padding: "8px 0" }}>このオリパは終了しています</div>;
  }

  const fullBuyReturn = price > 0 ? ((poolValue + box.lastOneRemainingValue) / (R * price)) * 100 : null;

  return (
    <div className="flex flex-col gap-3">

function BulkImportPanel({ oripa, set, onDone }) {
  const [text, setText] = useState("");
  const [parsed, setParsed] = useState(null); // {items, detectedPrice, detectedSlots, detectedGuarantee}
  const rankNames = { rainbow: "虹枠", gold: "金枠", silver: "銀枠", bronze: "銅枠", other: "その他" };

  const runParse = () => {
    if (!text.trim()) return;
    setParsed(parseBulkOripaText(text));
  };

  const removeParsedItem = (id) => {
    setParsed((p) => ({ ...p, items: p.items.filter((i) => i.id !== id) }));
  };
  const updateParsedCount = (id, count) => {
    const n = Math.max(1, Number(count) || 1);
    setParsed((p) => ({ ...p, items: p.items.map((i) => (i.id === id ? { ...i, count: n } : i)) }));
  };
  const updateParsedAmount = (id, amount) => {
    setParsed((p) => ({ ...p, items: p.items.map((i) => (i.id === id ? { ...i, amount: Number(amount) || 0 } : i)) }));
  };
  const updateParsedAmountForeign = (id, amount) => {
    setParsed((p) => ({
      ...p,
      items: p.items.map((i) => (i.id === id ? { ...i, amountForeign: amount === "" ? null : Number(amount) || 0 } : i)),
    }));
  };

  const totalFromItems = (parsed ? parsed.items : []).reduce((a, i) => (i.isLastOne ? a : a + i.amount * i.count), 0);
  const lastOneItem = parsed ? parsed.items.find((i) => i.isLastOne) : null;

  const commit = () => {
    if (!parsed || parsed.items.length === 0) return;
    const newTiers = [];
    parsed.items.forEach((i) => {
      if (i.isLastOne) return;
      for (let n = 0; n < i.count; n++) newTiers.push({ id: uid(), name: i.name, amount: i.amount, amountForeign: i.amountForeign, rank: i.rank });
    });
    set((o) => {
      const next = { ...o, tiers: [...o.tiers, ...newTiers] };
      if (lastOneItem) {
        next.lastOne = {
          ...o.lastOne,
          enabled: true,
          name: o.lastOne.enabled ? o.lastOne.name : `${lastOneItem.name}(ラストワン)`,
          amount: lastOneItem.amount,
          amountForeign: lastOneItem.amountForeign,
        };
      }
      if (parsed.detectedPrice && !Number(o.price)) next.price = parsed.detectedPrice;
      if (parsed.detectedSlots && !Number(o.totalSlots)) next.totalSlots = parsed.detectedSlots;
      if (parsed.detectedGuarantee && !o.minGuarantee.enabled) {
        next.minGuarantee = { ...o.minGuarantee, enabled: true, amount: parsed.detectedGuarantee };
      }
      return next;
    });
    setText("");
    setParsed(null);
    onDone();
  };

  return (
    <div className="rounded-xl p-3 flex flex-col gap-3" style={{ background: C.surfaceAlt2, border: `1px solid ${C.gold}` }}>
      <div style={{ fontSize: 11, color: C.muted }}>
        景品リストのテキストをそのまま貼り付けてください(「・カード名:5.4万」「虹枠」のような見出し、タブ区切りの表などにある程度対応します)。「29（28」のように括弧で外国人価格を書くと自動で読み取ります。解析結果は必ず内容を確認してから登録されます。
      </div>
      <textarea
        value={text}
        onChange={(e) => setText(e.target.value)}
        rows={6}
        style={{ ...inputStyle, fontFamily: FONT_BODY, resize: "vertical" }}
        placeholder={"例:\n○虹枠\n・151:5.4万\n・アタッシュ:3万\n○金枠\n・ストームエメラルダ:1.7万×12"}
      />
      <button onClick={runParse} className="press rounded-lg py-2" style={{ background: C.gold, color: C.ink, fontWeight: 700, fontSize: 13 }}>
        解析する
      </button>

      {parsed && (
        <div className="flex flex-col gap-2">
          {(parsed.detectedPrice || parsed.detectedSlots || parsed.detectedGuarantee) && (
            <div style={{ fontSize: 11, color: C.gold }}>
              検出:
              {parsed.detectedPrice ? ` 単価${yen(parsed.detectedPrice)}` : ""}
              {parsed.detectedSlots ? ` ・総口数${parsed.detectedSlots}口` : ""}
              {parsed.detectedGuarantee ? ` ・保証${yen(parsed.detectedGuarantee)}` : ""}
              (未設定の項目のみ登録時に反映されます)
            </div>
          )}
          {parsed.items.length === 0 ? (
            <div style={{ fontSize: 12, color: C.coral, textAlign: "center", padding: "8px 0" }}>解析できる項目が見つかりませんでした</div>
          ) : (
            <>
              <div style={{ fontSize: 11, color: C.muted }}>
                {parsed.items.filter((i) => !i.isLastOne).length}件を検出(景品総額 {yen(totalFromItems)}
                {lastOneItem ? ` ・ラストワン ${lastOneItem.name} ${yen(lastOneItem.amount)}` : ""})。内容を確認し、不要な行は削除してください。
              </div>
              <div className="flex flex-col gap-1.5" style={{ maxHeight: 260, overflowY: "auto" }}>
                {parsed.items.map((i) => (
                  <div key={i.id} className="flex items-center justify-between gap-2 rounded-lg px-2.5 py-1.5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
                    <div className="flex items-center gap-1.5 min-w-0" style={{ flex: 1 }}>
                      {i.isLastOne ? (
                        <Crown size={12} color={C.gold} />
                      ) : i.rank ? (
                        <span style={{ fontSize: 9, color: C.muted, border: `1px solid ${C.line}`, borderRadius: 999, padding: "0 5px", flexShrink: 0 }}>
                          {rankNames[i.rank]}
                        </span>
                      ) : null}
                      <span style={{ fontSize: 12, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{i.name}</span>
                    </div>
                    <div className="flex items-center gap-1.5 flex-shrink-0">
                      <input
                        type="number"
                        inputMode="numeric"
                        min="1"
                        value={i.amount}
                        onChange={(e) => updateParsedAmount(i.id, e.target.value)}
                        style={{ ...inputStyle, width: 66, padding: "5px 6px", fontSize: 11 }}
                        title="日本人価格"
                      />
                      <input
                        type="number"
                        inputMode="numeric"
                        min="0"
                        value={i.amountForeign == null ? "" : i.amountForeign}
                        onChange={(e) => updateParsedAmountForeign(i.id, e.target.value)}
                        placeholder="外"
                        style={{ ...inputStyle, width: 58, padding: "5px 6px", fontSize: 11, borderColor: i.amountForeign != null ? C.gold : C.line }}
                        title="外国人価格(空欄なら日本人と同じ)"
                      />
                      {!i.isLastOne && (
                        <>
                          <span style={{ fontSize: 10, color: C.muted }}>×</span>
                          <input
                            type="number"
                            inputMode="numeric"
                            min="1"
                            value={i.count}
                            onChange={(e) => updateParsedCount(i.id, e.target.value)}
                            style={{ ...inputStyle, width: 42, padding: "5px 6px", fontSize: 11, textAlign: "center" }}
                            title="個数"
                          />
                        </>
                      )}
                      <button onClick={() => removeParsedItem(i.id)}>
                        <X size={13} color={C.muted} />
                      </button>
                    </div>
                  </div>
                ))}
              </div>
              <button onClick={commit} className="press rounded-lg py-2.5" style={{ background: C.mint, color: C.ink, fontWeight: 700, fontSize: 13 }}>
                この内容をオリパに追加する
              </button>
            </>
          )}
        </div>
      )}
    </div>
  );
}

            <button
              onClick={() => setBulkOpen((v) => !v)}
              className="press flex items-center justify-center gap-1.5 rounded-lg py-2"
              style={{ border: `1px dashed ${C.gold}`, color: C.gold, fontSize: 12, fontWeight: 700 }}

              <ClipboardPaste size={13} />
              {bulkOpen ? "一括登録を閉じる" : "テキストで一括登録(ベータ)"}
            </button>
            {bulkOpen && <BulkImportPanel oripa={oripa} set={set} onDone={() => setBulkOpen(false)} />}

            {oripa.tiers.length > 0 && (() => {
              const winByTierId = {};
              (fullLog || []).forEach((e) => {
                if (e.type === "win" && e.tierId) winByTierId[e.tierId] = e;
              });
              const consumedCount = oripa.tiers.filter((t) => winByTierId[t.id]).length;
              const fmtTime = (ts) => {
                const d = new Date(ts);
                const m = String(d.getMonth() + 1);
                const day = String(d.getDate());
                return `${m}/${day} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;

                <>

                  <div className="flex flex-col gap-2">

                      const win = winByTierId[t.id];

                      return (
                        <div
                          key={t.id}
                          className="flex items-center justify-between rounded-lg px-3 py-2"
                          style={{
                            background: isConsumed ? C.surfaceAlt2 : C.surfaceAlt,

                                  border: `1px solid ${rankColor[t.rank]}`,

                                  padding: "1px 6px",
                                  flexShrink: 0,
                                  opacity: isConsumed ? 0.7 : 1,

                              >
                                {RANK_LABEL[t.rank]}
                              </span>
                            )}
                            <div className="flex flex-col min-w-0">
                              <span
                                style={{
                                  fontSize: 13,
                                  textDecoration: isConsumed ? "line-through" : "none",
                                  color: isConsumed ? C.muted : C.paper,
                                  overflow: "hidden",
                                  textOverflow: "ellipsis",
                                  whiteSpace: "nowrap",

                              >
                                {t.name}

                              {isConsumed && (
                                <span style={{ fontSize: 9, color: C.coral, fontFamily: FONT_MONO }}>

                              )}
                            </div>
                          </div>
                          <div className="flex items-center gap-3">
                            <div className="flex flex-col items-end">
                              <span
                                style={{
                                  fontFamily: FONT_MONO,
                                  fontWeight: 700,
                                  color: isConsumed ? C.muted : C.gold,
                                  fontSize: 14,
                                  textDecoration: isConsumed ? "line-through" : "none",
                                }}

                                {yen(t.amount)}
                              </span>
                              {t.amountForeign != null && t.amountForeign !== "" && (
                                <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: C.muted, textDecoration: isConsumed ? "line-through" : "none" }}>
                                  外 {yen(t.amountForeign)}

                            <button onClick={() => removeTier(t.id)}>
                              <Trash2 size={15} color={C.muted} />
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </>
              );
            })()}
          </div>

          <div className="flex flex-col gap-3 rounded-lg p-3" style={{ background: C.surfaceAlt2 }}>
            <div className="flex items-center justify-between">
              <span style={{ fontSize: 13, display: "flex", alignItems: "center", gap: 6 }}>
                <Crown size={14} color={C.gold} /> ラストワン賞
              </span>
              <Toggle checked={oripa.lastOne.enabled} onChange={(v) => set((o) => ({ ...o, lastOne: { ...o.lastOne, enabled: v } }))} />
            </div>
            {oripa.lastOne.enabled && (
              <>
                <div className="flex gap-2">
                  <input
                    value={oripa.lastOne.name}
                    onChange={(e) => set((o) => ({ ...o, lastOne: { ...o.lastOne, name: e.target.value } }))}
                    placeholder="名前"
                    style={{ ...inputStyle, fontFamily: FONT_BODY, flex: 2 }}
                  />
                  <input
                    type="number"
                    inputMode="numeric"

                  placeholder="外国人価格(任意)"

          <div className="flex flex-col gap-3 rounded-lg p-3" style={{ background: C.surfaceAlt2 }}>
            <div className="flex items-center justify-between">
              <span style={{ fontSize: 13, display: "flex", alignItems: "center", gap: 6 }}>
                <ShieldCheck size={14} color={C.muted} /> 最低保証金額(はずれ)
              </span>
              <Toggle checked={oripa.minGuarantee.enabled} onChange={(v) => set((o) => ({ ...o, minGuarantee: { ...o.minGuarantee, enabled: v } }))} />

                <div className="flex items-center justify-between">

function StaffShift({ staff, addStaff, shiftRequests, submitShiftRequest, confirmedShifts, timePunches, punch, storeGeo }) {
  const [subTab, setSubTab] = useState("clock"); // clock | submit | view

  return (
    <div className="flex flex-col gap-4">
      <div>
        <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 17 }}>シフト・タイムカード</span>
        <div style={{ fontSize: 11, color: C.muted, marginTop: 2 }}>スタッフ用の希望シフト提出と、出退勤の打刻</div>
      </div>
      <div className="flex gap-2">
        {[
          ["clock", "打刻"],
          ["submit", "希望提出"],
          ["view", "確定シフト"],
        ].map(([k, l]) => (
          <button
            key={k}
            onClick={() => setSubTab(k)}
            className="press flex-1 rounded-lg py-2"
            style={{ background: subTab === k ? C.gold : C.surfaceAlt, color: subTab === k ? C.ink : C.muted, fontSize: 13, fontWeight: 700 }}
          >
            {l}
          </button>
        ))}
      </div>

      {subTab === "clock" && (
        <PunchClock staff={staff} addStaff={addStaff} timePunches={timePunches} punch={punch} storeGeo={storeGeo} />
      )}
      {subTab === "submit" && (
        <ShiftSubmit staff={staff} shiftRequests={shiftRequests} submitShiftRequest={submitShiftRequest} />
      )}
      {subTab === "view" && <ConfirmedShiftView confirmedShifts={confirmedShifts} />}
    </div>
  );
}

function PunchClock({ staff, addStaff, timePunches, punch, storeGeo }) {
  const [selectedName, setSelectedName] = useState("");
  const [newName, setNewName] = useState("");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  const doPunch = async (type) => {
    if (!selectedName) { setMsg({ ok: false, text: "名前を選択してください" }); return; }
    const member = staff.find((s) => s.name === selectedName);
    if (!member) { setMsg({ ok: false, text: "スタッフが見つかりません" }); return; }
    setBusy(true);
    setMsg(null);
    const res = await punch(member, type);
    setBusy(false);
    if (res.ok) {
      const now = new Date();
      setMsg({ ok: true, text: `${type === "in" ? "出勤" : "退勤"} 打刻しました ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}` });
    } else {
      setMsg({ ok: false, text: res.reason || "打刻できませんでした" });
    }
  };

  const myPunches = timePunches
    .filter((p) => p.staffName === selectedName)
    .sort((a, b) => b.ts - a.ts)
    .slice(0, 8);

  const fmt = (ts) => {
    const d = new Date(ts);
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-xl p-4 flex flex-col gap-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div>
          <label style={labelStyle}>あなたの名前</label>
          {staff.length === 0 ? (
            <div style={{ fontSize: 12, color: C.muted, padding: "8px 0" }}>初回のため名前を登録してください。</div>
          ) : (
            <div className="grid grid-cols-2 gap-2">
              {staff.map((s) => (
                <button
                  key={s.id}
                  onClick={() => setSelectedName(s.name)}
                  className="press rounded-lg py-2"
                  style={{
                    background: selectedName === s.name ? C.gold : C.surfaceAlt,
                    color: selectedName === s.name ? C.ink : C.paper,
                    fontSize: 13,
                    fontWeight: 700,
                    border: `1px solid ${selectedName === s.name ? C.gold : C.line}`,
                  }}
                >
                  {s.name}
                </button>
              ))}
            </div>
          )}
        </div>
        <div>
          <label style={labelStyle}>名前が無ければ追加</label>
          <div className="flex gap-2">
            <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="スタッフ名" style={{ ...inputStyle, fontFamily: FONT_BODY }} />
            <button
              onClick={() => {
                if (!newName.trim()) return;
                addStaff(newName.trim());
                setSelectedName(newName.trim());
                setNewName("");
              }}
              className="press rounded-lg px-4"
              style={{ background: C.gold, color: C.ink, fontWeight: 700, fontSize: 13 }}
            >
              追加
            </button>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <button
          onClick={() => doPunch("in")}
          disabled={busy}
          className="press rounded-2xl py-6"
          style={{ background: C.mint, color: C.ink, fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 22, opacity: busy ? 0.6 : 1 }}
        >
          出勤
        </button>
        <button
          onClick={() => doPunch("out")}
          disabled={busy}
          className="press rounded-2xl py-6"
          style={{ background: C.coral, color: C.ink, fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 22, opacity: busy ? 0.6 : 1 }}
        >
          退勤
        </button>
      </div>

      {busy && <div style={{ fontSize: 12, color: C.muted, textAlign: "center" }}>位置情報を確認しています…</div>}

      {msg && (
        <div
          className="rounded-xl px-3 py-2.5 text-center"
          style={{
            background: msg.ok ? "rgba(111,207,143,0.14)" : "rgba(226,105,79,0.14)",
            border: `1px solid ${msg.ok ? C.mint : C.coral}`,
            color: msg.ok ? C.mint : C.coral,
            fontSize: 13,
            fontWeight: 700,
          }}
        >
          {msg.text}
        </div>
      )}

      {storeGeo.enabled && (
        <div style={{ fontSize: 11, color: C.muted, textAlign: "center" }}>
          店舗から{storeGeo.radiusM || 100}m以内でのみ打刻できます
        </div>
      )}

      {selectedName && myPunches.length > 0 && (
        <div className="flex flex-col gap-2">
          <div style={{ fontSize: 12, color: C.muted }}>{selectedName} さんの直近の打刻</div>
          {myPunches.map((p) => (
            <div key={p.id} className="rounded-lg px-3 py-2 flex items-center justify-between" style={{ background: C.surfaceAlt, border: `1px solid ${C.line}` }}>
              <span style={{ fontSize: 12 }}>
                <span style={{ color: p.type === "in" ? C.mint : C.coral, fontWeight: 700, marginRight: 6 }}>{p.type === "in" ? "出勤" : "退勤"}</span>
                {fmt(p.ts)}
                {p.byManager && <span style={{ fontSize: 10, color: C.gold, marginLeft: 6 }}>(店長修正)</span>}
              </span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ShiftSubmit({ staff, shiftRequests, submitShiftRequest }) {
  const [name, setName] = useState("");
  const [periodStart, setPeriodStart] = useState(biweeklyPeriodStart(todayKey()));
  const days = biweeklyDates(periodStart);
  const [entries, setEntries] = useState(() => days.map((d) => ({ date: d, start: "", end: "", note: "" })));
  const [submitted, setSubmitted] = useState(false);

  useEffect(() => {
    setEntries(biweeklyDates(periodStart).map((d) => ({ date: d, start: "", end: "", note: "" })));
    setSubmitted(false);
  }, [periodStart]);

  const updEntry = (i, k, v) => setEntries((prev) => prev.map((e, ei) => (ei === i ? { ...e, [k]: v } : e)));

  const canSubmit = name.trim() && entries.some((e) => e.start || e.end || e.note);

  const submit = () => {
    if (!canSubmit) return;
    submitShiftRequest(name, periodStart, entries);
    setSubmitted(true);
    // clear form-ish
    setEntries(days.map((d) => ({ date: d, start: "", end: "", note: "" })));
  };

  const myPastRequests = shiftRequests
    .filter((r) => r.staffName === name.trim())
    .sort((a, b) => b.submittedAt - a.submittedAt)
    .slice(0, 3);

  const shiftPeriod = (offset) => {
    const cur = new Date(periodStart);
    cur.setDate(cur.getDate() + offset * 14);
    setPeriodStart(dateKeyOf(cur.getTime()));
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-xl p-4 flex flex-col gap-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div>
          <label style={labelStyle}>あなたの名前</label>
          {staff.length > 0 && (
            <div className="grid grid-cols-2 gap-2 mb-2">
              {staff.map((s) => (
                <button
                  key={s.id}
                  onClick={() => setName(s.name)}
                  className="press rounded-lg py-2"
                  style={{
                    background: name === s.name ? C.gold : C.surfaceAlt,
                    color: name === s.name ? C.ink : C.paper,
                    fontSize: 12,
                    fontWeight: 700,
                    border: `1px solid ${name === s.name ? C.gold : C.line}`,
                  }}
                >
                  {s.name}
                </button>
              ))}
            </div>
          )}
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="または直接入力" style={{ ...inputStyle, fontFamily: FONT_BODY }} />
        </div>
        <div>
          <label style={labelStyle}>期間(2週間)</label>
          <div className="flex items-center gap-2">
            <button onClick={() => shiftPeriod(-1)} className="press rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, color: C.paper, border: `1px solid ${C.line}` }}>◀</button>
            <span style={{ flex: 1, textAlign: "center", fontFamily: FONT_MONO, fontSize: 13 }}>
              {fmtDateKey(periodStart)} 〜 {fmtDateKey(addDays(periodStart, 13))}
            </span>
            <button onClick={() => shiftPeriod(1)} className="press rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, color: C.paper, border: `1px solid ${C.line}` }}>▶</button>
          </div>
        </div>
      </div>

      <div className="flex flex-col gap-2">
        {entries.map((e, i) => (
          <div key={e.date} className="rounded-lg p-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <div style={{ fontSize: 12, color: C.muted, fontWeight: 700, marginBottom: 6 }}>{fmtDateKey(e.date)}</div>
            <div className="flex items-center gap-2">
              <input
                type="time"
                value={e.start}
                onChange={(ev) => updEntry(i, "start", ev.target.value)}
                style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1, padding: "8px 10px" }}
              />
              <span style={{ fontSize: 12, color: C.muted }}>〜</span>
              <input
                type="time"
                value={e.end}
                onChange={(ev) => updEntry(i, "end", ev.target.value)}
                style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1, padding: "8px 10px" }}
              />
            </div>
            <input
              value={e.note}
              onChange={(ev) => updEntry(i, "note", ev.target.value)}
              placeholder="メモ(休み希望など)"
              style={{ ...inputStyle, fontFamily: FONT_BODY, marginTop: 6, padding: "6px 10px", fontSize: 12 }}
            />
          </div>
        ))}
      </div>

      <button
        onClick={submit}
        disabled={!canSubmit}
        className="press rounded-xl py-3"
        style={{ background: canSubmit ? C.gold : C.surfaceAlt2, color: canSubmit ? C.ink : C.muted, fontWeight: 700, fontSize: 14 }}
      >
        希望シフトを提出
      </button>

      {submitted && (
        <div className="rounded-xl px-3 py-2.5 text-center" style={{ background: "rgba(111,207,143,0.14)", border: `1px solid ${C.mint}`, color: C.mint, fontSize: 13, fontWeight: 700 }}>
          提出しました。店長側で確認されます。
        </div>
      )}

      {myPastRequests.length > 0 && (
        <div className="flex flex-col gap-2">
          <div style={{ fontSize: 12, color: C.muted }}>{name} さんの過去の提出</div>
          {myPastRequests.map((r) => (
            <div key={r.id} className="rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, border: `1px solid ${C.line}` }}>
              <div style={{ fontSize: 12 }}>{fmtDateKey(r.periodStart)} 〜 {fmtDateKey(addDays(r.periodStart, 13))}</div>
              <div style={{ fontSize: 10, color: C.muted, fontFamily: FONT_MONO }}>{new Date(r.submittedAt).toLocaleString("ja-JP")}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ConfirmedShiftView({ confirmedShifts }) {
  const sorted = [...confirmedShifts].sort((a, b) => b.publishedAt - a.publishedAt);
  if (sorted.length === 0) {
    return <div className="rounded-xl px-4 py-6 text-center" style={{ background: C.surface, border: `1px dashed ${C.line}`, color: C.muted, fontSize: 13 }}>まだ確定シフトはありません</div>;
  }
  return (
    <div className="flex flex-col gap-3">
      {sorted.map((cs) => (
        <ConfirmedShiftCard key={cs.id} confirmed={cs} />
      ))}
    </div>
  );
}
function ConfirmedShiftCard({ confirmed }) {

    <div className="rounded-xl p-4 flex flex-col gap-2" style={{ background: C.surface, border: `1px solid ${C.line}` }}>

function ShiftRequestList({ shiftRequests, deleteShiftRequest, publishConfirmedShift, staff, confirmedShifts }) {
  const [periodStart, setPeriodStart] = useState(biweeklyPeriodStart(todayKey()));
  const dates = biweeklyDates(periodStart);
  const reqsForPeriod = shiftRequests.filter((r) => r.periodStart === periodStart);
  const existingConfirmed = confirmedShifts.find((c) => c.periodStart === periodStart);

  // Build editable draft merged from requests (or existing confirmed) - one row per (staff, date) with start/end.
  const [draft, setDraft] = useState(() => buildInitialDraft());

  useEffect(() => setDraft(buildInitialDraft()), [periodStart, shiftRequests.length, existingConfirmed && existingConfirmed.id]);

  function buildInitialDraft() {
    if (existingConfirmed) {
      const m = {};
      existingConfirmed.entries.forEach((e) => {
        const k = e.staffName + "|" + e.date;
        m[k] = { staffId: e.staffId, staffName: e.staffName, date: e.date, start: e.start, end: e.end, note: e.note };
      });
      return m;
    }
    const m = {};
    reqsForPeriod.forEach((r) => {
      r.entries.forEach((e) => {
        if (!e.start && !e.end) return;
        const k = r.staffName + "|" + e.date;
        m[k] = { staffId: r.staffId, staffName: r.staffName, date: e.date, start: e.start, end: e.end, note: e.note };
      });
    });
    return m;
  }

  const shiftPeriod = (offset) => {
    const cur = new Date(periodStart);
    cur.setDate(cur.getDate() + offset * 14);
    setPeriodStart(dateKeyOf(cur.getTime()));
  };

  const publish = () => {
    const entries = Object.values(draft).filter((e) => e.start || e.end);
    publishConfirmedShift(periodStart, entries);
    alert("確定シフトを発行しました");
  };

  return (
    <div className="flex flex-col gap-3">
      <div className="flex items-center gap-2">
        <button onClick={() => shiftPeriod(-1)} className="press rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, color: C.paper }}>◀</button>
        <span style={{ flex: 1, textAlign: "center", fontFamily: FONT_MONO, fontSize: 13 }}>
          {fmtDateKey(periodStart)} 〜 {fmtDateKey(addDays(periodStart, 13))}
        </span>
        <button onClick={() => shiftPeriod(1)} className="press rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, color: C.paper }}>▶</button>
      </div>

      <div style={{ fontSize: 11, color: C.muted }}>
        提出人数: {reqsForPeriod.length}人{existingConfirmed ? " ・ 確定シフト発行済(編集可)" : ""}
      </div>

      {reqsForPeriod.length === 0 && !existingConfirmed && (
        <div className="rounded-xl px-4 py-6 text-center" style={{ background: C.surface, border: `1px dashed ${C.line}`, color: C.muted, fontSize: 13 }}>
          この期間の希望提出はまだありません
        </div>
      )}

      {(reqsForPeriod.length > 0 || existingConfirmed) && (
        <>
          <div className="flex flex-col gap-2">
            {dates.map((d) => {
              const rowsForDate = Object.values(draft).filter((e) => e.date === d);
              return (
                <div key={d} className="rounded-lg p-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
                  <div style={{ fontSize: 12, fontWeight: 700, marginBottom: 6 }}>{fmtDateKey(d)}</div>
                  {rowsForDate.length === 0 ? (
                    <div style={{ fontSize: 11, color: C.muted }}>—</div>
                  ) : (
                    <div className="flex flex-col gap-1.5">
                      {rowsForDate.map((row) => {
                        const key = row.staffName + "|" + row.date;
                        return (
                          <div key={key} className="flex items-center gap-2">
                            <span style={{ fontSize: 12, minWidth: 60 }}>{row.staffName}</span>
                            <input
                              type="time"
                              value={row.start}
                              onChange={(e) => setDraft((prev) => ({ ...prev, [key]: { ...prev[key], start: e.target.value } }))}
                              style={{ ...inputStyle, fontFamily: FONT_MONO, padding: "5px 8px", fontSize: 12, flex: 1 }}
                            />
                            <span style={{ fontSize: 11, color: C.muted }}>〜</span>
                            <input
                              type="time"
                              value={row.end}
                              onChange={(e) => setDraft((prev) => ({ ...prev, [key]: { ...prev[key], end: e.target.value } }))}
                              style={{ ...inputStyle, fontFamily: FONT_MONO, padding: "5px 8px", fontSize: 12, flex: 1 }}
                            />
                            <button
                              onClick={() => setDraft((prev) => { const next = { ...prev }; delete next[key]; return next; })}
                              style={{ color: C.muted }}
                            >
                              <X size={14} />
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          <button onClick={publish} className="press rounded-xl py-3" style={{ background: C.gold, color: C.ink, fontWeight: 700, fontSize: 14 }}>
            確定シフトを発行
          </button>
        </>
      )}

      {reqsForPeriod.length > 0 && (
        <div className="flex flex-col gap-2 mt-2">
          <div style={{ fontSize: 12, color: C.muted }}>提出者一覧</div>
          {reqsForPeriod.map((r) => (
            <div key={r.id} className="flex items-center justify-between rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, border: `1px solid ${C.line}` }}>
              <div>
                <div style={{ fontSize: 12 }}>{r.staffName}</div>
                <div style={{ fontSize: 10, color: C.muted }}>{new Date(r.submittedAt).toLocaleString("ja-JP")}</div>
              </div>
              <button onClick={() => deleteShiftRequest(r.id)} style={{ color: C.muted }}><Trash2 size={14} /></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ConfirmedShiftList({ confirmedShifts }) {

    <div className="flex flex-col gap-3">
      {sorted.map((cs) => <ConfirmedShiftCard key={cs.id} confirmed={cs} />)}
    </div>

function PunchLog({ timePunches, staff, managerPunch, deletePunch }) {
  const [staffFilter, setStaffFilter] = useState("");
  const [rangeDays, setRangeDays] = useState(14);
  const now = Date.now();
  const cutoff = now - rangeDays * 86400000;
  const filtered = timePunches
    .filter((p) => p.ts >= cutoff)
    .filter((p) => !staffFilter || p.staffName === staffFilter)
    .sort((a, b) => b.ts - a.ts);

  // pair in/out per staff per day for a work-hours summary
  const summaryByStaff = {};
  filtered.forEach((p) => {
    if (!summaryByStaff[p.staffName]) summaryByStaff[p.staffName] = [];
    summaryByStaff[p.staffName].push(p);
  });
  const workHoursByStaff = {};
  Object.entries(summaryByStaff).forEach(([name, punches]) => {
    let totalMs = 0;
    let lastIn = null;
    [...punches].reverse().forEach((p) => {
      if (p.type === "in") lastIn = p.ts;
      else if (p.type === "out" && lastIn) {
        totalMs += p.ts - lastIn;
        lastIn = null;
      }
    });
    workHoursByStaff[name] = totalMs / 3600000;
  });

  // add-punch form
  const [addOpen, setAddOpen] = useState(false);
  const [addStaffId, setAddStaffId] = useState("");
  const [addType, setAddType] = useState("in");
  const [addDate, setAddDate] = useState(todayKey());
  const [addTime, setAddTime] = useState("09:00");

  const doAdd = () => {
    const member = staff.find((s) => s.id === addStaffId);
    if (!member) return;
    const [h, mi] = addTime.split(":").map(Number);
    const [y, m, d] = addDate.split("-").map(Number);
    const ts = new Date(y, m - 1, d, h, mi).getTime();
    managerPunch(member, addType, ts);
    setAddOpen(false);
  };

  const fmt = (ts) => {
    const d = new Date(ts);
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };

  return (
    <div className="flex flex-col gap-3">
      <div className="flex gap-2">
        <select value={staffFilter} onChange={(e) => setStaffFilter(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_BODY, flex: 2 }}>
          <option value="">全スタッフ</option>
          {staff.map((s) => <option key={s.id} value={s.name}>{s.name}</option>)}
        </select>
        <select value={rangeDays} onChange={(e) => setRangeDays(Number(e.target.value))} style={{ ...inputStyle, fontFamily: FONT_BODY, flex: 1 }}>
          <option value={7}>7日</option>
          <option value={14}>14日</option>
          <option value={30}>30日</option>
          <option value={90}>90日</option>
        </select>
      </div>

      {Object.keys(workHoursByStaff).length > 0 && (
        <div className="flex flex-col gap-1.5">
          <div style={{ fontSize: 12, color: C.muted }}>期間内の勤務時間</div>
          {Object.entries(workHoursByStaff).sort((a, b) => b[1] - a[1]).map(([name, h]) => (
            <div key={name} className="flex items-center justify-between rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, border: `1px solid ${C.line}` }}>
              <span style={{ fontSize: 13 }}>{name}</span>
              <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: C.gold, fontSize: 14 }}>{h.toFixed(1)} 時間</span>
            </div>
          ))}
        </div>
      )}

      {!addOpen ? (
        <button onClick={() => setAddOpen(true)} className="press rounded-lg py-2" style={{ border: `1px dashed ${C.gold}`, color: C.gold, fontSize: 12, fontWeight: 700 }}>
          ＋ 打刻を手動追加(店長修正)
        </button>
      ) : (
        <div className="rounded-xl p-3 flex flex-col gap-2" style={{ background: C.surface, border: `1px solid ${C.gold}` }}>
          <select value={addStaffId} onChange={(e) => setAddStaffId(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_BODY }}>
            <option value="">スタッフを選択</option>
            {staff.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
          <div className="flex gap-2">
            <button onClick={() => setAddType("in")} className="press flex-1 rounded-lg py-2" style={{ background: addType === "in" ? C.mint : C.surfaceAlt, color: addType === "in" ? C.ink : C.muted, fontSize: 12, fontWeight: 700 }}>出勤</button>
            <button onClick={() => setAddType("out")} className="press flex-1 rounded-lg py-2" style={{ background: addType === "out" ? C.coral : C.surfaceAlt, color: addType === "out" ? C.ink : C.muted, fontSize: 12, fontWeight: 700 }}>退勤</button>
          </div>
          <div className="flex gap-2">
            <input type="date" value={addDate} onChange={(e) => setAddDate(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1 }} />
            <input type="time" value={addTime} onChange={(e) => setAddTime(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1 }} />
          </div>
          <div className="flex gap-2">
            <button onClick={() => setAddOpen(false)} className="press flex-1 rounded-lg py-2" style={{ border: `1px solid ${C.line}`, color: C.paper, fontSize: 12 }}>キャンセル</button>
            <button onClick={doAdd} className="press flex-1 rounded-lg py-2" style={{ background: C.gold, color: C.ink, fontWeight: 700, fontSize: 12 }}>追加</button>
          </div>
        </div>
      )}

      <div className="flex flex-col gap-1.5">
        {filtered.map((p) => (
          <div key={p.id} className="flex items-center justify-between rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, border: `1px solid ${C.line}` }}>
            <div>
              <span style={{ fontSize: 13 }}>
                <span style={{ color: p.type === "in" ? C.mint : C.coral, fontWeight: 700, marginRight: 6 }}>{p.type === "in" ? "出勤" : "退勤"}</span>
                {p.staffName}
              </span>
              <div style={{ fontSize: 10, color: C.muted, fontFamily: FONT_MONO }}>
                {fmt(p.ts)}
                {p.byManager && <span style={{ color: C.gold, marginLeft: 6 }}>(店長修正)</span>}
                {p.lat != null && <span style={{ marginLeft: 6 }}>GPS</span>}
              </div>
            </div>
            <button onClick={() => deletePunch(p.id)} style={{ color: C.muted }}><Trash2 size={14} /></button>
          </div>
        ))}
        {filtered.length === 0 && <div style={{ fontSize: 12, color: C.muted, textAlign: "center", padding: "16px 0" }}>該当する打刻がありません</div>}
      </div>
    </div>
  );
}

function GeofenceSettings({ storeGeo, saveStoreGeo }) {
  const [enabled, setEnabled] = useState(storeGeo.enabled);
  const [lat, setLat] = useState(storeGeo.lat ?? "");
  const [lng, setLng] = useState(storeGeo.lng ?? "");
  const [radiusM, setRadiusM] = useState(storeGeo.radiusM || 100);
  const [busy, setBusy] = useState(false);

  const captureCurrent = () => {
    setBusy(true);
    navigator.geolocation.getCurrentPosition(
      (pos) => { setLat(pos.coords.latitude); setLng(pos.coords.longitude); setBusy(false); },
      (err) => { alert("位置情報が取得できませんでした: " + err.message); setBusy(false); },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  const save = () => {
    saveStoreGeo({ enabled, lat: lat === "" ? null : Number(lat), lng: lng === "" ? null : Number(lng), radiusM: Number(radiusM) || 100 });
    alert("設定を保存しました");
  };

  return (
    <div className="flex flex-col gap-3">
      <div className="rounded-xl p-4 flex flex-col gap-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div style={{ fontSize: 12, color: C.muted }}>タイムカードの打刻を店舗周辺に限定します(GPS)</div>
        <div className="flex items-center justify-between">
          <span style={{ fontSize: 13, fontWeight: 700 }}>位置チェックを有効化</span>
          <Toggle checked={enabled} onChange={setEnabled} />
        </div>
        <div>
          <label style={labelStyle}>店舗の緯度・経度</label>
          <div className="flex gap-2">

function BuybackManage({ items, addItem, updateItem, deleteItem }) {
  const [cat, setCat] = useState("pokemon");
  const [newName, setNewName] = useState("");
  const [newPrice, setNewPrice] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editName, setEditName] = useState("");
  const [editPrice, setEditPrice] = useState("");

  const filtered = items.filter((i) => i.category === cat).sort((a, b) => b.price - a.price);

  const add = () => {
    if (!newName.trim() || newPrice === "") return;
    addItem(cat, newName.trim(), newPrice);
    setNewName("");
    setNewPrice("");
  };

  const beginEdit = (i) => {
    setEditingId(i.id);
    setEditName(i.name);
    setEditPrice(String(i.price));
  };
  const saveEdit = () => {
    updateItem(editingId, { name: editName.trim(), price: Number(editPrice) || 0 });
    setEditingId(null);
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="flex gap-2">
        {[
          ["pokemon", "ポケモン"],
          ["onepiece", "ワンピース"],
        ].map(([k, l]) => (
          <button
            key={k}
            onClick={() => setCat(k)}
            className="press flex-1 rounded-lg py-2"
            style={{ background: cat === k ? C.gold : C.surfaceAlt, color: cat === k ? C.ink : C.muted, fontSize: 13, fontWeight: 700 }}

            {l}({items.filter((i) => i.category === k).length})

      </div>

      <div className="rounded-xl p-3 flex flex-col gap-2" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div style={{ fontSize: 11, color: C.muted }}>新しい買取カードを追加</div>
        <div className="flex gap-2">
          <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="カード名" style={{ ...inputStyle, fontFamily: FONT_BODY, flex: 2 }} />
          <input type="number" value={newPrice} onChange={(e) => setNewPrice(e.target.value)} placeholder="金額" style={{ ...inputStyle, flex: 1 }} />

                  <button onClick={saveEdit} className="press flex-1 rounded-lg py-2" style={{ background: C.gold, color: C.ink, fontSize: 12, fontWeight: 700 }}>保存</button>

              </div>
            ) : (
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2 min-w-0" style={{ flex: 1 }}>
                  <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: idx < 3 ? C.gold : C.muted, fontSize: 12, minWidth: 20 }}>{idx + 1}</span>

function AdminGate({ onUnlock, onCancel }) {
  const [pw, setPw] = useState("");
  const [err, setErr] = useState(false);
  const submit = () => {
    if (pw === ADMIN_PASSWORD) onUnlock();
    else { setErr(true); setPw(""); }
  };
  return (
    <div className="flex flex-col items-center gap-4 pt-6">
      <div className="flex items-center justify-center rounded-full" style={{ width: 56, height: 56, background: C.surfaceAlt2 }}>

        <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 16 }}>管理者コード</div>

      <input
        type="password"
        inputMode="numeric"
        value={pw}
        onChange={(e) => { setPw(e.target.value); setErr(false); }}

        style={{ ...inputStyle, textAlign: "center", letterSpacing: 4, maxWidth: 220 }}

      {err && <div style={{ fontSize: 12, color: C.coral }}>コードが違います</div>}

        <button onClick={submit} className="press rounded-xl px-8 py-3" style={{ background: C.gold, color: C.ink, fontWeight: 700, fontSize: 14 }}>
          解除
        </button>
      </div>
    </div>
  );
}
