function PunchClock({ staff, addStaff, timePunches, punch, storeGeo }) {
  const [selectedName, setSelectedName] = useState("");
  const [newName, setNewName] = useState("");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  const doPunch = async (type) => {
    if (!selectedName) { setMsg({ ok: false, text: "名前を選択してください" }); return; }
    const member = staff.find((s) => s.name === selectedName);
    if (!member) { setMsg({ ok: false, text: "スタッフが見つかりません" }); return; }
    setBusy(true);
    setMsg(null);
    const res = await punch(member, type);
    setBusy(false);
    if (res.ok) {
      const now = new Date();
      setMsg({ ok: true, text: `${type === "in" ? "出勤" : "退勤"} 打刻しました ${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}` });
    } else {
      setMsg({ ok: false, text: res.reason || "打刻できませんでした" });
    }
  };

  const myPunches = timePunches
    .filter((p) => p.staffName === selectedName)
    .sort((a, b) => b.ts - a.ts)
    .slice(0, 8);

  const fmt = (ts) => {
    const d = new Date(ts);
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-xl p-4 flex flex-col gap-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div>
          <label style={labelStyle}>あなたの名前</label>
          {staff.length === 0 ? (
            <div style={{ fontSize: 12, color: C.muted, padding: "8px 0" }}>初回のため名前を登録してください。</div>
          ) : (
            <div className="grid grid-cols-2 gap-2">
              {staff.map((s) => (
                <button
                  key={s.id}
                  onClick={() => setSelectedName(s.name)}
                  className="press rounded-lg py-2"
                  style={{
                    background: selectedName === s.name ? C.gold : C.surfaceAlt,
                    color: selectedName === s.name ? C.ink : C.paper,
                    fontSize: 13,
                    fontWeight: 700,
                    border: `1px solid ${selectedName === s.name ? C.gold : C.line}`,
                  }}
                >
                  {s.name}
                </button>
              ))}
            </div>
          )}
        </div>
        <div>
          <label style={labelStyle}>名前が無ければ追加</label>
          <div className="flex gap-2">
            <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="スタッフ名" style={{ ...inputStyle, fontFamily: FONT_BODY }} />
            <button
              onClick={() => {
                if (!newName.trim()) return;
                addStaff(newName.trim());
                setSelectedName(newName.trim());
                setNewName("");
              }}
              className="press rounded-lg px-4"
              style={{ background: C.gold, color: C.ink, fontWeight: 700, fontSize: 13 }}
            >
              追加
            </button>
          </div>
        </div>
      </div>

      <div className="grid grid-cols-2 gap-3">
        <button
          onClick={() => doPunch("in")}
          disabled={busy}
          className="press rounded-2xl py-6"
          style={{ background: C.mint, color: C.ink, fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 22, opacity: busy ? 0.6 : 1 }}
        >
          出勤
        </button>
        <button
          onClick={() => doPunch("out")}
          disabled={busy}
          className="press rounded-2xl py-6"
          style={{ background: C.coral, color: C.ink, fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 22, opacity: busy ? 0.6 : 1 }}
        >
          退勤
        </button>
      </div>

      {busy && <div style={{ fontSize: 12, color: C.muted, textAlign: "center" }}>位置情報を確認しています…</div>}

      {msg && (
        <div
          className="rounded-xl px-3 py-2.5 text-center"
          style={{
            background: msg.ok ? "rgba(111,207,143,0.14)" : "rgba(226,105,79,0.14)",
            border: `1px solid ${msg.ok ? C.mint : C.coral}`,
            color: msg.ok ? C.mint : C.coral,
            fontSize: 13,
            fontWeight: 700,
          }}
        >
          {msg.text}
        </div>
      )}

      {storeGeo.enabled && (
        <div style={{ fontSize: 11, color: C.muted, textAlign: "center" }}>
          店舗から{storeGeo.radiusM || 100}m以内でのみ打刻できます
        </div>
      )}

      {selectedName && myPunches.length > 0 && (
        <div className="flex flex-col gap-2">
          <div style={{ fontSize: 12, color: C.muted }}>{selectedName} さんの直近の打刻</div>
          {myPunches.map((p) => (
            <div key={p.id} className="rounded-lg px-3 py-2 flex items-center justify-between" style={{ background: C.surfaceAlt, border: `1px solid ${C.line}` }}>
              <span style={{ fontSize: 12 }}>
                <span style={{ color: p.type === "in" ? C.mint : C.coral, fontWeight: 700, marginRight: 6 }}>{p.type === "in" ? "出勤" : "退勤"}</span>
                {fmt(p.ts)}
                {p.byManager && <span style={{ fontSize: 10, color: C.gold, marginLeft: 6 }}>(店長修正)</span>}
              </span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ShiftSubmit({ staff, shiftRequests, submitShiftRequest }) {
  const [name, setName] = useState("");
  const [periodStart, setPeriodStart] = useState(biweeklyPeriodStart(todayKey()));
  const days = biweeklyDates(periodStart);
  const [entries, setEntries] = useState(() => days.map((d) => ({ date: d, start: "", end: "", note: "" })));
  const [submitted, setSubmitted] = useState(false);

  useEffect(() => {
    setEntries(biweeklyDates(periodStart).map((d) => ({ date: d, start: "", end: "", note: "" })));
    setSubmitted(false);
  }, [periodStart]);

  const updEntry = (i, k, v) => setEntries((prev) => prev.map((e, ei) => (ei === i ? { ...e, [k]: v } : e)));

  const canSubmit = name.trim() && entries.some((e) => e.start || e.end || e.note);

  const submit = () => {
    if (!canSubmit) return;
    submitShiftRequest(name, periodStart, entries);
    setSubmitted(true);
    // clear form-ish
    setEntries(days.map((d) => ({ date: d, start: "", end: "", note: "" })));
  };

  const myPastRequests = shiftRequests
    .filter((r) => r.staffName === name.trim())
    .sort((a, b) => b.submittedAt - a.submittedAt)
    .slice(0, 3);

  const shiftPeriod = (offset) => {
    setPeriodStart(shiftHalfPeriod(periodStart, offset));
  };
  const lastDate = days[days.length - 1];

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-xl p-4 flex flex-col gap-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div>
          <label style={labelStyle}>あなたの名前</label>
          {staff.length > 0 && (
            <div className="grid grid-cols-2 gap-2 mb-2">
              {staff.map((s) => (
                <button
                  key={s.id}
                  onClick={() => setName(s.name)}
                  className="press rounded-lg py-2"
                  style={{
                    background: name === s.name ? C.gold : C.surfaceAlt,
                    color: name === s.name ? C.ink : C.paper,
                    fontSize: 12,
                    fontWeight: 700,
                    border: `1px solid ${name === s.name ? C.gold : C.line}`,
                  }}
                >
                  {s.name}
                </button>
              ))}
            </div>
          )}
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="または直接入力" style={{ ...inputStyle, fontFamily: FONT_BODY }} />
        </div>
        <div>
          <label style={labelStyle}>期間</label>
          <div className="flex items-center gap-2">
            <button onClick={() => shiftPeriod(-1)} className="press rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, color: C.paper, border: `1px solid ${C.line}` }}>◀</button>
            <span style={{ flex: 1, textAlign: "center", fontFamily: FONT_MONO, fontSize: 13 }}>
              {periodLabel(periodStart)} ({fmtDateKey(periodStart)}〜{fmtDateKey(lastDate)})
            </span>
            <button onClick={() => shiftPeriod(1)} className="press rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, color: C.paper, border: `1px solid ${C.line}` }}>▶</button>
          </div>
        </div>
      </div>

      <div style={{ fontSize: 11, color: C.muted }}>
        働ける日だけ「出勤希望」をONにして、何時から何時まで働けるかを入力してください。
      </div>

      <div className="flex flex-col gap-2">
        {entries.map((e, i) => {
          const isActive = !!(e.start || e.end);
          return (
          <div key={e.date} className="rounded-lg p-3" style={{ background: C.surface, border: `1px solid ${isActive ? C.gold : C.line}` }}>
            <div className="flex items-center justify-between mb-2">
              <div style={{ fontSize: 12, color: isActive ? C.gold : C.muted, fontWeight: 700 }}>{fmtDateKey(e.date)}</div>
              <button
                onClick={() => {
                  if (isActive) {
                    updEntry(i, "start", "");
                    updEntry(i, "end", "");
                  } else {
                    updEntry(i, "start", "10:00");
                    updEntry(i, "end", "19:00");
                  }
                }}
                className="press rounded-full px-2.5 py-1"
                style={{ background: isActive ? C.gold : C.surfaceAlt2, color: isActive ? C.ink : C.muted, fontSize: 10, fontWeight: 700, border: isActive ? "none" : `1px solid ${C.line}` }}
              >
                {isActive ? "出勤希望" : "休み"}
              </button>
            </div>
            {isActive && (
            <div className="flex items-center gap-2">
              <input
                type="time"
                value={e.start}
                onChange={(ev) => updEntry(i, "start", ev.target.value)}
                style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1, padding: "8px 10px" }}
              />
              <span style={{ fontSize: 12, color: C.muted }}>〜</span>
              <input
                type="time"
                value={e.end}
                onChange={(ev) => updEntry(i, "end", ev.target.value)}
                style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1, padding: "8px 10px" }}
              />
            </div>
            )}
            {isActive && (
              <input
                value={e.note}
                onChange={(ev) => updEntry(i, "note", ev.target.value)}
                placeholder="メモ(任意)"
                style={{ ...inputStyle, fontFamily: FONT_BODY, marginTop: 6, padding: "6px 10px", fontSize: 12 }}
              />
            )}
          </div>
          );
        })}
      </div>

      <button
        onClick={submit}
        disabled={!canSubmit}
        className="press rounded-xl py-3"
        style={{ background: canSubmit ? C.gold : C.surfaceAlt2, color: canSubmit ? C.ink : C.muted, fontWeight: 700, fontSize: 14 }}
      >
        希望シフトを提出
      </button>

      {submitted && (
        <div className="rounded-xl px-3 py-2.5 text-center" style={{ background: "rgba(111,207,143,0.14)", border: `1px solid ${C.mint}`, color: C.mint, fontSize: 13, fontWeight: 700 }}>
          提出しました。店長側で確認されます。
        </div>
      )}

      {myPastRequests.length > 0 && (
        <div className="flex flex-col gap-2">
          <div style={{ fontSize: 12, color: C.muted }}>{name} さんの過去の提出</div>
          {myPastRequests.map((r) => (
            <div key={r.id} className="rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, border: `1px solid ${C.line}` }}>
              <div style={{ fontSize: 12 }}>{fmtDateKey(r.periodStart)} 〜 {fmtDateKey(addDays(r.periodStart, 13))}</div>
              <div style={{ fontSize: 10, color: C.muted, fontFamily: FONT_MONO }}>{new Date(r.submittedAt).toLocaleString("ja-JP")}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ShiftRequestList({ shiftRequests, deleteShiftRequest, publishConfirmedShift, staff, confirmedShifts }) {
  const [periodStart, setPeriodStart] = useState(biweeklyPeriodStart(todayKey()));
  const dates = biweeklyDates(periodStart);
  const reqsForPeriod = shiftRequests.filter((r) => r.periodStart === periodStart);
  const existingConfirmed = confirmedShifts.find((c) => c.periodStart === periodStart);

  // Draft: { "<staffName>|<date>": { staffId, staffName, date, start, end, note, decided: bool } }
  const [draft, setDraft] = useState(() => buildInitialDraft());
  const [expandedDate, setExpandedDate] = useState(null);

  useEffect(() => setDraft(buildInitialDraft()), [periodStart, shiftRequests.length, existingConfirmed && existingConfirmed.id]);

  function buildInitialDraft() {
    const m = {};
    // Start from all submitted requests as "希望" (undecided)
    reqsForPeriod.forEach((r) => {
      r.entries.forEach((e) => {
        if (!e.start && !e.end) return;
        const k = r.staffName + "|" + e.date;
        m[k] = { staffId: r.staffId, staffName: r.staffName, date: e.date, start: e.start, end: e.end, note: e.note, decided: false, requestedStart: e.start, requestedEnd: e.end };
      });
    });
    // Merge existing confirmed entries as "決定済み" (mark decided)
    if (existingConfirmed) {
      existingConfirmed.entries.forEach((e) => {
        const k = e.staffName + "|" + e.date;
        if (m[k]) {
          m[k] = { ...m[k], start: e.start, end: e.end, note: e.note, decided: true };
        } else {
          m[k] = { staffId: e.staffId, staffName: e.staffName, date: e.date, start: e.start, end: e.end, note: e.note, decided: true };
        }
      });
    }
    return m;
  }

  const shiftPeriod = (offset) => {
    setPeriodStart(shiftHalfPeriod(periodStart, offset));
  };
  const lastDate = dates[dates.length - 1];

  const publish = () => {
    const entries = Object.values(draft).filter((e) => e.decided && (e.start || e.end));
    publishConfirmedShift(periodStart, entries);
    alert(`${entries.length}件の確定シフトを発行しました`);
  };

  const updateRow = (key, patch) => setDraft((prev) => ({ ...prev, [key]: { ...prev[key], ...patch } }));
  const toggleDecide = (key) => updateRow(key, { decided: !draft[key].decided });
  const removeRow = (key) => setDraft((prev) => { const next = { ...prev }; delete next[key]; return next; });
  const addRow = (date, staffId) => {
    const member = staff.find((s) => s.id === staffId);
    if (!member) return;
    const key = member.name + "|" + date;
    if (draft[key]) return;
    setDraft((prev) => ({ ...prev, [key]: { staffId: member.id, staffName: member.name, date, start: "10:00", end: "19:00", note: "", decided: true } }));
  };

  // sums for header
  const decidedCount = Object.values(draft).filter((e) => e.decided).length;

function PunchLog({ timePunches, staff, managerPunch, deletePunch }) {
  const [staffFilter, setStaffFilter] = useState("");
  const [rangeDays, setRangeDays] = useState(14);
  const now = Date.now();
  const cutoff = now - rangeDays * 86400000;
  const filtered = timePunches
    .filter((p) => p.ts >= cutoff)
    .filter((p) => !staffFilter || p.staffName === staffFilter)
    .sort((a, b) => b.ts - a.ts);

  // pair in/out per staff per day for a work-hours summary
  const summaryByStaff = {};
  filtered.forEach((p) => {
    if (!summaryByStaff[p.staffName]) summaryByStaff[p.staffName] = [];
    summaryByStaff[p.staffName].push(p);
  });
  const workHoursByStaff = {};
  Object.entries(summaryByStaff).forEach(([name, punches]) => {
    let totalMs = 0;
    let lastIn = null;
    [...punches].reverse().forEach((p) => {
      if (p.type === "in") lastIn = p.ts;
      else if (p.type === "out" && lastIn) {
        totalMs += p.ts - lastIn;
        lastIn = null;
      }
    });
    workHoursByStaff[name] = totalMs / 3600000;
  });

  // add-punch form
  const [addOpen, setAddOpen] = useState(false);
  const [addStaffId, setAddStaffId] = useState("");
  const [addType, setAddType] = useState("in");
  const [addDate, setAddDate] = useState(todayKey());
  const [addTime, setAddTime] = useState("09:00");

  const doAdd = () => {
    const member = staff.find((s) => s.id === addStaffId);
    if (!member) return;
    const [h, mi] = addTime.split(":").map(Number);
    const [y, m, d] = addDate.split("-").map(Number);
    const ts = new Date(y, m - 1, d, h, mi).getTime();
    managerPunch(member, addType, ts);
    setAddOpen(false);
  };

  const fmt = (ts) => {
    const d = new Date(ts);
    return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };

  return (
    <div className="flex flex-col gap-3">
      <div className="flex gap-2">
        <select value={staffFilter} onChange={(e) => setStaffFilter(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_BODY, flex: 2 }}>
          <option value="">全スタッフ</option>
          {staff.map((s) => <option key={s.id} value={s.name}>{s.name}</option>)}
        </select>
        <select value={rangeDays} onChange={(e) => setRangeDays(Number(e.target.value))} style={{ ...inputStyle, fontFamily: FONT_BODY, flex: 1 }}>
          <option value={7}>7日</option>
          <option value={14}>14日</option>
          <option value={30}>30日</option>
          <option value={90}>90日</option>
        </select>
      </div>

      {Object.keys(workHoursByStaff).length > 0 && (
        <div className="flex flex-col gap-1.5">
          <div style={{ fontSize: 12, color: C.muted }}>期間内の勤務時間</div>
          {Object.entries(workHoursByStaff).sort((a, b) => b[1] - a[1]).map(([name, h]) => (
            <div key={name} className="flex items-center justify-between rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, border: `1px solid ${C.line}` }}>
              <span style={{ fontSize: 13 }}>{name}</span>
              <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: C.gold, fontSize: 14 }}>{h.toFixed(1)} 時間</span>
            </div>
          ))}
        </div>
      )}

      {!addOpen ? (
        <button onClick={() => setAddOpen(true)} className="press rounded-lg py-2" style={{ border: `1px dashed ${C.gold}`, color: C.gold, fontSize: 12, fontWeight: 700 }}>
          ＋ 打刻を手動追加(店長修正)
        </button>
      ) : (
        <div className="rounded-xl p-3 flex flex-col gap-2" style={{ background: C.surface, border: `1px solid ${C.gold}` }}>
          <select value={addStaffId} onChange={(e) => setAddStaffId(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_BODY }}>
            <option value="">スタッフを選択</option>
            {staff.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
          </select>
          <div className="flex gap-2">
            <button onClick={() => setAddType("in")} className="press flex-1 rounded-lg py-2" style={{ background: addType === "in" ? C.mint : C.surfaceAlt, color: addType === "in" ? C.ink : C.muted, fontSize: 12, fontWeight: 700 }}>出勤</button>
            <button onClick={() => setAddType("out")} className="press flex-1 rounded-lg py-2" style={{ background: addType === "out" ? C.coral : C.surfaceAlt, color: addType === "out" ? C.ink : C.muted, fontSize: 12, fontWeight: 700 }}>退勤</button>
          </div>
          <div className="flex gap-2">
            <input type="date" value={addDate} onChange={(e) => setAddDate(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1 }} />
            <input type="time" value={addTime} onChange={(e) => setAddTime(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1 }} />
          </div>
          <div className="flex gap-2">
            <button onClick={() => setAddOpen(false)} className="press flex-1 rounded-lg py-2" style={{ border: `1px solid ${C.line}`, color: C.paper, fontSize: 12 }}>キャンセル</button>
            <button onClick={doAdd} className="press flex-1 rounded-lg py-2" style={{ background: C.gold, color: C.ink, fontWeight: 700, fontSize: 12 }}>追加</button>
          </div>
        </div>
      )}

      <div className="flex flex-col gap-1.5">
        {filtered.map((p) => (
          <div key={p.id} className="flex items-center justify-between rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, border: `1px solid ${C.line}` }}>
            <div>
              <span style={{ fontSize: 13 }}>
                <span style={{ color: p.type === "in" ? C.mint : C.coral, fontWeight: 700, marginRight: 6 }}>{p.type === "in" ? "出勤" : "退勤"}</span>
                {p.staffName}
              </span>
              <div style={{ fontSize: 10, color: C.muted, fontFamily: FONT_MONO }}>
                {fmt(p.ts)}
                {p.byManager && <span style={{ color: C.gold, marginLeft: 6 }}>(店長修正)</span>}
                {p.lat != null && <span style={{ marginLeft: 6 }}>GPS</span>}
              </div>
            </div>
            <button onClick={() => deletePunch(p.id)} style={{ color: C.muted }}><Trash2 size={14} /></button>
          </div>
        ))}
        {filtered.length === 0 && <div style={{ fontSize: 12, color: C.muted, textAlign: "center", padding: "16px 0" }}>該当する打刻がありません</div>}
      </div>
    </div>
  );
}

function GeofenceSettings({ storeGeo, saveStoreGeo }) {
  const [enabled, setEnabled] = useState(storeGeo.enabled);
  const [lat, setLat] = useState(storeGeo.lat ?? "");
  const [lng, setLng] = useState(storeGeo.lng ?? "");
  const [radiusM, setRadiusM] = useState(storeGeo.radiusM || 100);
  const [busy, setBusy] = useState(false);

  const captureCurrent = () => {
    setBusy(true);
    navigator.geolocation.getCurrentPosition(
      (pos) => { setLat(pos.coords.latitude); setLng(pos.coords.longitude); setBusy(false); },
      (err) => { alert("位置情報が取得できませんでした: " + err.message); setBusy(false); },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  const save = () => {
    saveStoreGeo({ enabled, lat: lat === "" ? null : Number(lat), lng: lng === "" ? null : Number(lng), radiusM: Number(radiusM) || 100 });
    alert("設定を保存しました");
  };

  return (
    <div className="flex flex-col gap-3">
      <div className="rounded-xl p-4 flex flex-col gap-3" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div style={{ fontSize: 12, color: C.muted }}>タイムカードの打刻を店舗周辺に限定します(GPS)</div>
        <div className="flex items-center justify-between">
          <span style={{ fontSize: 13, fontWeight: 700 }}>位置チェックを有効化</span>
          <Toggle checked={enabled} onChange={setEnabled} />
        </div>
        <div>
          <label style={labelStyle}>店舗の緯度・経度</label>
          <div className="flex gap-2">
            <input value={lat} onChange={(e) => setLat(e.target.value)} placeholder="緯度" style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1 }} />
            <input value={lng} onChange={(e) => setLng(e.target.value)} placeholder="経度" style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1 }} />
          </div>
          <button onClick={captureCurrent} disabled={busy} className="press rounded-lg py-2 mt-2 w-full" style={{ border: `1px solid ${C.gold}`, color: C.gold, fontSize: 12, fontWeight: 700, opacity: busy ? 0.5 : 1 }}>
            {busy ? "取得中…" : "現在地を店舗として登録"}
          </button>
        </div>
        <div>
          <label style={labelStyle}>許容範囲(メートル)</label>
          <input type="number" value={radiusM} onChange={(e) => setRadiusM(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_MONO }} />
        </div>
        <button onClick={save} className="press rounded-lg py-2" style={{ background: C.gold, color: C.ink, fontWeight: 700, fontSize: 13 }}>保存</button>
      </div>
    </div>
  );
}

// per-staff payroll detail: monthly wage breakdown + recent punches
function StaffPayDetail({ staffMember, comp, timePunches, onBack, onEditPay }) {
  const currentMonth = todayKey().slice(0, 7);
  const [monthKey, setMonthKey] = useState(currentMonth);
  const shiftMonth = (offset) => {
    const [y, m] = monthKey.split("-").map(Number);
    const d = new Date(y, m - 1 + offset, 1);
    setMonthKey(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
  };

  const myPunches = timePunches.filter((p) => p.staffId === staffMember.id).sort((a, b) => a.ts - b.ts);
  const myMonthPunches = myPunches.filter((p) => monthKeyOf(dateKeyOf(p.ts)) === monthKey);

  // pair in->out per day
  const dayMap = {};
  myMonthPunches.forEach((p) => {
    const dk = dateKeyOf(p.ts);
    if (!dayMap[dk]) dayMap[dk] = [];
    dayMap[dk].push(p);
  });
  const rows = Object.entries(dayMap).sort((a, b) => a[0].localeCompare(b[0])).map(([dk, list]) => {
    const sorted = [...list].sort((a, b) => a.ts - b.ts);
    let hoursMs = 0;
    let lastIn = null;
    const pairs = [];
    let currentPair = null;
    sorted.forEach((p) => {
      if (p.type === "in") {
        lastIn = p.ts;
        currentPair = { in: p.ts, out: null };
      } else if (p.type === "out") {
        if (lastIn) { hoursMs += p.ts - lastIn; if (currentPair) currentPair.out = p.ts; lastIn = null; }
        else pairs.push({ in: null, out: p.ts });
      }
      if (p.type === "in") pairs.push(currentPair);
    });
    // if still un-paired
    if (currentPair && currentPair.out === null) {
      // already pushed
    }
    return { dateKey: dk, hours: hoursMs / 3600000, pairs, hasWork: list.some((p) => p.type === "in") };
  });
  const totalHours = rows.reduce((a, r) => a + r.hours, 0);
  const workDays = rows.filter((r) => r.hasWork).length;
  const hourlyWage = Number(comp.hourlyWage) || 0;
  const commutePerDay = Number(comp.commutePerDay) || 0;
  const wage = totalHours * hourlyWage;
  const commute = workDays * commutePerDay;
  const total = wage + commute;

  const fmt = (ts) => ts == null ? "-" : `${String(new Date(ts).getHours()).padStart(2, "0")}:${String(new Date(ts).getMinutes()).padStart(2, "0")}`;

  return (
    <div className="flex flex-col gap-4">
      <div className="flex items-center gap-2">
        <button onClick={onBack} className="press flex items-center justify-center rounded-full" style={{ width: 32, height: 32, background: C.surfaceAlt2 }}>
          <ArrowLeft size={16} color={C.paper} />
        </button>
        <div className="flex-1">
          <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 17 }}>{staffMember.name}</div>
          <div style={{ fontSize: 11, color: C.muted, fontFamily: FONT_MONO }}>
            時給{yen(hourlyWage)} ・ 交通費/日{yen(commutePerDay)}
          </div>
        </div>
        <button onClick={onEditPay} className="press rounded-lg px-3 py-1.5" style={{ border: `1px solid ${C.gold}`, color: C.gold, fontSize: 11, fontWeight: 700 }}>設定</button>
      </div>

      <div className="flex items-center gap-2">
        <button onClick={() => shiftMonth(-1)} className="press rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, color: C.paper }}>◀</button>
        <span style={{ flex: 1, textAlign: "center", fontFamily: FONT_MONO, fontSize: 15, fontWeight: 700 }}>{monthKey}</span>
        <button onClick={() => shiftMonth(1)} className="press rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, color: C.paper }}>▶</button>
      </div>

      <div className="rounded-xl p-4" style={{ background: C.surface, border: `1px solid ${C.gold}` }}>
        <div style={{ fontSize: 12, color: C.muted, marginBottom: 10 }}>{monthKey} 給与サマリ</div>
        <div className="grid grid-cols-2 gap-3">
          <StatBlock label="勤務時間" value={`${totalHours.toFixed(1)}h`} color={C.gold} />
          <StatBlock label="出勤日数" value={`${workDays}日`} color={C.gold} />
          <StatBlock label="給与(時給×時間)" value={yen(Math.round(wage))} color={C.mint} />
          <StatBlock label="交通費(日数×交通費)" value={yen(Math.round(commute))} color={C.mint} />
        </div>
        <div className="flex justify-between items-center mt-3 pt-3" style={{ borderTop: `1px dashed ${C.line}` }}>
          <span style={{ fontSize: 13, color: C.muted, fontWeight: 700 }}>支給合計</span>
          <span style={{ fontFamily: FONT_MONO, fontWeight: 800, fontSize: 24, color: C.gold }}>{yen(Math.round(total))}</span>
        </div>
      </div>

      {/* punch log for this month */}
      <div className="flex flex-col gap-2">
        <div style={{ fontSize: 12, color: C.muted }}>{monthKey} 打刻ログ</div>
        {rows.length === 0 ? (
          <div className="rounded-xl px-4 py-6 text-center" style={{ background: C.surface, border: `1px dashed ${C.line}`, color: C.muted, fontSize: 12 }}>
            この月の打刻がありません
          </div>
        ) : (
          rows.map((r) => (
            <div key={r.dateKey} className="rounded-lg px-3 py-2" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
              <div className="flex items-center justify-between">
                <span style={{ fontSize: 12, fontWeight: 700 }}>{fmtDateKey(r.dateKey)}</span>
                <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: C.gold, fontSize: 13 }}>{r.hours.toFixed(1)}h</span>
              </div>
              <div className="flex flex-wrap gap-2 mt-1" style={{ fontSize: 11, color: C.muted, fontFamily: FONT_MONO }}>
                {r.pairs.filter(Boolean).map((p, i) => (
                  <span key={i}>{fmt(p.in)}〜{fmt(p.out)}</span>
                ))}
              </div>
            </div>
          ))
        )}
      </div>
    </div>
  );
}

              <button onClick={() => setAddOpen(false)} className="press flex-1 rounded-lg py-2" style={{ border: `1px solid ${C.line}`, color: C.paper, fontSize: 12 }}>キャンセル</button>
              <button onClick={commit} className="press flex-1 rounded-lg py-2" style={{ background: C.gold, color: C.ink, fontSize: 12, fontWeight: 700 }}>登録</button>
            </div>
          </div>
        )}

        {finance.monthExpenses.length === 0 && !addOpen && (
          <div className="rounded-xl px-4 py-6 text-center" style={{ background: C.surface, border: `1px dashed ${C.line}`, color: C.muted, fontSize: 13 }}>
            この月の経費は未登録
          </div>
        )}

        {[...finance.monthExpenses].sort((a, b) => b.date.localeCompare(a.date)).map((e) => (
          <ExpenseRow key={e.id} entry={e} categories={CATEGORIES} update={(patch) => updateExpense(e.id, patch)} onDelete={() => deleteExpense(e.id)} />
        ))}
      </div>
    </div>
  );
}

function ExpenseRow({ entry, categories, update, onDelete }) {

        <div className="flex gap-2">
          <button onClick={() => setEditing(false)} className="press flex-1 rounded-lg py-2" style={{ border: `1px solid ${C.line}`, color: C.paper, fontSize: 12 }}>キャンセル</button>
          <button onClick={save} className="press flex-1 rounded-lg py-2" style={{ background: C.gold, color: C.ink, fontSize: 12, fontWeight: 700 }}>保存</button>
        </div>
      </div>

  return (
    <div className="rounded-lg px-3 py-2 flex items-center justify-between" style={{ background: C.surface, border: `1px solid ${C.line}` }}>

        <div style={{ fontSize: 13 }}>
          <span style={{ fontFamily: FONT_MONO, color: C.muted, marginRight: 8 }}>{fmtDateKey(entry.date)}</span>
          <span style={{ fontSize: 10, color: C.gold, border: `1px solid ${C.gold}`, borderRadius: 999, padding: "1px 6px", marginRight: 6 }}>{entry.category}</span>
          {entry.memo}

      <div className="flex items-center gap-2">
        <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: C.coral, fontSize: 14 }}>{yen(entry.amount)}</span>
        <button onClick={() => setEditing(true)} style={{ color: C.gold, fontSize: 10, padding: "2px 6px" }}>編集</button>
        <button onClick={onDelete} style={{ color: C.muted }}><Trash2 size={13} /></button>

    .summary .box .lbl { font-size: 10px; color: #666; }

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function yenPlain(n) {
  const v = Math.round(Number(n) || 0);
  const sign = v < 0 ? "-" : "";
  return `${sign}¥${Math.abs(v).toLocaleString("ja-JP")}`;
}
function yenSigned(n) {
  const v = Math.round(Number(n) || 0);
  const sign = v > 0 ? "+" : v < 0 ? "-" : "";
  return `${sign}¥${Math.abs(v).toLocaleString("ja-JP")}`;
}

function buildMonthlyReportHTML({ monthKey, sections, oripaList, logsById, sessions, expenses, punches, staff, comp, buybackDaily, storeName }) {
  const fin = computeMonthlyFinance(monthKey, oripaList, logsById, sessions, expenses, punches, staff, comp);
  // buyback totals across month
  let bbPurchase = 0, bbSale = 0;
  Object.entries(buybackDaily || {}).forEach(([dk, v]) => {
    if (monthKeyOf(dk) === monthKey) { bbPurchase += Number(v.purchase || 0); bbSale += Number(v.sale || 0); }
  });
  const bbNet = bbSale - bbPurchase;
  const totalIncome = fin.grossProfit + bbNet;
  const totalOut = fin.payrollTotal + fin.otherExpensesTotal;
  const netAll = totalIncome - totalOut;

  let html = `<h1>月次レポート ${monthKey}</h1>`;
  html += `<div class="meta">${storeName || "店舗"} / 発行日 ${new Date().toLocaleDateString("ja-JP")}</div>`;

  // section: summary
  if (sections.summary) {
    html += `<h2>月次サマリ</h2>
    <div class="summary">
      <div class="box"><div class="lbl">オリパ売上</div><div class="val">${yenPlain(fin.sales)}</div></div>
      <div class="box"><div class="lbl">景品払出</div><div class="val">${yenPlain(fin.payout)}</div></div>
      <div class="box"><div class="lbl">オリパ粗利</div><div class="val positive">${yenPlain(fin.grossProfit)}</div></div>
      <div class="box"><div class="lbl">買取販売 収支</div><div class="val ${bbNet >= 0 ? "positive" : "negative"}">${yenSigned(bbNet)}</div></div>
      <div class="box"><div class="lbl">人件費(給与+交通費)</div><div class="val negative">${yenPlain(fin.payrollTotal)}</div></div>
      <div class="box"><div class="lbl">その他経費</div><div class="val negative">${yenPlain(fin.otherExpensesTotal)}</div></div>
    </div>
    <div style="margin-top:14px; padding:12px; border:2px solid #12151C; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
      <span style="font-weight:700;">当月の営業利益</span>
      <span class="big ${netAll >= 0 ? "positive" : "negative"}">${yenSigned(netAll)}</span>
    </div>`;
  }

  // section: category breakdown
  if (sections.categoryBreakdown) {
    html += `<h2>項目別内訳</h2>`;
    if (Object.keys(fin.expensesByCat).length === 0) html += `<div style="font-size:12px; color:#666;">この月の経費は未登録</div>`;
    else {
      html += `<table><thead><tr><th>項目</th><th class="num">金額</th></tr></thead><tbody>`;
      Object.entries(fin.expensesByCat).sort((a, b) => b[1] - a[1]).forEach(([k, v]) => {
        html += `<tr><td>${esc(k)}</td><td class="num">${yenPlain(v)}</td></tr>`;
      });
      html += `<tr><td><b>合計</b></td><td class="num"><b>${yenPlain(fin.otherExpensesTotal)}</b></td></tr>`;
      html += `</tbody></table>`;
    }
  }

  // section: expenses ledger
  if (sections.expenses) {
    html += `<h2>経費帳(明細)</h2>`;
    const sorted = [...fin.monthExpenses].sort((a, b) => a.date.localeCompare(b.date));
    if (sorted.length === 0) html += `<div style="font-size:12px; color:#666;">明細なし</div>`;
    else {
      html += `<table><thead><tr><th>日付</th><th>項目</th><th>メモ</th><th class="num">金額</th></tr></thead><tbody>`;
      sorted.forEach((e) => {
        html += `<tr><td>${esc(e.date)}</td><td>${esc(e.category)}</td><td>${esc(e.memo)}</td><td class="num">${yenPlain(e.amount)}</td></tr>`;
      });
      html += `</tbody></table>`;
    }
  }

  // section: payroll detail
  if (sections.payroll) {
    html += `<h2>人件費内訳(勤怠から自動計算)</h2>`;
    if (fin.payroll.length === 0) html += `<div style="font-size:12px; color:#666;">この月の打刻記録がありません</div>`;
    else {
      html += `<table><thead><tr><th>スタッフ</th><th class="num">勤務時間</th><th class="num">出勤日数</th><th class="num">給与</th><th class="num">交通費</th><th class="num">合計</th></tr></thead><tbody>`;
      fin.payroll.forEach((p) => {
        html += `<tr><td>${esc(p.name)}</td><td class="num">${p.hours.toFixed(1)}h</td><td class="num">${p.workDays}日</td><td class="num">${yenPlain(p.wage)}</td><td class="num">${yenPlain(p.commute)}</td><td class="num"><b>${yenPlain(p.total)}</b></td></tr>`;
      });
      html += `<tr><td colspan="5"><b>合計</b></td><td class="num"><b>${yenPlain(fin.payrollTotal)}</b></td></tr>`;
      html += `</tbody></table>`;
    }
  }

  // section: daily list
  if (sections.daily) {
    html += `<h2>日別売上・収支</h2>`;
    // gather all dates present in the month from logs / expenses / punches / buyback
    const dates = new Set();
    oripaList.forEach((o) => {
      (logsById[o.id] || []).forEach((e) => { const dk = dateKeyOf(e.ts); if (monthKeyOf(dk) === monthKey) dates.add(dk); });
    });
    expenses.forEach((e) => { if (monthKeyOf(e.date) === monthKey) dates.add(e.date); });
    punches.forEach((p) => { const dk = dateKeyOf(p.ts); if (monthKeyOf(dk) === monthKey) dates.add(dk); });
    Object.keys(buybackDaily || {}).forEach((dk) => { if (monthKeyOf(dk) === monthKey) dates.add(dk); });
    const dArr = Array.from(dates).sort();

    if (dArr.length === 0) html += `<div style="font-size:12px; color:#666;">記録なし</div>`;
    else {
      html += `<table><thead><tr><th>日付</th><th class="num">オリパ売上</th><th class="num">払出</th><th class="num">粗利</th><th class="num">買取収支</th><th class="num">人件費</th><th class="num">経費</th><th class="num">収支</th></tr></thead><tbody>`;
      let tSales = 0, tPayout = 0, tPay = 0, tExp = 0, tBB = 0, tNet = 0;
      dArr.forEach((dk) => {
        const s = computeDailyStats(dk, oripaList, logsById, sessions);
        const gp = (s.totalSales - s.totalPayout) || 0;
        const dayPunches = punches.filter((p) => dateKeyOf(p.ts) === dk);
        const dayPayroll = computeTodayPayroll(dayPunches, staff, comp);
        const payDay = dayPayroll.reduce((a, x) => a + x.total, 0);
        const expDay = expenses.filter((e) => e.date === dk).reduce((a, x) => a + Number(x.amount || 0), 0);
        const bb = buybackDaily[dk] || {};
        const bbNetDay = (Number(bb.sale) || 0) - (Number(bb.purchase) || 0);
        const net = gp + bbNetDay - payDay - expDay;
        tSales += s.totalSales; tPayout += s.totalPayout; tPay += payDay; tExp += expDay; tBB += bbNetDay; tNet += net;
        html += `<tr><td>${esc(dk)}</td><td class="num">${yenPlain(s.totalSales)}</td><td class="num">${yenPlain(s.totalPayout)}</td><td class="num ${gp >= 0 ? "positive" : "negative"}">${yenPlain(gp)}</td><td class="num ${bbNetDay >= 0 ? "positive" : "negative"}">${yenSigned(bbNetDay)}</td><td class="num">${yenPlain(payDay)}</td><td class="num">${yenPlain(expDay)}</td><td class="num ${net >= 0 ? "positive" : "negative"}">${yenSigned(net)}</td></tr>`;
      });
      html += `<tr><td><b>合計</b></td><td class="num"><b>${yenPlain(tSales)}</b></td><td class="num"><b>${yenPlain(tPayout)}</b></td><td class="num"><b>${yenPlain(tSales - tPayout)}</b></td><td class="num"><b>${yenSigned(tBB)}</b></td><td class="num"><b>${yenPlain(tPay)}</b></td><td class="num"><b>${yenPlain(tExp)}</b></td><td class="num ${tNet >= 0 ? "positive" : "negative"}"><b>${yenSigned(tNet)}</b></td></tr>`;
      html += `</tbody></table>`;
    }
  }
  return html;
}

function buildDailyReportHTML({ dateKey, oripaList, logsById, sessions, expenses, punches, staff, comp, buybackDaily, storeName }) {
  const s = computeDailyStats(dateKey, oripaList, logsById, sessions);
  const gp = (s.totalSales - s.totalPayout) || 0;
  const dayPunches = punches.filter((p) => dateKeyOf(p.ts) === dateKey);
  const dayPayroll = computeTodayPayroll(dayPunches, staff, comp);
  const payDay = dayPayroll.reduce((a, x) => a + x.total, 0);
  const dayExpenses = expenses.filter((e) => e.date === dateKey);
  const expDay = dayExpenses.reduce((a, x) => a + Number(x.amount || 0), 0);
  const bb = buybackDaily[dateKey] || {};
  const bbNet = (Number(bb.sale) || 0) - (Number(bb.purchase) || 0);
  const net = gp + bbNet - payDay - expDay;

  let html = `<h1>日次レポート ${dateKey}</h1>`;
  html += `<div class="meta">${storeName || "店舗"} / 発行日 ${new Date().toLocaleDateString("ja-JP")}</div>`;

  html += `<h2>本日のサマリ</h2>
  <div class="summary">
    <div class="box"><div class="lbl">オリパ売上</div><div class="val">${yenPlain(s.totalSales)}</div></div>
    <div class="box"><div class="lbl">景品払出</div><div class="val">${yenPlain(s.totalPayout)}</div></div>
    <div class="box"><div class="lbl">オリパ粗利</div><div class="val ${gp >= 0 ? "positive" : "negative"}">${yenPlain(gp)}</div></div>
    <div class="box"><div class="lbl">買取(仕入)</div><div class="val">${yenPlain(bb.purchase || 0)}</div></div>
    <div class="box"><div class="lbl">販売売上</div><div class="val">${yenPlain(bb.sale || 0)}</div></div>
    <div class="box"><div class="lbl">買取販売 収支</div><div class="val ${bbNet >= 0 ? "positive" : "negative"}">${yenSigned(bbNet)}</div></div>
    <div class="box"><div class="lbl">人件費</div><div class="val negative">${yenPlain(payDay)}</div></div>
    <div class="box"><div class="lbl">経費</div><div class="val negative">${yenPlain(expDay)}</div></div>
  </div>
  <div style="margin-top:14px; padding:12px; border:2px solid #12151C; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
    <span style="font-weight:700;">本日の収支</span>
    <span class="big ${net >= 0 ? "positive" : "negative"}">${yenSigned(net)}</span>
  </div>`;

  if (dayPayroll.length > 0) {
    html += `<h2>人件費内訳</h2><table><thead><tr><th>スタッフ</th><th class="num">勤務時間</th><th class="num">給与</th><th class="num">交通費</th><th class="num">合計</th></tr></thead><tbody>`;
    dayPayroll.forEach((p) => {
      html += `<tr><td>${esc(p.name)}</td><td class="num">${p.hours.toFixed(1)}h</td><td class="num">${yenPlain(p.wage)}</td><td class="num">${yenPlain(p.commute)}</td><td class="num"><b>${yenPlain(p.total)}</b></td></tr>`;
    });
    html += `<tr><td colspan="4"><b>合計</b></td><td class="num"><b>${yenPlain(payDay)}</b></td></tr></tbody></table>`;
  }

  if (dayExpenses.length > 0) {
    html += `<h2>経費内訳</h2><table><thead><tr><th>項目</th><th>メモ</th><th class="num">金額</th></tr></thead><tbody>`;
    dayExpenses.forEach((e) => {
      html += `<tr><td>${esc(e.category)}</td><td>${esc(e.memo)}</td><td class="num">${yenPlain(e.amount)}</td></tr>`;
    });
    html += `<tr><td colspan="2"><b>合計</b></td><td class="num"><b>${yenPlain(expDay)}</b></td></tr></tbody></table>`;
  }
  return html;
}

function PdfExportButton({ label, monthKey, dateKey, oripaList, logsById, sessions, expenses, punches, staff, comp, buybackDaily }) {
  const [open, setOpen] = useState(false);
  const [sections, setSections] = useState({
    summary: true,
    categoryBreakdown: true,
    expenses: true,
    payroll: true,
    daily: monthKey ? true : false,
  });

  const toggle = (k) => setSections((s) => ({ ...s, [k]: !s[k] }));

  const run = () => {
    if (monthKey) {
      const html = buildMonthlyReportHTML({
        monthKey, sections,
        oripaList, logsById, sessions, expenses, punches, staff, comp, buybackDaily,
        storeName: "トレぴ",
      });
      openReportPrint(`月次レポート ${monthKey}`, html);
    } else if (dateKey) {

// Compute actual work range (first in / last out) from punches for a staff on a given date
function actualRangeForDay(punches, staffId, dateKey) {
  const list = punches
    .filter((p) => p.staffId === staffId && dateKeyOf(p.ts) === dateKey)
    .sort((a, b) => a.ts - b.ts);
  if (list.length === 0) return null;
  const firstIn = list.find((p) => p.type === "in");
  const lastOut = [...list].reverse().find((p) => p.type === "out");
  const fmt = (ts) => `${String(new Date(ts).getHours()).padStart(2, "0")}:${String(new Date(ts).getMinutes()).padStart(2, "0")}`;
  return { start: firstIn ? fmt(firstIn.ts) : "-", end: lastOut ? fmt(lastOut.ts) : "-", hasIn: !!firstIn, hasOut: !!lastOut };
}

// Compute diff in minutes between planned (HH:MM) and actual (HH:MM); null if either missing.
function minutesDiff(hhmmA, hhmmB) {
  if (!hhmmA || !hhmmB) return null;
  const [ah, am] = hhmmA.split(":").map(Number);
  const [bh, bm] = hhmmB.split(":").map(Number);
  if (isNaN(ah) || isNaN(bh)) return null;
  return (ah * 60 + am) - (bh * 60 + bm);
}

// ============================================================
// ENHANCED CALENDAR-STYLE CONFIRMED SHIFT VIEW
// ============================================================
function ConfirmedShiftCalendar({ confirmedShifts, staff, timePunches, attendanceApprovals, approveAttendance, unapproveAttendance, updateConfirmedShift, adminUnlocked }) {
  // Default to current month
  const today = todayKey();
  const [y, m] = today.split("-").map(Number);
  const [monthKey, setMonthKey] = useState(`${y}-${String(m).padStart(2, "0")}`);

  const [editHalf, setEditHalf] = useState(null); // "first" | "second" | null
  const [editEntries, setEditEntries] = useState([]);

  const firstHalfStart = `${monthKey}-01`;
  const secondHalfStart = `${monthKey}-16`;
  const firstHalf = confirmedShifts.find((c) => c.periodStart === firstHalfStart);
  const secondHalf = confirmedShifts.find((c) => c.periodStart === secondHalfStart);

  const shiftMonth = (offset) => {
    const [cy, cm] = monthKey.split("-").map(Number);
    const d = new Date(cy, cm - 1 + offset, 1);
    setMonthKey(`${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`);
    setEditHalf(null);
  };

  // Combined entries for display
  const allEntries = [
    ...(firstHalf?.entries || []),
    ...(secondHalf?.entries || []),
  ];
  // If editing, replace entries of that half with editEntries
  let displayEntries = allEntries;
  if (editHalf === "first") {
    displayEntries = [...editEntries, ...(secondHalf?.entries || [])];
  } else if (editHalf === "second") {
    displayEntries = [...(firstHalf?.entries || []), ...editEntries];
  }

  const entriesForDate = (dk) => displayEntries.filter((e) => e.date === dk);

  // All dates of the current month
  const [cy, cm] = monthKey.split("-").map(Number);
  const lastDayOfMonth = new Date(cy, cm, 0).getDate();
  const monthDates = Array.from({ length: lastDayOfMonth }, (_, i) =>
    `${monthKey}-${String(i + 1).padStart(2, "0")}`
  );

  // Discrepancy count for the whole month
  const discrepancyCount = allEntries.reduce((n, e) => {
    const actual = actualRangeForDay(timePunches, e.staffId, e.date);
    if (!actual) return n + 1;
    const sd = Math.abs(minutesDiff(e.start, actual.start) || 0);
    const ed = Math.abs(minutesDiff(e.end, actual.end) || 0);
    return n + ((sd > 15 || ed > 15 || !actual.hasIn || !actual.hasOut) ? 1 : 0);
  }, 0);

  // Edit helpers
  const beginEdit = (half) => {
    const existing = half === "first" ? firstHalf : secondHalf;
    setEditEntries(existing ? [...existing.entries] : []);
    setEditHalf(half);
  };
  const cancelEdit = () => { setEditHalf(null); setEditEntries([]); };
  const saveEdits = () => {
    const periodStart = editHalf === "first" ? firstHalfStart : secondHalfStart;
    updateConfirmedShift(periodStart, editEntries);
    setEditHalf(null);
  };
  const updateEntry = (idx, patch) => setEditEntries((prev) => prev.map((e, i) => (i === idx ? { ...e, ...patch } : e)));
  const removeEntry = (idx) => setEditEntries((prev) => prev.filter((_, i) => i !== idx));
  const addEntry = (date, staffId) => {
    const member = staff.find((s) => s.id === staffId);
    if (!member) return;
    setEditEntries((prev) => [...prev, { date, staffId: member.id, staffName: member.name, start: "10:00", end: "19:00", note: "" }]);
  };

  const halfOfDate = (dk) => Number(dk.split("-")[2]) <= 15 ? "first" : "second";

  // Any shift at all?
  const hasAnyShift = confirmedShifts.length > 0;
  if (!hasAnyShift) {
    return <div className="rounded-xl px-4 py-6 text-center" style={{ background: C.surface, border: `1px dashed ${C.line}`, color: C.muted, fontSize: 13 }}>まだ確定シフトはありません</div>;
  }

  // Leading blanks for weekday alignment
  const firstDow = new Date(cy, cm - 1, 1).getDay();

  return (
    <div className="flex flex-col gap-3">
      {/* Month nav */}
      <div className="flex items-center gap-2">
        <button onClick={() => shiftMonth(-1)} className="press rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, color: C.paper }}>◀</button>
        <span style={{ flex: 1, textAlign: "center", fontFamily: FONT_MONO, fontSize: 15, fontWeight: 700 }}>
          {cy}年{cm}月
        </span>
        <button onClick={() => shiftMonth(1)} className="press rounded-lg px-3 py-2" style={{ background: C.surfaceAlt, color: C.paper }}>▶</button>
      </div>

      {/* status chips for both halves + edit buttons */}
      <div className="grid grid-cols-2 gap-2">
        <div className="rounded-lg p-2 flex items-center justify-between" style={{ background: C.surface, border: `1px solid ${firstHalf ? C.gold : C.line}` }}>
          <div>
            <div style={{ fontSize: 11, color: firstHalf ? C.gold : C.muted, fontWeight: 700 }}>前期 1〜15日</div>
            <div style={{ fontSize: 9, color: C.muted }}>
              {firstHalf ? `${firstHalf.entries.length}件` : "未発行"}
            </div>
          </div>
          {adminUnlocked && (
            editHalf === "first" ? (
              <div className="flex gap-1">
                <button onClick={cancelEdit} className="press rounded px-2 py-1" style={{ border: `1px solid ${C.line}`, color: C.muted, fontSize: 10 }}>×</button>
                <button onClick={saveEdits} className="press rounded px-2 py-1" style={{ background: C.mint, color: C.ink, fontSize: 10, fontWeight: 700 }}>保存</button>
              </div>
            ) : (
              <button onClick={() => beginEdit("first")} className="press rounded px-2 py-1" style={{ background: C.gold, color: C.ink, fontSize: 10, fontWeight: 700 }} disabled={editHalf !== null}>調整</button>
            )
          )}
        </div>
        <div className="rounded-lg p-2 flex items-center justify-between" style={{ background: C.surface, border: `1px solid ${secondHalf ? C.gold : C.line}` }}>
          <div>
            <div style={{ fontSize: 11, color: secondHalf ? C.gold : C.muted, fontWeight: 700 }}>後期 16〜{lastDayOfMonth}日</div>
            <div style={{ fontSize: 9, color: C.muted }}>
              {secondHalf ? `${secondHalf.entries.length}件` : "未発行"}
            </div>
          </div>
          {adminUnlocked && (
            editHalf === "second" ? (
              <div className="flex gap-1">
                <button onClick={cancelEdit} className="press rounded px-2 py-1" style={{ border: `1px solid ${C.line}`, color: C.muted, fontSize: 10 }}>×</button>
                <button onClick={saveEdits} className="press rounded px-2 py-1" style={{ background: C.mint, color: C.ink, fontSize: 10, fontWeight: 700 }}>保存</button>
              </div>
            ) : (
              <button onClick={() => beginEdit("second")} className="press rounded px-2 py-1" style={{ background: C.gold, color: C.ink, fontSize: 10, fontWeight: 700 }} disabled={editHalf !== null}>調整</button>
            )
          )}
        </div>
      </div>

      {discrepancyCount > 0 && (
        <div className="rounded-lg px-3 py-2 flex items-center gap-2" style={{ background: "rgba(226,105,79,0.12)", border: `1px solid ${C.coral}` }}>
          <span style={{ fontSize: 14 }}>⚠</span>
          <span style={{ fontSize: 11, color: C.coral, fontWeight: 700 }}>
            打刻との相違が {discrepancyCount} 件あります(15分以上のズレ、または欠勤・退勤未打刻)
          </span>
        </div>
      )}

      {/* Full month calendar grid */}
      <div className="grid grid-cols-7 gap-1" style={{ fontSize: 10 }}>
        {["日", "月", "火", "水", "木", "金", "土"].map((d) => (
          <div key={d} className="text-center py-1" style={{ color: C.muted, fontWeight: 700 }}>{d}</div>
        ))}
        {Array.from({ length: firstDow }, (_, i) => <div key={`blank-${i}`} />)}
        {monthDates.map((dk) => {
          const [, , d] = dk.split("-").map(Number);
          const dt = new Date(cy, cm - 1, d);
          const isSat = dt.getDay() === 6;
          const isSun = dt.getDay() === 0;
          const half = halfOfDate(dk);
          const inEditHalf = editHalf === half;
          const rows = entriesForDate(dk);
          return (
            <div key={dk} className="rounded-md p-1.5 flex flex-col gap-1" style={{ background: C.surface, border: `1px solid ${inEditHalf ? C.gold : C.line}`, minHeight: 70 }}>
              <div className="flex items-center justify-between">
                <span style={{ fontSize: 11, fontWeight: 700, color: isSat ? "#4A90C2" : isSun ? C.coral : C.paper }}>{d}</span>
                {inEditHalf && (
                  <select
                    onChange={(e) => { if (e.target.value) { addEntry(dk, e.target.value); e.target.value = ""; } }}
                    className="press"
                    style={{ fontSize: 8, background: C.surfaceAlt, color: C.gold, border: `1px solid ${C.line}`, borderRadius: 3, padding: "0 2px" }}
                    value=""
                  >
                    <option value="">+</option>
                    {staff.map((s) => <option key={s.id} value={s.id}>{s.name}</option>)}
                  </select>
                )}
              </div>
              {rows.length === 0 ? (
                <div style={{ color: C.muted, fontSize: 9 }}>—</div>
              ) : (
                rows.map((e) => {
                  const actual = actualRangeForDay(timePunches, e.staffId, e.date);
                  const sd = actual && actual.hasIn ? minutesDiff(e.start, actual.start) : null;
                  const ed = actual && actual.hasOut ? minutesDiff(e.end, actual.end) : null;
                  const warn = !actual || !actual.hasIn || !actual.hasOut || (sd != null && Math.abs(sd) > 15) || (ed != null && Math.abs(ed) > 15);
                  const approved = !!attendanceApprovals[`${e.staffId}_${e.date}`];
                  const origIdx = editEntries.indexOf(e);
                  return (
                    <div key={e.staffId + "-" + e.date} style={{ borderLeft: `2px solid ${warn ? C.coral : C.mint}`, paddingLeft: 3 }}>
                      <div style={{ fontSize: 9, fontWeight: 700, display: "flex", alignItems: "center", gap: 2 }}>
                        {warn && <span style={{ color: C.coral }}>⚠</span>}
                        {approved && <span style={{ color: C.mint }}>✓</span>}
                        <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.staffName}</span>
                      </div>
                      {inEditHalf ? (
                        <div className="flex items-center gap-0.5" style={{ fontSize: 9 }}>
                          <input type="time" value={e.start} onChange={(ev) => updateEntry(origIdx, { start: ev.target.value })} style={{ ...inputStyle, padding: "1px 2px", fontSize: 9, width: 54, fontFamily: FONT_MONO }} />
                          <input type="time" value={e.end} onChange={(ev) => updateEntry(origIdx, { end: ev.target.value })} style={{ ...inputStyle, padding: "1px 2px", fontSize: 9, width: 54, fontFamily: FONT_MONO }} />
                          <button onClick={() => removeEntry(origIdx)} style={{ color: C.coral, fontSize: 10, padding: "0 2px" }}>×</button>
                        </div>
                      ) : (
                        <div style={{ fontSize: 9, fontFamily: FONT_MONO, color: C.muted }}>
                          {e.start}-{e.end}
                        </div>
                      )}
                      {!inEditHalf && actual && (
                        <div style={{ fontSize: 8, fontFamily: FONT_MONO, color: warn ? C.coral : C.muted }}>
                          実: {actual.start}-{actual.end}
                        </div>
                      )}
                    </div>
                  );
                })
              )}
            </div>
          );
        })}
      </div>

      {/* Discrepancy details list */}
      {editHalf === null && (() => {
        const items = [];
        allEntries.forEach((e) => {
          const actual = actualRangeForDay(timePunches, e.staffId, e.date);
          const sd = actual && actual.hasIn ? minutesDiff(e.start, actual.start) : null;
          const ed = actual && actual.hasOut ? minutesDiff(e.end, actual.end) : null;
          const warn = !actual || !actual.hasIn || !actual.hasOut || (sd != null && Math.abs(sd) > 15) || (ed != null && Math.abs(ed) > 15);
          if (!warn) return;
          items.push({ e, actual, sd, ed });
        });
        if (items.length === 0) return null;
        return (
          <div className="flex flex-col gap-2 mt-2">
            <div style={{ fontSize: 12, color: C.muted, fontWeight: 700 }}>要確認(打刻との相違)</div>
            {items.map(({ e, actual, sd, ed }) => {
              const approved = !!attendanceApprovals[`${e.staffId}_${e.date}`];
              const sdLabel = (actual && actual.hasIn && sd != null) ? `${sd >= 0 ? "+" : ""}${sd}分` : "打刻なし";
              const edLabel = (actual && actual.hasOut && ed != null) ? `${ed >= 0 ? "+" : ""}${ed}分` : "打刻なし";
              return (
                <div key={e.staffId + e.date} className="rounded-lg p-2.5 flex flex-col gap-1" style={{ background: C.surface, border: `1px solid ${approved ? C.mint : C.coral}` }}>
                  <div className="flex items-center justify-between">
                    <div>
                      <div style={{ fontSize: 12, fontWeight: 700 }}>{e.staffName}・{fmtDateKey(e.date)}</div>
                      <div style={{ fontSize: 10, color: C.muted, fontFamily: FONT_MONO }}>
                        予定 {e.start}-{e.end} ・ 実 {actual ? `${actual.start}-${actual.end}` : "打刻なし"}
                      </div>
                      <div style={{ fontSize: 10, color: C.coral, fontFamily: FONT_MONO }}>
                        開始 {sdLabel} / 終了 {edLabel}
                      </div>
                    </div>
                    {adminUnlocked && (
                      approved ? (
                        <button onClick={() => unapproveAttendance(e.staffId, e.date)} className="press rounded-lg px-2.5 py-1" style={{ border: `1px solid ${C.mint}`, color: C.mint, fontSize: 11, fontWeight: 700 }}>承認済↩</button>
                      ) : (
                        <button onClick={() => approveAttendance(e.staffId, e.date)} className="press rounded-lg px-2.5 py-1" style={{ background: C.gold, color: C.ink, fontSize: 11, fontWeight: 700 }}>承認</button>
                      )
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        );
      })()}
    </div>
  );
}

  const [newPrice, setNewPrice] = useState("");
  const [newQty, setNewQty] = useState("1");
  const [newDate, setNewDate] = useState(todayKey());
  const [newCondition, setNewCondition] = useState("");
  const [newSerial, setNewSerial] = useState("");
  const [newMemo, setNewMemo] = useState("");

  const CONDITIONS = ["", "未開封", "良好", "良", "可", "ジャンク"];

  const submitAdd = () => {
    if (!newName.trim() || newPrice === "") return;
    addInventoryItem({
      name: newName.trim(),
      purchasePrice: Number(newPrice) || 0,
      qty: Number(newQty) || 1,
      purchaseDate: newDate,
      condition: newCondition,
      serial: newSerial.trim(),
      memo: newMemo.trim(),
    });
    setNewName("");
    setNewPrice("");
    setNewQty("1");
    setNewCondition("");
    setNewSerial("");
    setNewMemo("");
    setShowAdd(false);
  };

  // Filter
  const q = query.trim().toLowerCase();
  const filtered = inventory.filter((item) => {
    if (q) {
      const name = (item.name || "").toLowerCase();
      const serial = (item.serial || "").toLowerCase();
      const memo = (item.memo || "").toLowerCase();
      if (!name.includes(q) && !serial.includes(q) && !memo.includes(q)) return false;
    }
    const inStock = (Number(item.qty) || 0) > 0;
    if (filter === "inStock" && !inStock) return false;
    if (filter === "sold" && inStock) return false;
    return true;
  }).sort((a, b) => b.createdAt - a.createdAt);

  // overall stats
  const inStockItems = inventory.filter((i) => (Number(i.qty) || 0) > 0);
  const stockValue = inStockItems.reduce((a, i) => a + (Number(i.purchasePrice) || 0) * (Number(i.qty) || 0), 0);
  const totalProfit = inventory.reduce((a, i) => a + (i.sales || []).reduce((b, s) => b + Number(s.profit || 0), 0), 0);

  return (
    <div className="flex flex-col gap-3">
      {/* Summary */}
      <div className="grid grid-cols-3 gap-2">
        <div className="rounded-lg px-2 py-2 text-center" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div style={{ fontSize: 9, color: C.muted }}>在庫数</div>
          <div style={{ fontFamily: FONT_MONO, fontWeight: 700, color: C.paper, fontSize: 15 }}>{inStockItems.reduce((a, i) => a + Number(i.qty || 0), 0)}</div>
        </div>
        <div className="rounded-lg px-2 py-2 text-center" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div style={{ fontSize: 9, color: C.muted }}>在庫評価額</div>
          <div style={{ fontFamily: FONT_MONO, fontWeight: 700, color: C.gold, fontSize: 13 }}>{yen(stockValue)}</div>
        </div>
        <div className="rounded-lg px-2 py-2 text-center" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
          <div style={{ fontSize: 9, color: C.muted }}>累計利益</div>
          <div style={{ fontFamily: FONT_MONO, fontWeight: 700, color: totalProfit >= 0 ? C.mint : C.coral, fontSize: 13 }}>{yen(totalProfit)}</div>
        </div>
      </div>

      {/* Search */}
      <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="商品名・シリアル・メモで検索" style={{ ...inputStyle, fontFamily: FONT_BODY }} />
      <div className="flex gap-2">
        {[["inStock", "在庫あり"], ["sold", "売切れ"], ["all", "すべて"]].map(([k, l]) => (
          <button
            key={k}
            onClick={() => setFilter(k)}
            className="press flex-1 rounded-lg py-1.5"
            style={{ background: filter === k ? C.gold : C.surfaceAlt, color: filter === k ? C.ink : C.muted, fontSize: 11, fontWeight: 700 }}
          >
            {l}
          </button>
        ))}
      </div>

      {/* Add button / form */}
      {!showAdd ? (
        <button onClick={() => setShowAdd(true)} className="press rounded-xl py-2.5" style={{ background: C.gold, color: C.ink, fontWeight: 700, fontSize: 13 }}>
          ＋ 新規仕入れ登録
        </button>
      ) : (
        <div className="rounded-xl p-3 flex flex-col gap-2" style={{ background: C.surface, border: `1px solid ${C.gold}` }}>
          <div style={{ fontSize: 13, fontWeight: 700 }}>新規仕入れ</div>
          <div>
            <label style={labelStyle}>商品名 *</label>
            <input value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="例: リザードンex SR" style={{ ...inputStyle, fontFamily: FONT_BODY }} />
          </div>
          <div className="grid grid-cols-2 gap-2">
            <div>
              <label style={labelStyle}>買取金額(1個) *</label>
              <input type="number" value={newPrice} onChange={(e) => setNewPrice(e.target.value)} placeholder="¥" style={{ ...inputStyle, fontFamily: FONT_MONO }} />
            </div>
            <div>
              <label style={labelStyle}>数量</label>
              <input type="number" value={newQty} onChange={(e) => setNewQty(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_MONO }} />
            </div>
          </div>
          <div className="grid grid-cols-2 gap-2">
            <div>
              <label style={labelStyle}>買取日</label>
              <input type="date" value={newDate} onChange={(e) => setNewDate(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_MONO }} />
            </div>
            <div>
              <label style={labelStyle}>コンディション</label>
              <select value={newCondition} onChange={(e) => setNewCondition(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_BODY }}>
                {CONDITIONS.map((c) => <option key={c} value={c}>{c || "(未設定)"}</option>)}
              </select>
            </div>
          </div>
          <div>
            <label style={labelStyle}>シリアル番号・個体番号(任意)</label>
            <input value={newSerial} onChange={(e) => setNewSerial(e.target.value)} placeholder="例: 043/120 など" style={{ ...inputStyle, fontFamily: FONT_BODY }} />
          </div>
          <div>
            <label style={labelStyle}>メモ(任意)</label>
            <input value={newMemo} onChange={(e) => setNewMemo(e.target.value)} placeholder="仕入れ先・備考など" style={{ ...inputStyle, fontFamily: FONT_BODY }} />
          </div>
          <div className="flex gap-2">
            <button onClick={() => setShowAdd(false)} className="press flex-1 rounded-lg py-2" style={{ border: `1px solid ${C.line}`, color: C.paper, fontSize: 12 }}>キャンセル</button>
            <button onClick={submitAdd} className="press flex-1 rounded-lg py-2" style={{ background: C.gold, color: C.ink, fontSize: 13, fontWeight: 700 }}>登録</button>
          </div>
        </div>
      )}

      {/* Items list */}
      <div className="flex flex-col gap-2">
        {filtered.length === 0 ? (
          <div className="rounded-xl px-4 py-8 text-center" style={{ background: C.surface, border: `1px dashed ${C.line}`, color: C.muted, fontSize: 13 }}>
            {q ? "該当する商品がありません" : "まだ在庫がありません"}
          </div>
        ) : (
          filtered.map((item) => (
            <InventoryItemCard
              key={item.id}
              item={item}
              updateItem={(patch) => updateInventoryItem(item.id, patch)}
              deleteItem={() => deleteInventoryItem(item.id)}
              recordSale={(data) => recordSale(item.id, data)}
            />
          ))
        )}
      </div>
    </div>
  );
}

function InventoryItemCard({ item, updateItem, deleteItem, recordSale }) {
  const [expanded, setExpanded] = useState(false);
  const [editing, setEditing] = useState(false);
  const [sellMode, setSellMode] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);

  const [eName, setEName] = useState(item.name);
  const [ePrice, setEPrice] = useState(String(item.purchasePrice));
  const [eQty, setEQty] = useState(String(item.qty));
  const [eDate, setEDate] = useState(item.purchaseDate || "");
  const [eCondition, setECondition] = useState(item.condition || "");
  const [eSerial, setESerial] = useState(item.serial || "");
  const [eMemo, setEMemo] = useState(item.memo || "");

  const [sPrice, setSPrice] = useState("");
  const [sQty, setSQty] = useState("1");
  const [sDate, setSDate] = useState(todayKey());
  const [sTo, setSTo] = useState("");
  const [sNote, setSNote] = useState("");

  const qty = Number(item.qty) || 0;
  const inStock = qty > 0;
  const salesTotal = (item.sales || []).reduce((a, s) => a + Number(s.soldPrice || 0), 0);
  const profitTotal = (item.sales || []).reduce((a, s) => a + Number(s.profit || 0), 0);
  const soldQty = (item.sales || []).reduce((a, s) => a + Number(s.qty || 0), 0);

  const saveEdit = () => {
    updateItem({
      name: eName.trim(),
      purchasePrice: Number(ePrice) || 0,
      qty: Number(eQty) || 0,
      purchaseDate: eDate,
      condition: eCondition,
      serial: eSerial.trim(),
      memo: eMemo.trim(),
    });
    setEditing(false);
  };

  const doSale = () => {
    if (sPrice === "") return;
    const saleQty = Number(sQty) || 1;
    if (saleQty > qty) {
      alert(`在庫${qty}個を超えています`);
      return;
    }
    recordSale({ soldPrice: Number(sPrice) || 0, soldDate: sDate, soldTo: sTo, qty: saleQty, note: sNote });
    setSPrice("");
    setSQty("1");
    setSTo("");
    setSNote("");
    setSellMode(false);
  };

  const CONDITIONS = ["", "未開封", "良好", "良", "可", "ジャンク"];

  return (
    <div className="rounded-xl p-3 flex flex-col gap-2" style={{ background: C.surface, border: `1px solid ${inStock ? C.line : C.surfaceAlt2}`, opacity: inStock ? 1 : 0.65 }}>
      <button onClick={() => setExpanded(!expanded)} className="press text-left">
        <div className="flex items-start justify-between">
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 14, fontWeight: 700, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{item.name}</div>
            <div style={{ fontSize: 10, color: C.muted, fontFamily: FONT_MONO, marginTop: 2 }}>
              仕入 {yen(item.purchasePrice)} × {qty}個
              {item.condition && ` ・ ${item.condition}`}
              {item.purchaseDate && ` ・ ${item.purchaseDate}`}
            </div>
          </div>
          <div className="flex flex-col items-end" style={{ flexShrink: 0 }}>
            {inStock ? (
              <span style={{ fontSize: 11, fontWeight: 700, color: C.mint, border: `1px solid ${C.mint}`, borderRadius: 999, padding: "1px 8px" }}>在庫{qty}</span>
            ) : (
              <span style={{ fontSize: 11, fontWeight: 700, color: C.muted, border: `1px solid ${C.line}`, borderRadius: 999, padding: "1px 8px" }}>売切</span>
            )}
            {soldQty > 0 && (
              <span style={{ fontSize: 10, color: profitTotal >= 0 ? C.mint : C.coral, fontFamily: FONT_MONO, marginTop: 3 }}>
                利益 {profitTotal >= 0 ? "+" : ""}{yen(profitTotal)}
              </span>
            )}
          </div>
        </div>
      </button>

      {expanded && (
        <div className="flex flex-col gap-2 mt-1" style={{ borderTop: `1px dashed ${C.line}`, paddingTop: 8 }}>
          {!editing && !sellMode && (
            <>
              {item.serial && (
                <div style={{ fontSize: 11 }}><span style={{ color: C.muted }}>シリアル: </span><span style={{ fontFamily: FONT_MONO }}>{item.serial}</span></div>
              )}
              {item.memo && (
                <div style={{ fontSize: 11 }}><span style={{ color: C.muted }}>メモ: </span>{item.memo}</div>
              )}
              {(item.sales || []).length > 0 && (
                <div className="flex flex-col gap-1 mt-1">
                  <div style={{ fontSize: 11, color: C.muted, fontWeight: 700 }}>販売履歴</div>
                  {item.sales.map((s) => (
                    <div key={s.id} className="rounded-md px-2 py-1.5" style={{ background: C.surfaceAlt }}>
                      <div className="flex items-center justify-between">
                        <span style={{ fontSize: 11, fontFamily: FONT_MONO, color: C.muted }}>{s.soldDate || "-"} × {s.qty}個</span>
                        <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: C.gold, fontSize: 13 }}>{yen(s.soldPrice)}</span>
                      </div>
                      <div className="flex items-center justify-between">
                        <span style={{ fontSize: 10, color: C.muted }}>
                          {s.soldTo && `→ ${s.soldTo}`}
                          {s.note && ` ・ ${s.note}`}
                        </span>
                        <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: s.profit >= 0 ? C.mint : C.coral, fontSize: 11 }}>
                          利益 {s.profit >= 0 ? "+" : ""}{yen(s.profit)}
                        </span>
                      </div>
                    </div>
                  ))}
                </div>
              )}
              <div className="flex gap-2">
                {inStock && (
                  <button onClick={() => setSellMode(true)} className="press flex-1 rounded-lg py-2" style={{ background: C.mint, color: C.ink, fontSize: 12, fontWeight: 700 }}>販売を記録</button>
                )}
                <button onClick={() => setEditing(true)} className="press flex-1 rounded-lg py-2" style={{ border: `1px solid ${C.gold}`, color: C.gold, fontSize: 12, fontWeight: 700 }}>編集</button>
                {!confirmDel ? (
                  <button onClick={() => setConfirmDel(true)} className="press rounded-lg px-3 py-2" style={{ border: `1px solid ${C.line}`, color: C.coral, fontSize: 12 }}><Trash2 size={13} /></button>
                ) : (
                  <>
                    <button onClick={deleteItem} className="press rounded-lg px-3 py-2" style={{ background: C.coral, color: C.ink, fontSize: 11, fontWeight: 700 }}>削除</button>
                    <button onClick={() => setConfirmDel(false)} className="press rounded-lg px-2 py-2" style={{ border: `1px solid ${C.line}`, color: C.muted, fontSize: 11 }}>×</button>
                  </>
                )}
              </div>
            </>
          )}

          {editing && (
            <div className="flex flex-col gap-2">
              <input value={eName} onChange={(e) => setEName(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_BODY }} placeholder="商品名" />
              <div className="flex gap-2">
                <input type="number" value={ePrice} onChange={(e) => setEPrice(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1 }} placeholder="買取金額" />
                <input type="number" value={eQty} onChange={(e) => setEQty(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1 }} placeholder="数量" />
              </div>
              <div className="flex gap-2">
                <input type="date" value={eDate} onChange={(e) => setEDate(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_MONO, flex: 1 }} />
                <select value={eCondition} onChange={(e) => setECondition(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_BODY, flex: 1 }}>
                  {CONDITIONS.map((c) => <option key={c} value={c}>{c || "(未設定)"}</option>)}
                </select>
              </div>
              <input value={eSerial} onChange={(e) => setESerial(e.target.value)} placeholder="シリアル" style={{ ...inputStyle, fontFamily: FONT_BODY }} />
              <input value={eMemo} onChange={(e) => setEMemo(e.target.value)} placeholder="メモ" style={{ ...inputStyle, fontFamily: FONT_BODY }} />
              <div className="flex gap-2">
                <button onClick={() => setEditing(false)} className="press flex-1 rounded-lg py-2" style={{ border: `1px solid ${C.line}`, color: C.paper, fontSize: 12 }}>キャンセル</button>
                <button onClick={saveEdit} className="press flex-1 rounded-lg py-2" style={{ background: C.gold, color: C.ink, fontSize: 13, fontWeight: 700 }}>保存</button>
              </div>
            </div>
          )}

          {sellMode && (
            <div className="flex flex-col gap-2">
              <div style={{ fontSize: 12, fontWeight: 700, color: C.mint }}>販売を記録</div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label style={labelStyle}>販売金額 *</label>
                  <input type="number" value={sPrice} onChange={(e) => setSPrice(e.target.value)} placeholder="¥" style={{ ...inputStyle, fontFamily: FONT_MONO }} />
                </div>
                <div>
                  <label style={labelStyle}>数量(残り{qty})</label>
                  <input type="number" value={sQty} onChange={(e) => setSQty(e.target.value)} min="1" max={qty} style={{ ...inputStyle, fontFamily: FONT_MONO }} />
                </div>
              </div>
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label style={labelStyle}>販売日</label>
                  <input type="date" value={sDate} onChange={(e) => setSDate(e.target.value)} style={{ ...inputStyle, fontFamily: FONT_MONO }} />
                </div>
                <div>
                  <label style={labelStyle}>販売先(任意)</label>
                  <input value={sTo} onChange={(e) => setSTo(e.target.value)} placeholder="お客様名など" style={{ ...inputStyle, fontFamily: FONT_BODY }} />
                </div>
              </div>
              <input value={sNote} onChange={(e) => setSNote(e.target.value)} placeholder="メモ(任意)" style={{ ...inputStyle, fontFamily: FONT_BODY }} />
              {sPrice !== "" && (
                <div className="rounded-md px-2 py-1.5" style={{ background: C.surfaceAlt }}>
                  <div className="flex justify-between" style={{ fontSize: 11 }}>
                    <span style={{ color: C.muted }}>利益 (販売−仕入×数量)</span>
                    <span style={{ fontFamily: FONT_MONO, fontWeight: 700, color: (Number(sPrice) - Number(item.purchasePrice) * Number(sQty)) >= 0 ? C.mint : C.coral, fontSize: 13 }}>
                      {yen(Number(sPrice) - Number(item.purchasePrice) * Number(sQty))}
                    </span>
                  </div>
                </div>
              )}
              <div className="flex gap-2">
                <button onClick={() => setSellMode(false)} className="press flex-1 rounded-lg py-2" style={{ border: `1px solid ${C.line}`, color: C.paper, fontSize: 12 }}>キャンセル</button>
                <button onClick={doSale} className="press flex-1 rounded-lg py-2" style={{ background: C.mint, color: C.ink, fontSize: 13, fontWeight: 700 }}>販売を確定</button>
              </div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}
