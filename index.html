<script>
(function () {
  var PREFIX = "oripa_app::";

  function readAll() {
    try {
      var raw = window.localStorage.getItem(PREFIX + "__data");
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }
  function writeAll(obj) {
    try {
      window.localStorage.setItem(PREFIX + "__data", JSON.stringify(obj));
    } catch (e) {
      /* storage full or unavailable - ignore, data just won't persist */
    }
  }

  window.storage = {
    get: async function (key) {
      var all = readAll();
      if (!Object.prototype.hasOwnProperty.call(all, key)) return null;
      return { key: key, value: all[key], shared: false };
    },
    set: async function (key, value) {
      var all = readAll();
      all[key] = value;
      writeAll(all);
      return { key: key, value: value, shared: false };
    },
    delete: async function (key) {
      var all = readAll();
      delete all[key];
      writeAll(all);
      return { key: key, deleted: true, shared: false };
    },
  };
})();

// pure calc: real-time "design dashboard" numbers while building/editing an oripa
const RANK_KEYS = ["rainbow", "gold", "silver", "bronze", "other"];
function computeDesignStats(oripa) {
  const totalSlots = Number(oripa.totalSlots) || 0;
  const price = Number(oripa.price) || 0;
  const totalSales = totalSlots * price;
  const targetRate = Number(oripa.minGuarantee.targetRate) || 0;
  const targetTotal = totalSales * (targetRate / 100);

  const winCount = oripa.tiers.length;
  const hazureCount = Math.max(0, totalSlots - winCount);
  const normalPrizeTotal = oripa.tiers.reduce((a, t) => a + (Number(t.amount) || 0), 0);

  const guaranteeAmount = oripa.minGuarantee.enabled ? Number(oripa.minGuarantee.amount) || 0 : 0;
  const guaranteeSlots = oripa.minGuarantee.enabled ? (oripa.minGuarantee.applyToAll ? totalSlots : hazureCount) : 0;
  const guaranteeTotal = guaranteeSlots * guaranteeAmount;

  const lastOneAmount = oripa.lastOne.enabled ? Number(oripa.lastOne.amount) || 0 : 0;

  const currentTotal = normalPrizeTotal + guaranteeTotal + lastOneAmount;
  const currentRate = totalSales > 0 ? (currentTotal / totalSales) * 100 : null;
  const remaining = targetTotal - currentTotal;

  const winRate = totalSlots > 0 ? (winCount / totalSlots) * 100 : null;
  const winRatePer = winCount > 0 ? totalSlots / winCount : null;

  const byRank = {};
  RANK_KEYS.forEach((k) => (byRank[k] = { count: 0, amount: 0 }));
  oripa.tiers.forEach((t) => {
    const k = RANK_KEYS.includes(t.rank) ? t.rank : "other";
    byRank[k].count += 1;
    byRank[k].amount += Number(t.amount) || 0;
  });

  const tolerance = Math.max(price, targetTotal * 0.02, 1);
  const complete =
    totalSlots > 0 &&
    price > 0 &&
    targetRate > 0 &&
    Math.abs(remaining) <= tolerance &&
    winCount <= totalSlots &&
    (!oripa.lastOne.enabled || lastOneAmount > 0);

  return {
    totalSlots,
    price,
    totalSales,
    targetRate,
    targetTotal,
    winCount,
    hazureCount,
    normalPrizeTotal,
    guaranteeAmount,
    guaranteeSlots,
    guaranteeTotal,
    lastOneAmount,
    currentTotal,
    currentRate,
    remaining,
    winRate,
    winRatePer,
    byRank,
    complete,
  };
}

function groupTiers(tiers) {
  const map = new Map();
  for (const t of tiers) {
    const key = t.name + "__" + t.amount;
    if (!map.has(key)) map.set(key, { key, name: t.name, amount: Number(t.amount) || 0, count: 0, ids: [] });
    const g = map.get(key);
    g.count += 1;
    g.ids.push(t.id);
  }
  return Array.from(map.values()).sort((a, b) => b.amount - a.amount);
}

// ---------- bulk text import parser ----------
// Heuristic parser for pasted prize lists like the ones used throughout this app's setup.
// Always returns a preview for the person to check/edit before saving - never auto-commits.
function parseBulkOripaText(text) {
  const lines = text.split(/\r?\n/);
  const rankKeywords = [
    { re: /ラスト\s*ワン|ラスワン/, rank: "lastone" },
    { re: /虹/, rank: "rainbow" },
    { re: /金/, rank: "gold" },
    { re: /銀/, rank: "silver" },
    { re: /銅/, rank: "bronze" },
  ];
  let currentRank = null;
  const items = [];
  let detectedPrice = null;
  let detectedSlots = null;
  let detectedGuarantee = null;

  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;

    let m;
    if (!detectedPrice && (m = line.match(/1口[:：]?\s*([\d,]+)\s*円/))) {
      detectedPrice = Number(m[1].replace(/,/g, ""));
      continue;
    }
    if (!detectedPrice && (m = line.match(/(\d+)\s*万円オリパ/))) {
      detectedPrice = Number(m[1]) * 10000;
    }
    if (!detectedSlots && (m = line.match(/総口数[:：]?\s*(\d+)\s*口/))) {
      detectedSlots = Number(m[1]);
      continue;
    }
    if (!detectedGuarantee && (m = line.match(/(?:最低)?保証[:：]?\s*([\d,]+)\s*円/))) {
      detectedGuarantee = Number(m[1].replace(/,/g, ""));
      continue;
    }

    let matchedHeader = null;
    for (const rk of rankKeywords) {
      if (rk.re.test(line)) {
        matchedHeader = rk.rank;
        break;
      }
    }
    const looksLikeHeader = matchedHeader && (line.length < 15 || /枠|○|🏆|🌈|🥇|🥈|🥉|⚪/.test(line)) && !/[:：]?\s*[\d,]+\.?\d*\s*万?円?\s*(?:[×xX*]\s*\d+)?\s*$/.test(line);
    if (looksLikeHeader) {
      currentRank = matchedHeader;
      continue;
    }

    let itemLine = line.replace(/^[・•\-\*○◆▪]+\s*/, "");
    let count = 1;
    const countMatch = itemLine.match(/[×xX\*✕✖]\uFE0F?\s*(\d+)\s*個?\s*$/);
    if (countMatch) {
      count = Number(countMatch[1]);
      itemLine = itemLine.slice(0, countMatch.index).trim();
    }

    let name = null;
    let priceStr = null;
    if (itemLine.includes("\t")) {
      const parts = itemLine.split("\t").map((s) => s.trim()).filter(Boolean);
      if (parts.length >= 2) {
        name = parts[0];
        priceStr = parts[parts.length - 1];
      }
    } else if (itemLine.includes("：") || itemLine.includes(":")) {
      const idx = Math.max(itemLine.lastIndexOf("："), itemLine.lastIndexOf(":"));
      name = itemLine.slice(0, idx).trim();
      priceStr = itemLine.slice(idx + 1).trim();
    } else {
      const parts = itemLine.trim().split(/\s+/);
      if (parts.length >= 2) {
        priceStr = parts[parts.length - 1];
        name = parts.slice(0, -1).join(" ");
      } else {
        // no separator at all, e.g. "メガドリ1.4万" or "メガドリ1.4" - split at the trailing price-looking chunk
        const m = itemLine.match(/^(.*?)([\d,]+\.?\d*\s*(?:万円|万|円)?)\s*$/);
        if (m && m[1].trim() && m[2].trim()) {
          name = m[1].trim();
          priceStr = m[2].trim();
        }
      }
    }
    if (!name || !priceStr) continue;

    // detect foreign price after a "（" or "(" bracket, e.g. "29（28" or "20 (19"
    // the number after the bracket is the foreign-only price. bracket without closing paren OK.
    let foreignPriceStr = null;
    const bracketIdx = priceStr.search(/[（(]/);
    if (bracketIdx >= 0) {
      foreignPriceStr = priceStr.slice(bracketIdx + 1).trim();
      priceStr = priceStr.slice(0, bracketIdx).trim();
    }

    const parseAmt = (s) => {
      if (!s) return null;
      const manMatch = s.match(/([\d,]+\.?\d*)\s*万/);
      const yenMatch = s.match(/([\d,]+)\s*円/);
      const plainMatch = s.match(/([\d,]+\.?\d*)/);
      let a = null;
      if (manMatch) a = Math.round(parseFloat(manMatch[1].replace(/,/g, "")) * 10000);
      else if (yenMatch) a = Number(yenMatch[1].replace(/,/g, ""));
      else if (plainMatch) {
        const v = parseFloat(plainMatch[1].replace(/,/g, ""));
        a = v < 1000 ? Math.round(v * 10000) : Math.round(v);
      }
      return a != null && !isNaN(a) ? a : null;
    };

    const amount = parseAmt(priceStr);
    const amountForeign = parseAmt(foreignPriceStr);
    if (amount == null || !name) continue;

    items.push({
      id: uid(),
      name,
      amount,
      amountForeign, // null when no bracket - falls back to amount at runtime
      count,
      rank: currentRank && currentRank !== "lastone" ? currentRank : null,
      isLastOne: currentRank === "lastone",
    });
  }

  return { items, detectedPrice, detectedSlots, detectedGuarantee };
}

// pure calc: totals for a slice of log entries (used for customer session AND store all-time totals)
// guaranteeAmount: the per-card minimum guarantee payout for this oripa (0 if disabled)
function computeTotals(logSlice, guaranteeAmount = 0) {
  const draws = logSlice.filter((e) => e.type === "draw");
  const wins = logSlice.filter((e) => e.type === "win");
  const totalSpent = draws.reduce((a, e) => a + e.cost, 0);
  const totalWinAmount = wins.reduce((a, e) => a + e.amount, 0);

  // every draw that isn't a named win is assumed to be a "hazure" card, and by default
  // everyone trades it in for the guaranteed amount - unless marked otherwise below.
  const hazureTotalCount = Math.max(0, draws.length - wins.length);
  const adjustments = logSlice.filter((e) => e.type === "hazureNotRedeemed");
  const lastAdjustment = adjustments.length ? adjustments[adjustments.length - 1] : null;
  const hazureNotRedeemedCount = lastAdjustment ? Math.min(hazureTotalCount, Math.max(0, Number(lastAdjustment.count) || 0)) : 0;
  const hazureRedeemedCount = Math.max(0, hazureTotalCount - hazureNotRedeemedCount);
  const totalHazureAmount = hazureRedeemedCount * guaranteeAmount;

  const totalPayout = totalWinAmount + totalHazureAmount;
  return {
    drawCount: draws.length,
    winCount: wins.length,
    hazureTotalCount,
    hazureNotRedeemedCount,
    hazureRedeemedCount,
    totalSpent,
    totalWinAmount,
    totalHazureAmount,
    totalPayout,
    diff: totalPayout - totalSpent, // customer-facing profit/loss
    shopProfit: totalSpent - totalPayout, // store-facing profit
    recoveryRate: totalSpent > 0 ? (totalPayout / totalSpent) * 100 : null, // 回収率
  };
}

// pure calc: shared physical box state (always full log, never customer-scoped)
function computeBoxState(fullLog, oripa) {
  const consumedTierIds = new Set(fullLog.filter((e) => e.type === "win" && e.tierId).map((e) => e.tierId));
  const remainingTiers = oripa.tiers.filter((t) => !consumedTierIds.has(t.id));
  const totalSlots = Number(oripa.totalSlots) || 0;
  const drawCountAll = fullLog.filter((e) => e.type === "draw").length;
  const remainingSlots = Math.max(0, totalSlots - drawCountAll);
  const lastOneAwarded = fullLog.some((e) => e.isLastOne);
  const remainingPrizeAmount = remainingTiers.reduce((a, t) => a + Number(t.amount || 0), 0);
  const lastOneRemainingValue = oripa.lastOne.enabled && !lastOneAwarded && totalSlots > 0 ? Number(oripa.lastOne.amount) || 0 : 0;
  const insertionRate = remainingSlots > 0 ? (remainingPrizeAmount + lastOneRemainingValue) / remainingSlots : null;
  const remainingHazureCount = Math.max(0, remainingSlots - remainingTiers.length);
  const remainingCost = remainingSlots * (Number(oripa.price) || 0);
  const configuredRate = totalSlots ? (oripa.tiers.length / totalSlots) * 100 : null;
  return {
    consumedTierIds,
    remainingTiers,
    remainingSlots,
    lastOneAwarded,
    remainingPrizeAmount,
    lastOneRemainingValue,
    insertionRate,
    remainingHazureCount,
    remainingCost,
    drawCountAll,
    configuredRate,
  };
}

// ---------- date helpers ----------
function haversineMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

// Return biweekly period start (Monday) covering the given date, anchored at 2024-01-01 (Monday).
function biweeklyPeriodStart(dateKey) {
  const anchor = new Date("2024-01-01T00:00:00");
  const [y, m, d] = dateKey.split("-").map(Number);
  const target = new Date(y, m - 1, d);
  const daysSinceAnchor = Math.floor((target - anchor) / 86400000);
  const periodIndex = Math.floor(daysSinceAnchor / 14);
  const start = new Date(anchor.getTime() + periodIndex * 14 * 86400000);
  return dateKeyOf(start.getTime());
}
function addDays(dateKey, n) {
  const [y, m, d] = dateKey.split("-").map(Number);
  const t = new Date(y, m - 1, d);
  t.setDate(t.getDate() + n);
  return dateKeyOf(t.getTime());
}
function biweeklyDates(periodStart) {
  return Array.from({ length: 14 }, (_, i) => addDays(periodStart, i));
}
function fmtDateKey(dateKey) {
  const [y, m, d] = dateKey.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const dow = ["日", "月", "火", "水", "木", "金", "土"][dt.getDay()];
  return `${m}/${d}(${dow})`;
}

// Compute per-staff monthly work hours & payroll from time punches for a given YYYY-MM
function computePayrollForMonth(monthKey, punches, staff, comp) {
  const inMonth = punches.filter((p) => monthKeyOf(dateKeyOf(p.ts)) === monthKey);
  const byStaff = {};
  inMonth.forEach((p) => {
    if (!byStaff[p.staffId]) byStaff[p.staffId] = [];
    byStaff[p.staffId].push(p);
  });
  const result = [];
  Object.entries(byStaff).forEach(([staffId, list]) => {
    const member = staff.find((s) => s.id === staffId);
    const name = member ? member.name : (list[0] && list[0].staffName) || "-";
    // Pair in->out per staff, chronologically
    const sorted = [...list].sort((a, b) => a.ts - b.ts);
    let hoursMs = 0;
    let lastIn = null;
    const workDates = new Set();
    sorted.forEach((p) => {
      if (p.type === "in") {
        lastIn = p.ts;
        workDates.add(dateKeyOf(p.ts));
      } else if (p.type === "out" && lastIn) {
        hoursMs += p.ts - lastIn;
        lastIn = null;
      }
    });
    const hours = hoursMs / 3600000;
    const c = comp[staffId] || { hourlyWage: 0, commutePerDay: 0 };
    const wage = hours * (Number(c.hourlyWage) || 0);
    const commute = workDates.size * (Number(c.commutePerDay) || 0);
    result.push({
      staffId, name, hours, workDays: workDates.size,
      hourlyWage: Number(c.hourlyWage) || 0,
      commutePerDay: Number(c.commutePerDay) || 0,
      wage, commute, total: wage + commute,
    });
  });
  return result.sort((a, b) => b.total - a.total);
}

// aggregate expenses for a given month, plus generated payroll totals
function computeMonthlyFinance(monthKey, oripaList, logsById, sessions, expenses, punches, staff, comp) {
  // sales: sum daily sales for the month
  let sales = 0, payout = 0, slotsCount = 0;
  const daysInMonth = new Set();
  // iterate through all logs, filter to month
  oripaList.forEach((o) => {
    const log = logsById[o.id] || [];
    log.forEach((e) => {
      const dk = dateKeyOf(e.ts);
      if (monthKeyOf(dk) !== monthKey) return;
      daysInMonth.add(dk);
    });
  });
  daysInMonth.forEach((dk) => {
    const s = computeDailyStats(dk, oripaList, logsById, sessions);
    sales += s.totalSales;
    payout += s.totalPayout;
    slotsCount += s.totalSlots;
  });
  const grossProfit = sales - payout;

  const payroll = computePayrollForMonth(monthKey, punches, staff, comp);
  const payrollTotal = payroll.reduce((a, p) => a + p.total, 0);

  const monthExpenses = expenses.filter((e) => monthKeyOf(e.date) === monthKey);
  const expensesByCat = {};
  monthExpenses.forEach((e) => {
    const k = e.category || "その他";
    expensesByCat[k] = (expensesByCat[k] || 0) + Number(e.amount || 0);
  });
  const otherExpensesTotal = monthExpenses.reduce((a, e) => a + Number(e.amount || 0), 0);
  const netProfit = grossProfit - payrollTotal - otherExpensesTotal;

  return {
    monthKey,
    sales, payout, grossProfit,
    payroll, payrollTotal,
    monthExpenses, expensesByCat, otherExpensesTotal,
    netProfit,
    slotsCount,
  };
}

function dateKeyOf(ts) {
  const d = new Date(ts);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function todayKey() {
  return dateKeyOf(Date.now());
}
function monthKeyOf(dateKey) {
  return dateKey.slice(0, 7);
}

// ---------- daily store aggregation (across all oripa, all customers) ----------
function computeDailyStats(dateKey, oripaList, logsById, sessions) {
  const byOripa = [];
  let totalSales = 0,
    totalSlots = 0,
    totalPayout = 0;

  oripaList.forEach((o) => {
    const log = logsById[o.id] || [];
    const dayLog = log.filter((e) => dateKeyOf(e.ts) === dateKey);
    const guaranteeAmount = o.minGuarantee.enabled ? Number(o.minGuarantee.amount) || 0 : 0;
    const totals = computeTotals(dayLog, guaranteeAmount);
    if (totals.drawCount > 0 || totals.totalPayout > 0) {
      byOripa.push({ oripaId: o.id, name: o.name, sales: totals.totalSpent, slots: totals.drawCount, payout: totals.totalPayout });
    }
    totalSales += totals.totalSpent;
    totalSlots += totals.drawCount;
    totalPayout += totals.totalPayout;
  });

  const visitorCount = sessions.filter((s) => dateKeyOf(s.startTs) === dateKey).length;
  const grossProfit = totalSales - totalPayout;
  const actualRate = totalSales > 0 ? (totalPayout / totalSales) * 100 : null;

  return { dateKey, totalSales, totalSlots, totalPayout, grossProfit, actualRate, visitorCount, byOripa };
}

// ---------- customer lifetime aggregation ----------
function computeCustomerLifetime(customer, sessions, oripaList, logsById) {
  const mySessions = sessions.filter((s) => s.customerId === customer.id);
  const oripaById = {};
  oripaList.forEach((o) => (oripaById[o.id] = o));

  let totalSpent = 0,
    totalPayout = 0;
  let bestDiff = null,
    worstDiff = null;
  const history = [];

  mySessions
    .slice()
    .sort((a, b) => b.startTs - a.startTs)
    .forEach((s) => {
      const oripa = oripaById[s.oripaId];
      const log = (logsById[s.oripaId] || []).filter((e) => e.sessionId === s.id);
      const guaranteeAmount = oripa && oripa.minGuarantee.enabled ? Number(oripa.minGuarantee.amount) || 0 : 0;
      const totals = computeTotals(log, guaranteeAmount);
      totalSpent += totals.totalSpent;
      totalPayout += totals.totalPayout;
      if (bestDiff === null || totals.diff > bestDiff) bestDiff = totals.diff;
      if (worstDiff === null || totals.diff < worstDiff) worstDiff = totals.diff;
      history.push({ session: s, oripaName: s.oripaName, totals });
    });

  return {
    totalSpent,
    totalPayout,
    diff: totalPayout - totalSpent,
    recoveryRate: totalSpent > 0 ? (totalPayout / totalSpent) * 100 : null,
    visitCount: mySessions.length,
    totalSlots: history.reduce((a, h) => a + h.totals.drawCount, 0),
    bestDiff,
    worstDiff,
    history,
  };
}

function remainingRateRows(remainingTiers, remainingSlots, oripa, lastOneAwarded) {
  const rows = groupTiers(remainingTiers).map((g) => ({
    ...g,
    countLabel: remainingSlots ? `${g.count}/${remainingSlots}` : `${g.count}口`,
  }));
  if (oripa.lastOne.enabled && !lastOneAwarded && Number(oripa.totalSlots) > 0) {
    rows.push({
      name: oripa.lastOne.name || "ラストワン賞",
      amount: oripa.lastOne.amount,
      count: 1,
      countLabel: remainingSlots ? `1/${remainingSlots}` : "1口",
      special: "lastone",
    });
  }
  const remHazure = Math.max(0, remainingSlots - remainingTiers.length);
  rows.push({
    name: "はずれ(最低保証)",
    amount: oripa.minGuarantee.enabled ? oripa.minGuarantee.amount : 0,
    count: remHazure,
    countLabel: remainingSlots ? `${remHazure}/${remainingSlots}` : `${remHazure}口`,
    special: "hazure",
  });
  return rows;
}

function configuredRateRows(oripa) {
  const totalSlots = Number(oripa.totalSlots) || 0;
  const rows = groupTiers(oripa.tiers).map((g) => ({
    ...g,
    countLabel: totalSlots ? `${g.count}/${totalSlots}` : `${g.count}口`,
  }));
  if (oripa.lastOne.enabled) {
    rows.push({
      name: oripa.lastOne.name || "ラストワン賞",
      amount: oripa.lastOne.amount,
      count: 1,
      countLabel: totalSlots ? `1/${totalSlots}` : "1口",
      special: "lastone",
    });
  }
  const hazureCount = Math.max(0, totalSlots - oripa.tiers.length);
  rows.push({
    name: "はずれ(最低保証)",
    amount: oripa.minGuarantee.enabled ? oripa.minGuarantee.amount : 0,
    count: hazureCount,
    countLabel: totalSlots ? `${hazureCount}/${totalSlots}` : `${hazureCount}口`,
    special: "hazure",
  });
  return rows;
}

// ---------- probability / EV helpers ----------
const RANK_LABEL = { rainbow: "虹", gold: "金", silver: "銀", bronze: "銅", other: "他" };
const RANK_ORDER = ["rainbow", "gold", "silver", "bronze"];

// exact P(at least one of a category of size K appears in N draws from a pool of R), no replacement
function probAtLeastOne(R, K, N) {
  if (K <= 0 || N <= 0 || R <= 0) return 0;
  const n = Math.min(N, R);
  if (n > R - K) return 1;
  let p = 1;
  for (let i = 0; i < n; i++) p *= (R - K - i) / (R - i);
  return 1 - p;
}

// Monte Carlo: probability that buying N of the remaining slots nets a profit (payout > cost)
function simulateProfitProbability(remainingTiers, remainingHazureCount, hazureAmount, lastOneRemainingValue, N, price, trials = 2500) {
  const pool = remainingTiers.map((t) => Number(t.amount) || 0);
  for (let i = 0; i < remainingHazureCount; i++) pool.push(hazureAmount);
  const R = pool.length;
  const n = Math.min(N, R);
  if (R === 0 || n === 0) return 0;
  const cost = n * price;
  let profitCount = 0;
  for (let t = 0; t < trials; t++) {
    const idx = Array.from({ length: R }, (_, i) => i);
    let sum = 0;
    let lastSlotSelected = false;
    const lastSlotPos = lastOneRemainingValue > 0 ? Math.floor(Math.random() * R) : -1;
    for (let i = 0; i < n; i++) {
      const j = i + Math.floor(Math.random() * (R - i));
      [idx[i], idx[j]] = [idx[j], idx[i]];
      sum += pool[idx[i]];
      if (idx[i] === lastSlotPos) lastSlotSelected = true;
    }
    if (lastSlotSelected) sum += lastOneRemainingValue;
    if (sum > cost) profitCount++;
  }
  return profitCount / trials;
}

  // ---- initial load ----

      try {
        const r = await window.storage.get("oripa:sessionStarts", true);

      } catch (e) {}
      try {

        if (r && r.value) setCustomers(JSON.parse(r.value));
      } catch (e) {}

        const r = await window.storage.get("oripa:sessions", true);

  const fetchLog = useCallback(async (id) => {

    }

  const ensureLogLoaded = useCallback(
    async (id) => {

      const log = await fetchLog(id);
      setLogsById((prev) => ({ ...prev, [id]: log }));
    },
    [logsById, fetchLog]
  );

  // load log for the active customer oripa
  useEffect(() => {
    if (activeOripaId) ensureLogLoaded(activeOripaId);
  }, [activeOripaId, ensureLogLoaded]);

  // live sync: several customers may draw the same oripa together on different phones
  useEffect(() => {
    if (!activeOripaId) return;
    const poll = async () => {
      try {
        const [logRes, sessRes] = await Promise.all([
          window.storage.get(`oripa:log:${activeOripaId}`, true),
          window.storage.get("oripa:sessionStarts", true),
        ]);
        if (logRes) setLogsById((prev) => ({ ...prev, [activeOripaId]: logRes.value ? JSON.parse(logRes.value) : [] }));
        if (sessRes && sessRes.value) setSessionStarts(JSON.parse(sessRes.value));
      } catch (e) {}
    };
    const interval = setInterval(poll, 4000);
    return () => clearInterval(interval);
  }, [activeOripaId]);

  // load all logs for the oripa list and for store-wide / active-customer views
  useEffect(() => {
    const storeNeedsAllLogs = ["aggregate", "customers", "daily"].includes(storeSubTab);
    if (navTab === "active" || (navTab === "store" && storeUnlocked && storeNeedsAllLogs)) {
      oripaList.forEach((o) => ensureLogLoaded(o.id));
    }
  }, [navTab, activeOripaId, storeUnlocked, storeSubTab, oripaList, ensureLogLoaded]);

  const saveOripaList = (list) => {
    setOripaList(list);
    window.storage.set("oripa:list", JSON.stringify(list), true).catch(() => {});
  };
  const saveSessionStarts = (obj) => {
    setSessionStarts(obj);
    window.storage.set("oripa:sessionStarts", JSON.stringify(obj), true).catch(() => {});
  };
  const appendLog = (id, entries) => {
    const newLog = [...(logsById[id] || []), ...entries];
    setLogsById((prev) => ({ ...prev, [id]: newLog }));
    window.storage.set(`oripa:log:${id}`, JSON.stringify(newLog), true).catch(() => {});
  };
  const deleteLogEntry = (id, entryId) => {
    const newLog = (logsById[id] || []).filter((e) => e.id !== entryId);
    setLogsById((prev) => ({ ...prev, [id]: newLog }));
    window.storage.set(`oripa:log:${id}`, JSON.stringify(newLog), true).catch(() => {});
  };
  const clearLog = (id) => {
    setLogsById((prev) => ({ ...prev, [id]: [] }));
    window.storage.set(`oripa:log:${id}`, JSON.stringify([]), true).catch(() => {});
  };

  const fireStamp = (type) => {
    setStamp(type);
    setTimeout(() => setStamp(null), 1100);
  };

  const recordDraw = (oripa) => {
    const fullLog = logsById[oripa.id] || [];
    const currentDraws = fullLog.filter((e) => e.type === "draw").length;
    const totalSlots = Number(oripa.totalSlots) || 0;
    if (totalSlots > 0 && currentDraws >= totalSlots) return; // sold out
    const newDraws = currentDraws + 1;
    const lastOneAwarded = fullLog.some((e) => e.isLastOne);
    const entries = [{ id: uid(), type: "draw", ts: Date.now(), cost: Number(oripa.price) || 0 }];
    let awardLastOne = false;
    if (oripa.lastOne.enabled && totalSlots > 0 && newDraws === totalSlots && !lastOneAwarded) {
      entries.push({
        id: uid(),
        type: "win",
        ts: Date.now() + 1,
        name: oripa.lastOne.name || "ラストワン賞",
        amount: Number(oripa.lastOne.amount) || 0,
        isLastOne: true,
      });
      awardLastOne = true;
    }
    appendLog(oripa.id, entries);
    if (awardLastOne) fireStamp("lastone");
  };
  const recordWin = (oripa, tier) => {
    appendLog(oripa.id, [{ id: uid(), type: "win", ts: Date.now(), name: tier.name, amount: Number(tier.amount) || 0, tierId: tier.id }]);
    fireStamp("win");
  };
  const setHazureNotRedeemed = (oripa, count) => {
    appendLog(oripa.id, [{ id: uid(), type: "hazureNotRedeemed", ts: Date.now(), count: Number(count) || 0 }]);
  };
  const undoLast = (id) => {
    const fullLog = logsById[id] || [];
    if (!fullLog.length) return;
    const newLog = fullLog.slice(0, -1);
    setLogsById((prev) => ({ ...prev, [id]: newLog }));
    window.storage.set(`oripa:log:${id}`, JSON.stringify(newLog), true).catch(() => {});
  };
  const nextCustomer = (id) => {
    saveSessionStarts({ ...sessionStarts, [id]: Date.now() });
  };

  // ---- oripa list management ----
  const addOripa = () => {
    if (oripaList.length >= MAX_ORIPA) return;
    const o = newOripa(oripaList.length + 1);
    saveOripaList([...oripaList, o]);
    setLogsById((prev) => ({ ...prev, [o.id]: [] }));
    window.storage.set(`oripa:log:${o.id}`, JSON.stringify([]), true).catch(() => {});
  };
  const updateOripa = (id, updater) => {
    saveOripaList(oripaList.map((o) => (o.id === id ? updater(o) : o)));
  };
  const deleteOripa = (id) => {
    saveOripaList(oripaList.filter((o) => o.id !== id));
    window.storage.delete(`oripa:log:${id}`, true).catch(() => {});
    if (activeOripaId === id) setActiveOripaId(null);
  };

  const activeOripa = oripaList.find((o) => o.id === activeOripaId) || null;

  // ---- 営業中のお客様管理 (staff-operated concurrent customer tracking) ----
  const saveCustomers = (list) => {
    setCustomers(list);
    window.storage.set("oripa:customers", JSON.stringify(list), true).catch(() => {});
  };
  const saveSessions = (list) => {
    setSessions(list);
    window.storage.set("oripa:sessions", JSON.stringify(list), true).catch(() => {});
  };
  const saveSettlements = (list) => {
    setSettlements(list);
    window.storage.set("oripa:settlements", JSON.stringify(list), true).catch(() => {});
  };

  const updateCustomer = (id, updater) => {
    const nextList = customers.map((c) => (c.id === id ? { ...c, ...updater(c) } : c));
    saveCustomers(nextList);
    // also keep denormalized name on their sessions in sync when name changes
    const updated = nextList.find((c) => c.id === id);
    if (updated) {
      const nextSessions = sessions.map((s) => (s.customerId === id ? { ...s, customerName: updated.name } : s));
      if (nextSessions.some((s, i) => s !== sessions[i])) saveSessions(nextSessions);
    }
  };
  const deleteCustomer = (id) => {
    saveCustomers(customers.filter((c) => c.id !== id));
    // orphan sessions keep their historical customerName; don't delete them.
  };

  // ---- shift / timeclock ----
  const saveStaff = (list) => { setStaff(list); window.storage.set("oripa:staff", JSON.stringify(list), true).catch(() => {}); };
  const saveShiftRequests = (list) => { setShiftRequests(list); window.storage.set("oripa:shiftRequests", JSON.stringify(list), true).catch(() => {}); };
  const saveConfirmedShifts = (list) => { setConfirmedShifts(list); window.storage.set("oripa:confirmedShifts", JSON.stringify(list), true).catch(() => {}); };
  const saveTimePunches = (list) => { setTimePunches(list); window.storage.set("oripa:timePunches", JSON.stringify(list), true).catch(() => {}); };

    // type: 'in' | 'out'

      saveTimePunches([...timePunches, record]);
    };
    if (!storeGeo.enabled || storeGeo.lat == null || storeGeo.lng == null) {
      // no geofence -> allow punch, no coords
      doSave(null, null);
      return { ok: true };
    }
    try {
      const pos = await new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error("位置情報が使えません"));
        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 });
      });
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const dist = haversineMeters(lat, lng, storeGeo.lat, storeGeo.lng);
      if (dist > (Number(storeGeo.radiusM) || 100)) {
        return { ok: false, reason: `店舗から約${Math.round(dist)}m離れています` };
      }
      doSave(lat, lng);
      return { ok: true };
    } catch (e) {
      return { ok: false, reason: "位置情報の取得に失敗しました" };
    }
  };
  const managerPunch = (staffMember, type, ts) => {
    const record = { id: uid(), staffId: staffMember.id, staffName: staffMember.name, type, ts: ts || Date.now(), lat: null, lng: null, byManager: true };
    saveTimePunches([...timePunches, record]);
  };
  const deletePunch = (id) => saveTimePunches(timePunches.filter((p) => p.id !== id));

  // ---- buyback ----
  const saveBuyback = (list) => { setBuybackItems(list); window.storage.set("oripa:buyback", JSON.stringify(list), true).catch(() => {}); };
  const addBuybackItem = (category, name, price) => {
    saveBuyback([...buybackItems, { id: uid(), category, name: name.trim(), price: Number(price) || 0, updatedAt: Date.now() }]);
  };
  const updateBuybackItem = (id, patch) => saveBuyback(buybackItems.map((i) => (i.id === id ? { ...i, ...patch, updatedAt: Date.now() } : i)));
  const deleteBuybackItem = (id) => saveBuyback(buybackItems.filter((i) => i.id !== id));

  // ---- expenses & staff comp (admin only) ----
  const saveExpenses = (list) => { setExpenses(list); window.storage.set("oripa:expenses", JSON.stringify(list), true).catch(() => {}); };
  const saveStaffCompensation = (obj) => { setStaffCompensation(obj); window.storage.set("oripa:staffCompensation", JSON.stringify(obj), true).catch(() => {}); };

  const addExpense = (date, category, memo, amount) => {
    saveExpenses([...expenses, { id: uid(), date, category, memo: memo || "", amount: Number(amount) || 0, createdAt: Date.now() }]);
  };
  const updateExpense = (id, patch) => saveExpenses(expenses.map((e) => (e.id === id ? { ...e, ...patch } : e)));
  const deleteExpense = (id) => saveExpenses(expenses.filter((e) => e.id !== id));
  const setStaffPay = (staffId, hourlyWage, commutePerDay) => {
    saveStaffCompensation({ ...staffCompensation, [staffId]: { hourlyWage: Number(hourlyWage) || 0, commutePerDay: Number(commutePerDay) || 0 } });
  };

  const startSession = (customerName, oripaId, isForeign, showDetails) => {
    const trimmed = (customerName || "").trim();
    if (!trimmed || !oripaId) return;
    const oripa = oripaList.find((o) => o.id === oripaId);
    if (!oripa) return;
    const now = Date.now();
    let customer = customers.find((c) => c.name === trimmed);
    let newCustomers;
    if (customer) {
      customer = { ...customer, lastVisitTs: now, visitCount: (customer.visitCount || 0) + 1 };
      newCustomers = customers.map((c) => (c.id === customer.id ? customer : c));
    } else {
      customer = { id: uid(), name: trimmed, firstVisitTs: now, lastVisitTs: now, visitCount: 1 };
      newCustomers = [...customers, customer];
    }
    saveCustomers(newCustomers);
    const session = {
      id: uid(),
      customerId: customer.id,
      customerName: customer.name,
      oripaId: oripa.id,
      oripaName: oripa.name,
      isForeign: !!isForeign,
      showDetails: !!showDetails,
      startTs: now,
      endTs: null,
    };
    saveSessions([...sessions, session]);
    ensureLogLoaded(oripa.id);
  };
  const endSession = (sessionId) => {
    saveSessions(sessions.map((s) => (s.id === sessionId ? { ...s, endTs: Date.now() } : s)));
  };
  const reopenSession = (sessionId) => {
    saveSessions(sessions.map((s) => (s.id === sessionId ? { ...s, endTs: null } : s)));
  };

  const recordSessionDraw = (session) => {
    const oripa = oripaList.find((o) => o.id === session.oripaId);
    if (!oripa) return;
    const fullLog = logsById[oripa.id] || [];
    const currentDraws = fullLog.filter((e) => e.type === "draw").length;
    const totalSlots = Number(oripa.totalSlots) || 0;
    if (totalSlots > 0 && currentDraws >= totalSlots) return; // sold out
    const newDraws = currentDraws + 1;
    const lastOneAwarded = fullLog.some((e) => e.isLastOne);
    const entries = [{ id: uid(), type: "draw", ts: Date.now(), cost: Number(oripa.price) || 0, sessionId: session.id }];
    let awardLastOne = false;
    if (oripa.lastOne.enabled && totalSlots > 0 && newDraws === totalSlots && !lastOneAwarded) {
      const lastOneAmount = session.isForeign && oripa.lastOne.amountForeign != null && oripa.lastOne.amountForeign !== ""
        ? Number(oripa.lastOne.amountForeign) || 0
        : Number(oripa.lastOne.amount) || 0;
      entries.push({
        id: uid(),
        type: "win",
        ts: Date.now() + 1,
        name: oripa.lastOne.name || "ラストワン賞",
        amount: lastOneAmount,
        isLastOne: true,
        sessionId: session.id,
      });
      awardLastOne = true;
    }
    appendLog(oripa.id, entries);
    if (awardLastOne) fireStamp("lastone");
  };
  const recordSessionWin = (session, tier) => {
    const amount = session.isForeign && tier.amountForeign != null && tier.amountForeign !== ""
      ? Number(tier.amountForeign) || 0
      : Number(tier.amount) || 0;
    appendLog(session.oripaId, [
      { id: uid(), type: "win", ts: Date.now(), name: tier.name, amount: amount, tierId: tier.id, sessionId: session.id },
    ]);
    fireStamp("win");
  };
  const setSessionHazureNotRedeemed = (session, count) => {
    appendLog(session.oripaId, [{ id: uid(), type: "hazureNotRedeemed", ts: Date.now(), count: Number(count) || 0, sessionId: session.id }]);
  };
  const undoLastSessionEntry = (session) => {
    const fullLog = logsById[session.oripaId] || [];
    const sessionEntries = fullLog.filter((e) => e.sessionId === session.id);
    if (!sessionEntries.length) return;
    const last = sessionEntries[sessionEntries.length - 1];
    const newLog = fullLog.filter((e) => e.id !== last.id);
    setLogsById((prev) => ({ ...prev, [session.oripaId]: newLog }));
    window.storage.set(`oripa:log:${session.oripaId}`, JSON.stringify(newLog), true).catch(() => {});
  };

  const settleToday = () => {
    const key = todayKey();
    if (settlements.some((s) => s.dateKey === key)) return;
    const stats = computeDailyStats(key, oripaList, logsById, sessions);
    saveSettlements([...settlements, { id: uid(), ...stats, settledAt: Date.now(), edited: false }]);
  };
  const updateSettlement = (id, updater) => {
    saveSettlements(settlements.map((s) => (s.id === id ? { ...updater(s), edited: true, editedAt: Date.now() } : s)));
  };

  return (
    <div className="min-h-screen flex flex-col" style={{ background: C.ink, color: C.paper, fontFamily: FONT_BODY }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap');
        * { box-sizing: border-box; }
        @keyframes stampPop {
          0% { transform: scale(2.2) rotate(-14deg); opacity: 0; }
          55% { transform: scale(0.92) rotate(-10deg); opacity: 1; }
          100% { transform: scale(1) rotate(-10deg); opacity: 1; }
        }
        @keyframes stampFade { 0%, 65% { opacity: 1; } 100% { opacity: 0; } }
        .stamp-wrap { animation: stampPop 0.32s ease-out, stampFade 1.1s ease-in forwards; }
        .tab-btn { transition: color .15s ease; }
        .press { transition: transform .08s ease; }
        .press:active { transform: scale(0.96); }
        ::-webkit-scrollbar { width: 0px; }
      `}</style>

      {/* header */}
      <div className="flex items-center gap-2 px-5 pt-6 pb-4" style={{ borderBottom: `1px solid ${C.line}` }}>
        <Ticket size={22} color={C.gold} />
        <div>
          <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 20, letterSpacing: 1 }}>オリパ電卓</div>
          <div style={{ fontSize: 11, color: C.muted, letterSpacing: 2 }}>ORIPA LEDGER</div>
        </div>
      </div>

      <div className="flex-1 overflow-y-auto px-5 pb-28 pt-4 max-w-md w-full mx-auto">
        {navTab === "active" && (
          <ActiveCustomers
            oripaList={oripaList}
            logsById={logsById}
            sessions={sessions}
            customers={customers}
            startSession={startSession}
            endSession={endSession}
            reopenSession={reopenSession}
            recordSessionDraw={recordSessionDraw}
            recordSessionWin={recordSessionWin}
            setSessionHazureNotRedeemed={setSessionHazureNotRedeemed}
            undoLastSessionEntry={undoLastSessionEntry}
          />
        )}

        {navTab === "store" &&
          (storeUnlocked ? (
            <StoreShell
              storeSubTab={storeSubTab}
              setStoreSubTab={setStoreSubTab}
              onLock={() => setStoreUnlocked(false)}
              oripaList={oripaList}
              logsById={logsById}
              addOripa={addOripa}
              updateOripa={updateOripa}
              deleteOripa={deleteOripa}
              clearLog={clearLog}
              customers={customers}
              sessions={sessions}
              settlements={settlements}
              settleToday={settleToday}
              updateSettlement={updateSettlement}
              updateCustomer={updateCustomer}
              deleteCustomer={deleteCustomer}
              staff={staff}
              addStaff={addStaff}
              updateStaff={updateStaff}
              deleteStaff={deleteStaff}
              shiftRequests={shiftRequests}
              deleteShiftRequest={deleteShiftRequest}
              confirmedShifts={confirmedShifts}
              publishConfirmedShift={publishConfirmedShift}
              timePunches={timePunches}
              managerPunch={managerPunch}
              deletePunch={deletePunch}
              storeGeo={storeGeo}
              saveStoreGeo={saveStoreGeo}
              buybackItems={buybackItems}
              addBuybackItem={addBuybackItem}
              updateBuybackItem={updateBuybackItem}
              deleteBuybackItem={deleteBuybackItem}
              adminUnlocked={adminUnlocked}
              setAdminUnlocked={setAdminUnlocked}
              expenses={expenses}
              addExpense={addExpense}
              updateExpense={updateExpense}
              deleteExpense={deleteExpense}
              staffCompensation={staffCompensation}
              setStaffPay={setStaffPay}
              stamp={stamp}
            />
          ) : (
            <PasswordGate onUnlock={() => setStoreUnlocked(true)} />
          ))}

        {navTab === "shift" && (
          <StaffShift
            staff={staff}
            addStaff={addStaff}
            shiftRequests={shiftRequests}
            submitShiftRequest={submitShiftRequest}
            confirmedShifts={confirmedShifts}
            timePunches={timePunches}
            punch={punch}
            storeGeo={storeGeo}
          />
        )}
        {navTab === "buyback" && <BuybackPublic items={buybackItems} />}
      </div>

      {/* bottom nav */}
      <div className="fixed bottom-0 left-0 right-0 flex justify-around items-stretch py-2" style={{ background: C.surface, borderTop: `1px solid ${C.line}` }}>
        <div className="max-w-md w-full mx-auto flex justify-around">
          <NavBtn icon={Users} label="営業中" active={navTab === "active"} onClick={() => setNavTab("active")} />
          <NavBtn icon={CalendarCheck} label="シフト" active={navTab === "shift"} onClick={() => setNavTab("shift")} />
          <NavBtn icon={ListPlus} label="買取表" active={navTab === "buyback"} onClick={() => setNavTab("buyback")} />
          <NavBtn icon={storeUnlocked ? LockOpen : Lock} label="店舗" active={navTab === "store"} onClick={() => setNavTab("store")} />
        </div>
      </div>
    </div>
  );
}

function NavBtn({ icon: Icon, label, active, onClick }) {
  return (
    <button onClick={onClick} className="tab-btn flex flex-col items-center gap-1 py-1 px-6">
      <Icon size={20} color={active ? C.gold : C.muted} />
      <span style={{ fontSize: 11, color: active ? C.gold : C.muted, fontWeight: active ? 700 : 500 }}>{label}</span>
    </button>
  );
}

// ==================================================================
// CUSTOMER: oripa selector
// ==================================================================
function OripaSelector({ oripaList, logsById, onSelect }) {
  if (oripaList.length === 0) {
    return (
      <div className="rounded-xl px-5 py-10 text-center" style={{ background: C.surface, border: `1px dashed ${C.line}`, color: C.muted }}>
        <Boxes size={28} className="mx-auto mb-3" color={C.muted} />
        <div style={{ fontSize: 13 }}>まだオリパが登録されていません</div>
        <div style={{ fontSize: 11, marginTop: 4 }}>店舗タブ(パスワード)から追加してください</div>
      </div>
    );
  }
  return (
    <div className="flex flex-col gap-3">
      <div style={{ fontSize: 12, color: C.muted, padding: "0 4px" }}>引きたいオリパを選んでください</div>
      {oripaList.map((o) => {
        const rate = Number(o.totalSlots) ? ((o.tiers.length / Number(o.totalSlots)) * 100).toFixed(1) : null;
        const log = logsById[o.id];
        const totalSlots = Number(o.totalSlots) || 0;
        const drawCount = log ? log.filter((e) => e.type === "draw").length : 0;
        const soldOut = totalSlots > 0 && drawCount >= totalSlots;
        return (
          <button
            key={o.id}
            onClick={() => onSelect(o.id)}
            className="press flex items-center justify-between rounded-xl px-4 py-4"
            style={{ background: C.surface, border: `1px solid ${C.line}`, opacity: soldOut ? 0.6 : 1 }}
          >
            <div className="text-left">
              <div className="flex items-center gap-2">
                <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 16 }}>{o.name}</span>
                {soldOut && (
                  <span style={{ fontSize: 10, color: C.coral, border: `1px solid ${C.coral}`, borderRadius: 999, padding: "1px 7px" }}>終了</span>
                )}
              </div>
              <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>
                {yen(o.price)} / 回{rate ? ` ・ 当選率 ${rate}%` : ""}
              </div>
            </div>
            <ChevronRight size={18} color={C.muted} />
          </button>
        );
      })}
    </div>
  );
}

// ==================================================================
// CUSTOMER: per-oripa record / history
// ==================================================================
function CustomerOripaView({
  oripa,
  fullLog,
  sessionStart,
  subTab,
  setSubTab,
  onBack,
  recordDraw,
  recordWin,
  setHazureNotRedeemed,
  undoLast,
  nextCustomer,
  deleteLogEntry,
  stamp,
}) {
  const sessionLog = useMemo(() => fullLog.filter((e) => e.ts >= sessionStart), [fullLog, sessionStart]);
  const guaranteeAmount = oripa.minGuarantee.enabled ? Number(oripa.minGuarantee.amount) || 0 : 0;
  const sessionStats = useMemo(() => computeTotals(sessionLog, guaranteeAmount), [sessionLog, guaranteeAmount]);
  const box = useMemo(() => computeBoxState(fullLog, oripa), [fullLog, oripa]);
  const diffColor = sessionStats.diff > 0 ? C.mint : sessionStats.diff < 0 ? C.coral : C.paper;
  const nextIsLastOne = oripa.lastOne.enabled && !box.lastOneAwarded && box.remainingSlots === 1;

  return (
    <div className="flex flex-col gap-5">
      <div className="flex items-center gap-2">
        <button onClick={onBack} className="press flex items-center justify-center rounded-full" style={{ width: 32, height: 32, background: C.surfaceAlt2 }}>
          <ArrowLeft size={16} color={C.paper} />
        </button>
        <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 17 }}>{oripa.name}</span>
      </div>

      <div className="flex gap-2">
        <button
          onClick={() => setSubTab("record")}
          className="press flex-1 rounded-lg py-2"
          style={{ background: subTab === "record" ? C.gold : C.surfaceAlt, color: subTab === "record" ? C.ink : C.muted, fontSize: 13, fontWeight: 700 }}
        >
          記録
        </button>
        <button
          onClick={() => setSubTab("history")}
          className="press flex-1 rounded-lg py-2"
          style={{ background: subTab === "history" ? C.gold : C.surfaceAlt, color: subTab === "history" ? C.ink : C.muted, fontSize: 13, fontWeight: 700 }}
        >
          履歴
        </button>
      </div>

      {subTab === "record" && (
        <RecordPanel
          oripa={oripa}
          stats={sessionStats}
          diffColor={diffColor}
          box={box}
          nextIsLastOne={nextIsLastOne}
          recordDraw={() => recordDraw(oripa)}
          recordWin={(t) => recordWin(oripa, t)}
          setHazureNotRedeemed={(count) => setHazureNotRedeemed(oripa, count)}
          undoLast={() => undoLast(oripa.id)}
          nextCustomer={() => nextCustomer(oripa.id)}
          hasSessionLog={sessionLog.length > 0}
          stamp={stamp}
        />
      )}
      {subTab === "history" && (
        <HistoryPanel sessionLog={sessionLog} stats={sessionStats} diffColor={diffColor} deleteEntry={(entryId) => deleteLogEntry(oripa.id, entryId)} />
      )}
    </div>
  );
}

function RecordPanel({ oripa, stats, diffColor, box, nextIsLastOne, recordDraw, recordWin, setHazureNotRedeemed, undoLast, nextCustomer, hasSessionLog, stamp }) {
  const [notRedeemedInput, setNotRedeemedInput] = useState(null); // null = not editing
  const totalSlots = Number(oripa.totalSlots) || 0;
  const soldOut = totalSlots > 0 && box.remainingSlots <= 0;
  const oddsTotal = box.remainingSlots;
  const oddsWins = box.remainingTiers.length;
  const oddsPct = oddsTotal > 0 ? (oddsWins / oddsTotal) * 100 : null;
  const oddsPerDraw = oddsWins > 0 ? oddsTotal / oddsWins : null;

  const openNotRedeemed = () => setNotRedeemedInput(String(stats.hazureNotRedeemedCount || 0));
  const confirmNotRedeemed = () => {
    setHazureNotRedeemed(notRedeemedInput);
    setNotRedeemedInput(null);
  };

  return (
    <div className="flex flex-col gap-5">
      {/* ticket stub summary (this customer's session) */}
      <div className="relative">
        <div className="rounded-t-2xl px-5 pt-5 pb-4 relative" style={{ background: C.surface, border: `1px solid ${C.line}`, borderBottom: "none" }}>
          <div className="flex justify-between items-start">
            <div>
              <div style={{ fontSize: 11, color: C.muted, letterSpacing: 1 }}>単価</div>
              <div style={{ fontFamily: FONT_MONO, fontSize: 16, fontWeight: 700 }}>{yen(oripa.price)} / 回</div>
            </div>
            <div className="text-right">
              <div style={{ fontSize: 11, color: C.muted, letterSpacing: 1 }}>設定当選率</div>
              <div style={{ fontFamily: FONT_MONO, fontSize: 16, fontWeight: 700, color: C.gold }}>
                {box.configuredRate != null ? `${oripa.tiers.length}/${oripa.totalSlots}` : "未設定"}
              </div>
            </div>
          </div>

          {stamp && (
            <div
              className="stamp-wrap absolute -top-3 right-4 rounded-full flex items-center justify-center"
              style={{
                width: 68,
                height: 68,
                border: `3px solid ${stamp === "lastone" ? C.gold : C.coral}`,
                color: stamp === "lastone" ? C.gold : C.coral,
                fontFamily: FONT_DISPLAY,
                fontWeight: 800,
                fontSize: stamp === "lastone" ? 12 : 15,
                background: "rgba(18,21,28,0.9)",
                textAlign: "center",
                lineHeight: 1.15,
              }}
            >
              {stamp === "lastone" ? "LAST\nONE" : "当選"}
            </div>
          )}

          <div className="grid grid-cols-2 gap-4 mt-4">
            <StatBlock label="引いた回数" value={`${stats.drawCount} 回`} />
            <StatBlock label="あたり数" value={`${stats.winCount} 個`} color={C.gold} />
            <StatBlock label="クジ合計金額" value={yen(stats.totalSpent)} color={C.coral} />
            <StatBlock label="あたり合計金額" value={yen(stats.totalWinAmount)} color={C.mint} />
          </div>
          <div className="flex justify-between items-center mt-3 pt-3" style={{ borderTop: `1px dashed ${C.line}` }}>
            <span style={{ fontSize: 11, color: C.muted }}>現在の当選確率</span>
            <span style={{ fontFamily: FONT_MONO, fontSize: 13, fontWeight: 700, color: C.gold }}>
              {oddsTotal > 0 ? `${oddsWins}/${oddsTotal}(${oddsPct.toFixed(1)}%)` : "—"}
            </span>
          </div>
          {oddsPerDraw != null && (
            <div className="flex justify-between items-center mt-1.5">
              <span style={{ fontSize: 11, color: C.muted }}>平均</span>
              <span style={{ fontFamily: FONT_MONO, fontSize: 12, color: C.paper }}>約{oddsPerDraw.toFixed(1)}回に1回</span>
            </div>
          )}
          {stats.hazureRedeemedCount > 0 && (
            <div className="flex justify-between items-center mt-2">
              <span style={{ fontSize: 11, color: C.muted }}>はずれ保証 ×{stats.hazureRedeemedCount}</span>
              <span style={{ fontFamily: FONT_MONO, fontSize: 12, color: C.muted }}>{yen(stats.totalHazureAmount)}</span>
            </div>
          )}
        </div>

        <div
          style={{
            height: 14,
            backgroundImage: `radial-gradient(circle 7px, ${C.ink} 7px, transparent 7px)`,
            backgroundSize: "16px 16px",
            backgroundPosition: "-2px -7px",
            backgroundColor: C.surface,
            border: `1px solid ${C.line}`,
            borderTop: "none",
            borderBottom: "none",
          }}
        />

        <div className="rounded-b-2xl px-5 py-4 flex items-center justify-between" style={{ background: C.surfaceAlt, border: `1px solid ${C.line}`, borderTop: "none" }}>
          <div className="flex items-center gap-2">
            {stats.diff >= 0 ? <TrendingUp size={18} color={diffColor} /> : <TrendingDown size={18} color={diffColor} />}
            <span style={{ fontSize: 13, color: C.muted }}>差引損益</span>
          </div>
          <span style={{ fontFamily: FONT_MONO, fontSize: 22, fontWeight: 700, color: diffColor }}>
            {stats.diff >= 0 ? "+" : ""}
            {yen(stats.diff)}
          </span>
        </div>
      </div>

      {nextIsLastOne && (
        <div className="rounded-xl px-4 py-3 flex items-center gap-2" style={{ background: "rgba(232,185,75,0.12)", border: `1px solid ${C.gold}`, color: C.gold }}>
          <Crown size={16} />
          <span style={{ fontSize: 12, fontWeight: 700 }}>
            次で最後の1回！{oripa.lastOne.name || "ラストワン賞"}({yen(oripa.lastOne.amount)})が確定でもらえます
          </span>
        </div>
      )}

      {soldOut ? (
        <div
          className="w-full rounded-2xl py-5 flex flex-col items-center gap-1"
          style={{ background: C.surfaceAlt, border: `1px solid ${C.line}`, color: C.muted }}
        >
          <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 18 }}>このオリパは終了しました</span>
          <span style={{ fontSize: 12 }}>総枚数({totalSlots}口)に達しました</span>
        </div>
      ) : (
        <button onClick={recordDraw} className="press w-full rounded-2xl py-5 flex flex-col items-center gap-1" style={{ background: C.gold, color: C.ink }}>
          <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 800, fontSize: 20 }}>1回引く</span>
          <span style={{ fontSize: 12, fontFamily: FONT_MONO }}>-{yen(oripa.price)}</span>
        </button>
      )}

      {/* win selection list */}
      <div>
        <div className="flex items-center gap-1 mb-2" style={{ color: C.muted, fontSize: 12 }}>
          <Sparkles size={13} />
          <span>当たったら下から選ぶ(選ぶと消えます)</span>
        </div>
        {box.remainingTiers.length === 0 ? (
          <div className="rounded-xl px-4 py-6 text-center" style={{ background: C.surfaceAlt, border: `1px dashed ${C.line}`, color: C.muted, fontSize: 13 }}>
            残りのあたりはありません
          </div>
        ) : (
          <div className="grid grid-cols-2 gap-2">

                <span style={{ fontSize: 12, color: C.muted }}>{t.name}</span>

            <span style={{ fontSize: 12, color: C.muted, display: "flex", alignItems: "center", gap: 6 }}>

          {notRedeemedInput === null ? (
            <div className="flex items-center justify-between">
              <span style={{ fontSize: 12, color: C.muted }}>

                <span style={{ fontFamily: FONT_MONO, color: C.paper, fontWeight: 700 }}>{stats.hazureNotRedeemedCount}枚</span>
              </span>
              <button onClick={openNotRedeemed} className="press rounded-lg px-3 py-1.5" style={{ border: `1px solid ${C.line}`, color: C.gold, fontSize: 12, fontWeight: 700 }}>
                入力する
              </button>
            </div>
          ) : (
            <div className="flex gap-2">
              <input
                type="number"
                inputMode="numeric"
                min="0"
                value={notRedeemedInput}
                onChange={(e) => setNotRedeemedInput(e.target.value)}
                autoFocus
                style={inputStyle}

              />

                更新
              </button>
              <button onClick={() => setNotRedeemedInput(null)} className="press rounded-lg px-3" style={{ border: `1px solid ${C.line}`, color: C.muted }}>
                <X size={16} />
              </button>
            </div>
          )}
          <div style={{ fontSize: 11, color: C.muted }}>
            保証対象:{stats.hazureRedeemedCount}枚 × {yen(oripa.minGuarantee.amount)} = {yen(stats.totalHazureAmount)}
          </div>
        </div>
      )}

      <div className="flex items-center justify-between pt-1">
        {hasSessionLog ? (
          <button onClick={undoLast} className="press flex items-center gap-1.5" style={{ color: C.muted, fontSize: 12 }}>
            <Undo2 size={14} />
            直前の記録を取り消す
          </button>
        ) : (
          <span />
        )}
        <button onClick={nextCustomer} className="press flex items-center gap-1.5" style={{ color: C.muted, fontSize: 12 }}>
          <RotateCcw size={14} />
          次のお客様へ
        </button>
      </div>
    </div>
  );
}

function HistoryPanel({ sessionLog, stats, diffColor, deleteEntry }) {
  const sorted = [...sessionLog].sort((a, b) => b.ts - a.ts);
  const fmtTime = (ts) => {
    const d = new Date(ts);
    return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
  };
  const rowIcon = (e) => {
    if (e.type === "draw") return <Ticket size={15} color={C.muted} />;
    if (e.type === "hazureNotRedeemed") return <ShieldCheck size={15} color={C.muted} />;
    if (e.isLastOne) return <Crown size={15} color={C.gold} />;
    return <Sparkles size={15} color={C.gold} />;
  };
  const rowLabel = (e) => (e.type === "draw" ? "1回引く" : e.type === "hazureNotRedeemed" ? `保証に出さない枚数を${e.count}枚に設定` : e.name);
  const rowAmount = (e) => (e.type === "draw" ? e.cost : e.type === "hazureNotRedeemed" ? null : e.amount);
  const rowSign = (e) => (e.type === "draw" ? "-" : "+");
  const rowColor = (e) => (e.type === "draw" ? C.coral : e.type === "hazureNotRedeemed" ? C.muted : C.mint);

  return (
    <div className="flex flex-col gap-5">
      <div className="rounded-xl p-4" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
        <div className="grid grid-cols-2 gap-4">
          <StatBlock label="引いた回数" value={`${stats.drawCount} 回`} />
          <StatBlock label="あたり数" value={`${stats.winCount} 個`} color={C.gold} />
          <StatBlock label="クジ合計金額" value={yen(stats.totalSpent)} color={C.coral} />
          <StatBlock label="あたり合計金額" value={yen(stats.totalWinAmount)} color={C.mint} />
        </div>
        {stats.hazureTotalCount > 0 && (
          <div className="flex justify-between items-center mt-2">
            <span style={{ fontSize: 12, color: C.muted }}>
              はずれ保証(保証対象{stats.hazureRedeemedCount}枚 / 対象外{stats.hazureNotRedeemedCount}枚)
            </span>
            <span style={{ fontFamily: FONT_MONO, fontSize: 13, color: C.muted }}>{yen(stats.totalHazureAmount)}</span>
          </div>
        )}
        <div className="flex justify-between items-center mt-4 pt-4" style={{ borderTop: `1px dashed ${C.line}` }}>
          <span style={{ fontSize: 13, color: C.muted }}>差引損益</span>
          <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 18, color: diffColor }}>
            {stats.diff >= 0 ? "+" : ""}
            {yen(stats.diff)}
          </span>
        </div>
      </div>

      <div className="flex flex-col gap-2">
        {sorted.length === 0 && <div style={{ fontSize: 13, color: C.muted, textAlign: "center", padding: "24px 0" }}>まだ記録がありません</div>}
        {sorted.map((e) => (
          <div key={e.id} className="flex items-center justify-between rounded-lg px-3 py-2.5" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
            <div className="flex items-center gap-2.5">
              {rowIcon(e)}
              <div>
                <div style={{ fontSize: 13 }}>{rowLabel(e)}</div>
                <div style={{ fontSize: 10, color: C.muted, fontFamily: FONT_MONO }}>{fmtTime(e.ts)}</div>
              </div>
            </div>
            <div className="flex items-center gap-3">
              {rowAmount(e) != null && (
                <span style={{ fontFamily: FONT_MONO, fontWeight: 700, fontSize: 14, color: rowColor(e) }}>
                  {rowSign(e)}
                  {yen(rowAmount(e))}
                </span>
              )}
              <button onClick={() => deleteEntry(e.id)}>
                <X size={14} color={C.muted} />
              </button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function PasswordGate({ onUnlock }) {
  const [pw, setPw] = useState("");
  const [err, setErr] = useState(false);

  const submit = () => {
    if (pw === STORE_PASSWORD) {
      onUnlock();
    } else {
      setErr(true);
      setPw("");
    }
  };

  return (
    <div className="flex flex-col items-center gap-4 pt-10">
      <div className="flex items-center justify-center rounded-full" style={{ width: 56, height: 56, background: C.surfaceAlt2 }}>
        <Lock size={22} color={C.gold} />
      </div>
      <div className="text-center">
        <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 16 }}>店舗側パスワード</div>
        <div style={{ fontSize: 12, color: C.muted, marginTop: 4 }}>設定・集計を見るにはパスワードが必要です</div>
      </div>
      <input
        type="password"
        inputMode="numeric"
        value={pw}
        onChange={(e) => {
          setPw(e.target.value);
          setErr(false);
        }}
        onKeyDown={(e) => e.key === "Enter" && submit()}
        placeholder="パスワード"
        style={{ ...inputStyle, textAlign: "center", letterSpacing: 4, maxWidth: 220 }}
      />
      {err && <div style={{ fontSize: 12, color: C.coral }}>パスワードが違います</div>}
      <button onClick={submit} className="press rounded-xl px-8 py-3" style={{ background: C.gold, color: C.ink, fontWeight: 700, fontSize: 14 }}>
        開く
      </button>
    </div>
  );
}
